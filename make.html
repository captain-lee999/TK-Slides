<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK 장표 변환기 v6.5 — SlideForge 파이프라인 목차 + 슬라이드별 '다른 안' + 고밀도 무여백 에디션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js" async defer></script>
<style>
  /* Default Theme: Official 농심태경 전사PPT양식 (TK Standard Forest + Royal Blue Lead) */
  :root, [data-theme="tk_official"] {
    --c-pri: #1E5A32;
    --c-sec: #3D7A5F;
    --c-rule: #003300;
    --c-lead: #0058B8;
    --c-acc: #1E5A32;
    --c-acc-soft: #E2EFDA;
    --c-tint: #E2EFDA;
    --c-cell-bg: #EAF2E5;
    --c-bg: #EBEEF2;
    --c-card: #F8FAFC;
    --c-ink: #0F172A;
    --c-muted: #546E7A;
    --c-line: #BFBFBF;
    --c-line-light: #DDE3DC;
    --c-band-head: #D9E2F3;
    --c-band-ink: #1F4E79;
    --c-band-bg: #F4F7FB;
    --c-tile-pri: #1F497D;
    --c-tile-num: #F59E0B;
    --c-tile-sec: #DCE6F2;
    --c-tile-sec-ink: #1F497D;
    --c-pos: #1565C0;
    --c-pos-bg: #E7EEF7;
    --c-neg: #C00000;
    --c-neg-bg: #FCE8EA;
    --c-warn: #D97706;
    --c-warn-bg: #FEF3C7;
    --ch-1: #1E6B34;
    --ch-2: #4F81BD;
    --ch-3: #C98124;
    --ch-4: #7A4F8C;
    --ch-5: #44546A;
  }
  [data-theme="mckinsey"] {
    --c-pri: #0F2C59;
    --c-sec: #1E4072;
    --c-rule: #0F2C59;
    --c-lead: #0066CC;
    --c-acc: #0066CC;
    --c-acc-soft: #E0F2FE;
    --c-tint: #EFF6FF;
    --c-cell-bg: #F0F6FF;
    --c-bg: #EBEEF2;
    --c-card: #F8FAFC;
    --c-ink: #0F172A;
    --c-muted: #475569;
    --c-line: #CBD5E1;
    --c-line-light: #E2E8F0;
    --c-band-head: #DBEAFE;
    --c-band-ink: #1E3A8A;
    --c-band-bg: #F8FAFC;
    --c-tile-pri: #0F2C59;
    --c-tile-num: #38BDF8;
    --c-tile-sec: #E0F2FE;
    --c-tile-sec-ink: #0F2C59;
    --ch-1: #0F2C59;
    --ch-2: #0066CC;
    --ch-3: #0284C7;
    --ch-4: #64748B;
    --ch-5: #94A3B8;
  }
  [data-theme="bain"] {
    --c-pri: #7A1C24;
    --c-sec: #991B1B;
    --c-rule: #450A0F;
    --c-lead: #B91C1C;
    --c-acc: #C8102E;
    --c-acc-soft: #FFE4E6;
    --c-tint: #FDF2F4;
    --c-cell-bg: #FFF5F5;
    --c-bg: #F4F4F5;
    --c-card: #FAFAFA;
    --c-ink: #18181B;
    --c-muted: #52525B;
    --c-line: #D4D4D8;
    --c-line-light: #E4E4E7;
    --c-band-head: #FEE2E2;
    --c-band-ink: #7A1C24;
    --c-band-bg: #FAFAFA;
    --c-tile-pri: #7A1C24;
    --c-tile-num: #FBBF24;
    --c-tile-sec: #FFE4E6;
    --c-tile-sec-ink: #7A1C24;
    --ch-1: #7A1C24;
    --ch-2: #C8102E;
    --ch-3: #E11D48;
    --ch-4: #52525B;
    --ch-5: #A1A1AA;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--c-bg);
    color: var(--c-ink);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Header Bar */
  .topbar {
    background: #FFFFFF;
    border-bottom: 1px solid var(--c-line);
    padding: 7px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    z-index: 20;
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-badge {
    background: var(--c-pri);
    color: #FFF;
    font-weight: 800;
    font-size: 11.5px;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .brand-title {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--c-ink);
    letter-spacing: -0.02em;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .btn {
    border: 1px solid var(--c-line);
    background: #FFFFFF;
    color: var(--c-ink);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn:hover { background: var(--c-tint); border-color: var(--c-pri); }
  .btn-pri {
    background: var(--c-pri);
    color: #FFFFFF;
    border-color: var(--c-pri);
  }
  .btn-pri:hover { filter: brightness(0.92); color: #FFF; }
  .btn-acc {
    background: var(--c-lead);
    color: #FFFFFF;
    border-color: var(--c-lead);
  }
  .btn-acc:hover { filter: brightness(0.92); color: #FFF; }
  .select-theme {
    border: 1px solid var(--c-line);
    background: #FFF;
    color: var(--c-ink);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4.5px 7px;
    border-radius: 5px;
    cursor: pointer;
  }
  .audit-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4.5px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .audit-pill.good { background: var(--c-pos-bg); color: var(--c-pos); border-color: #93C5FD; }
  .audit-pill.warn { background: var(--c-warn-bg); color: var(--c-warn); border-color: #FDE68A; }

  /* Main Split Workspace */
  .workspace {
    display: grid;
    grid-template-columns: minmax(300px, 29%) 1fr;
    gap: 12px;
    padding: 10px 12px;
    flex: 1;
    min-height: 0;
  }
  @media (max-width: 960px) {
    body { height: auto; overflow: auto; }
    .workspace { grid-template-columns: 1fr; height: auto; }
  }
  .editor-pane {
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
    border: 1px solid var(--c-line);
    border-radius: 6px;
    overflow: hidden;
    min-height: 360px;
  }
  .pane-head {
    padding: 7px 12px;
    background: var(--c-card);
    border-bottom: 1px solid var(--c-line-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--c-pri);
  }
  #input {
    flex: 1;
    width: 100%;
    border: none;
    resize: none;
    padding: 10px 12px;
    font: 12px/1.55 "Pretendard", "Noto Sans KR", monospace;
    color: var(--c-ink);
    background: #FFFFFF;
    outline: none;
  }
  .editor-foot {
    padding: 5px 12px;
    background: var(--c-card);
    border-top: 1px solid var(--c-line-light);
    font-size: 10.5px;
    color: var(--c-muted);
    display: flex;
    justify-content: space-between;
  }

  .preview-pane {
    overflow-y: auto;
    padding: 4px 8px 36px 4px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
    scroll-behavior: smooth;
  }

  /* Official 전사PPT양식 Slide Canvas (29.7cm x 21cm A4 Landscape Ratio = 1.414 : 1 -> 980px x 692px) */
  body.pptx-capture #out article.tk-slide { width: 980px !important; max-width: 980px !important; min-width: 980px !important; height: 693px !important; min-height: 693px !important; overflow: hidden !important; box-shadow: none !important; border-color: transparent !important; border-radius: 0 !important; }
  body.pptx-capture .no-print { display: none !important; }
  .tk-slide {
    flex-shrink: 0;
    --sl-font-body: 11.4px;
    --sl-line-pitch: 1.42;
    --sl-card-pad: 9px 12px;
    --sl-card-gap: 6.5px;
    width: 100%;
    max-width: 980px;
    min-height: 692px;
    background: #FFFFFF;
    border: 1px solid #C8D0D8;
    border-radius: 3px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    padding: 14px 24px 10px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .tk-slide.alt-active-pulse {
    border: 2px solid var(--c-lead);
    box-shadow: 0 0 0 4px rgba(0, 88, 184, 0.18), 0 8px 24px rgba(15, 23, 42, 0.14);
  }
  @media (max-width: 768px) {
    .tk-slide { min-height: 540px; padding: 12px 14px; }
  }

  /* Slide 1: Official 전사PPT양식 Cover Slide */
  .tk-cover {
    background: #FFFFFF;
    color: #000000;
    justify-content: center;
    align-items: center;
    padding: 40px 48px;
    overflow: hidden;
  }
  .cover-tree {
    position: absolute;
    left: 0;
    top: 0;
    width: 33.6%;
    height: 100%;
    object-fit: cover;
    object-position: left top;
    pointer-events: none;
    z-index: 1;
  }
  .cover-slogan {
    position: absolute;
    top: 18px;
    right: 28px;
    font-size: 18px;
    font-weight: 800;
    color: #000000;
    letter-spacing: -0.02em;
    z-index: 2;
  }
  .cover-center-box {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 82%;
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .cover-title {
    font-size: 31px;
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -0.03em;
    color: #000000;
    margin-bottom: 12px;
    word-break: keep-all;
  }
  .cover-sub {
    font-size: 14.5px;
    font-weight: 500;
    color: #595959;
    margin-bottom: 22px;
  }
  .cover-date {
    font-size: 16.5px;
    font-weight: 600;
    color: #000000;
    margin-bottom: 52px;
  }
  .cover-dept {
    font-size: 15px;
    font-weight: 600;
    color: #000000;
    margin-bottom: 28px;
  }
  .cover-nstk-logo {
    height: 38px;
    width: auto;
    object-fit: contain;
  }
  .cover-brand-logos {
    position: absolute;
    right: 22px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 2;
  }

  /* Official Top Header Bar & Vg Emblem for TOC & Body Slides */
  .sl-top-wrap {
    position: relative;
    padding-right: 54px;
    margin-bottom: 4px;
  }
  .sl-vg-logo {
    position: absolute;
    right: 0;
    top: -4px;
    width: 44px;
    height: 44px;
    object-fit: contain;
  }
  .sl-title-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-bottom: 5px;
    border-bottom: 2.5px solid var(--c-rule);
    flex-wrap: wrap;
  }
  .sl-title {
    font-size: 19.5px;
    font-weight: 800;
    color: #000000;
    letter-spacing: -0.03em;
  }
  .sl-header-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .sl-flow-tag {
    font-size: 10.5px;
    color: var(--c-muted);
    font-weight: 700;
  }

  /* Per-Slide '다른 안' Controls (Restored pre-v5.4 + Direct Selector Dropdown) */
  .sl-alt-bar {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #F1F5F9;
    border: 1px solid #CBD5E1;
    border-radius: 5px;
    padding: 2px 5px;
  }
  .btn-alt-cycle {
    background: var(--c-pri);
    color: #FFFFFF;
    border: none;
    border-radius: 4px;
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 800;
    padding: 3px 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: all 0.15s ease;
  }
  .btn-alt-cycle:hover {
    background: var(--c-lead);
    transform: translateY(-0.5px);
  }
  .select-alt-direct {
    border: 1px solid #CBD5E1;
    background: #FFFFFF;
    color: var(--c-ink);
    font-family: inherit;
    font-size: 10.2px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 3px;
    cursor: pointer;
    max-width: 175px;
  }
  .sl-density-badge {
    font-size: 9.8px;
    font-weight: 800;
    color: var(--c-pri);
    background: var(--c-tint);
    padding: 2px 6px;
    border-radius: 3px;
  }
  @media print {
    .no-print { display: none !important; }
  }

  /* Official Action Lead & Sub-message */
  .sl-fact-line { margin:4px 0 0 18px; display:flex; flex-wrap:wrap; gap:2px 14px; font-size:11px; color:#334155; line-height:1.35; border-left:3px solid var(--c-pri); padding:1px 0 1px 8px; }
  .sl-fact-line b { color:var(--c-pri); font-weight:800; margin-right:2px; }
  .sl-fact-line i { font-style:normal; font-weight:700; color:#1F4E79; }
  .sl-lead-wrap {
    padding: 3px 2px 5px 2px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sl-lead {
    font-size: 15px;
    font-weight: 800;
    color: var(--c-lead);
    letter-spacing: -0.02em;
    line-height: 1.3;
  }
  .sl-sub {
    font-size: 11.2px;
    color: #1F2937;
    padding-left: 18px;
    font-weight: 600;
  }
  .hl-focal {
    color: var(--c-lead);
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* SlideForge Pipeline TOC Layout (14_CODE5_DSLInterpreter.gs renderToc 100% Port) */
  .sf-toc-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--c-pri);
    letter-spacing: 0.04em;
  }
  .sf-toc-story {
    margin: 8px 4px 10px 4px;
    padding: 9px 14px;
    background: #F4F7F4;
    border-left: 4px solid var(--c-pri);
    color: #1A4331;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.42;
  }
  .sf-toc-grid {
    flex: 1;
    display: grid;
    gap: 0 28px;
    margin: 4px 4px 6px 4px;
    align-items: stretch;
    position: relative;
  }
  .sf-toc-grid.cols-1 {
    grid-template-columns: 1fr;
  }
  .sf-toc-grid.cols-2 {
    grid-template-columns: 1fr 1fr;
  }
  .sf-toc-grid.cols-3 {
    grid-template-columns: 1fr 1fr 1fr;
  }
  .sf-toc-col {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .sf-toc-col:not(:first-child)::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 4px;
    bottom: 4px;
    width: 1px;
    background: var(--c-line-light);
  }
  .sf-toc-row {
    flex: 1;
    display: grid;
    grid-template-columns: 52px 1fr 36px;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--c-line-light);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .sf-toc-row:hover {
    background: #F4F9F5;
  }
  .sf-toc-row:last-child {
    border-bottom: none;
  }
  .sf-toc-num {
    font-size: 30px;
    font-weight: 900;
    color: var(--c-sec);
    line-height: 1;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }
  .sf-toc-num.pad2 {
    font-size: 26px;
  }
  .sf-toc-main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    min-width: 0;
  }
  .sf-toc-item-title {
    font-size: 15px;
    font-weight: 800;
    color: #1A1A1A;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sf-toc-item-keys {
    font-size: 11px;
    font-weight: 500;
    color: var(--c-muted);
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sf-toc-page {
    font-size: 12px;
    font-weight: 700;
    color: var(--c-muted);
    text-align: right;
  }

  /* High-Density Zero-Void Body Layout (충전율 92~96% 강제) */
  .sl-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: stretch;
    margin: 2px 0;
    min-height: 0;
  }
  .sl-body.side-split {
    display: grid;
    grid-template-columns: 1.22fr 1fr;
    gap: 10px;
    align-items: stretch;
  }
  .sl-body.side-split-rev {
    display: grid;
    grid-template-columns: 1fr 1.22fr;
    gap: 10px;
    align-items: stretch;
  }
  .sl-body.side-equal {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-items: stretch;
  }
  .sl-body.stack-split {
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: stretch;
  }
  .sl-body.stack-split > .diag-wrap {
    display: flex;
    flex-direction: column;
    justify-content: stretch;
  }
  .sl-body.stack-split > .diag-wrap:first-child {
    flex: 1.35;
  }
  .sl-body.stack-split > .diag-wrap:last-child {
    flex: 1;
  }
  .sl-body.stack-split > .diag-wrap.compact-aux {
    flex: 0 0 auto;
  }
  .diag-wrap {
    display: flex;
    flex-direction: column;
    justify-content: stretch;
    min-width: 0;
    min-height: 0;
    flex: 1;
  }
  .diag-wrap > * {
    flex: 1;
  }

  /* Official Consulting Cards & Pillars (Stretched to eliminate hollow space) */
  .tk-grid {
    display: grid;
    gap: 8px;
    align-items: stretch;
    flex: 1;
    height: 100%;
  }
  .tk-card {
    background: var(--c-cell-bg);
    border: 1px solid var(--c-line);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    height: 100%;
  }
  .tk-card.focal {
    border: 2px solid #A9844A;
    box-shadow: 0 2px 8px rgba(169, 132, 74, 0.14);
  }
  .tk-card-head {
    background: var(--c-pri);
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 800;
    padding: 5.5px 10px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tk-card.focal .tk-card-head {
    background: #003300;
  }
  .tk-card-items {
    padding: var(--sl-card-pad);
    display: flex;
    flex-direction: column;
    gap: var(--sl-card-gap);
    flex: 1;
    justify-content: space-evenly;
    background: #FFFFFF;
  }
  .tk-line {
    font-size: var(--sl-font-body);
    line-height: var(--sl-line-pitch);
    color: #111827;
    display: flex;
    align-items: baseline;
    gap: 5px;
    word-break: keep-all;
  }
  .tk-line-key {
    font-weight: 800;
    color: #000000;
    flex-shrink: 0;
  }
  .tk-bignum {
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding: 4px 8px;
    background: #F4F9F5;
    border-left: 3.5px solid var(--c-pri);
  }
  .tk-bignum-val {
    font-size: 15.5px;
    font-weight: 900;
    color: var(--c-pri);
    flex-shrink: 0;
  }
  .tk-bignum-desc {
    font-size: 11px;
    font-weight: 700;
    color: #1F2937;
  }
  .tk-mk {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 3px;
    font-size: 10.5px;
    font-weight: 900;
    flex-shrink: 0;
  }
  .tk-mk.pos { color: var(--c-pos); }
  .tk-mk.neg { color: var(--c-neg); }
  .tk-mk.warn { color: var(--c-neg); }
  .tk-mk.lvl { color: #1E4072; font-size: 11px; }
  .tk-concl {
    background: var(--c-tint);
    color: #003300;
    font-size: 11px;
    font-weight: 800;
    padding: 5.5px 10px;
    border-top: 1px solid rgba(30, 90, 50, 0.2);
    margin-top: auto;
  }

  /* Zero-Overlap Metric Tiles */
  .tk-metric-strip {
    display: grid;
    gap: 8px;
    width: 100%;
    height: 100%;
    align-items: stretch;
  }
  .tk-metric-tile {
    padding: 9px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-radius: 2px;
    min-width: 0;
    border: 1px solid var(--c-line);
  }
  .tk-metric-tile.pri {
    background: var(--c-tile-pri);
    color: #FFFFFF;
    border-color: var(--c-tile-pri);
  }
  .tk-metric-tile.sec {
    background: var(--c-tile-sec);
    color: var(--c-tile-sec-ink);
  }
  .tk-metric-num {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -0.03em;
    flex-shrink: 0;
  }
  .tk-metric-tile.pri .tk-metric-num { color: var(--c-tile-num); }
  .tk-metric-tile.sec .tk-metric-num { color: var(--c-tile-sec-ink); }
  .tk-metric-desc {
    font-size: 11.8px;
    font-weight: 800;
    line-height: 1.3;
    word-break: keep-all;
    flex: 1;
  }

  /* Official Tables & Matrices (Full Vertical Stretch) */
  .tk-table {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    font-size: var(--sl-font-body);
  }
  .tk-table th {
    background: var(--c-tint);
    color: #003300;
    font-weight: 800;
    padding: 6.5px 8px;
    text-align: center;
    border: 1px solid var(--c-line);
    border-bottom: 2px solid var(--c-pri);
  }
  .tk-table td {
    padding: 6.5px 9px;
    border: 1px solid var(--c-line);
    background: #FFFFFF;
    vertical-align: middle;
    word-break: keep-all;
    line-height: var(--sl-line-pitch);
  }
  .tk-table td.row-head {
    background: var(--c-pri);
    color: #FFFFFF;
    font-weight: 800;
    text-align: center;
    width: 17%;
  }
  .tk-table tr.focal-row td:not(.row-head) {
    background: #FFFFCC;
    font-weight: 700;
  }

  /* Official Bottom Fact & Reserve Band (Guaranteed High-Density Bottom Anchor) */
  .sl-fact-band {
    display: flex;
    align-items: stretch;
    border: 1px solid #CBD5E1;
    min-height: 44px;
    margin-top: 5px;
  }
  .fact-band-head {
    background: var(--c-band-head);
    color: var(--c-band-ink);
    font-weight: 800;
    font-size: 11px;
    width: 104px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px 6px;
  }
  .fact-band-cells {
    background: var(--c-band-bg);
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  }
  .fact-cell {
    padding: 5px 10px;
    border-left: 1px solid #CBD5E1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1.5px;
  }
  .fact-cell-k {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--c-band-ink);
  }
  .fact-cell-v {
    font-size: 10.3px;
    color: #1E293B;
    word-break: keep-all;
    line-height: 1.3;
  }

  .sl-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9.5px;
    color: #595959;
    padding-top: 4px;
    margin-top: 2px;
  }

  /* Modal for 10-Point Quality Audit */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: #FFFFFF;
    border-radius: 8px;
    max-width: 760px;
    width: 100%;
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .modal-head {
    padding: 14px 18px;
    background: var(--c-pri);
    color: #FFFFFF;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: 14px;
  }
  .modal-body {
    padding: 16px 18px;
    overflow-y: auto;
    font-size: 12.2px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .audit-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 5px;
    background: var(--c-card);
    border: 1px solid var(--c-line-light);
  }
</style>
</head>

5c \ubcc0\ud658\uae30(v6.4)\uac00 \uc804\uc0acPPT\uc591\uc2dd(`29.7cm \u00d7 21cm`) \uc704\uc5d0 \uacfc\ub3c4\ud55c \uc5ec\ubc31\uc774\ub098 \uc694\uc18c \uacb9\uce68 \uc5c6\uc774 \uace0\ubc00\ub3c4 \uc2ac\ub77c\uc774\ub4dc\ub97c \uadf8\ub9ac\ub824\uba74 \uc544\ub798 **5\uac00\uc9c0 \ud30c\uc11c \uaddc\uaca9**\uc744 100% \uc9c0\ucf1c\uc57c \ud55c\ub2e4.\n\n1. **\uc7a5 \uba38\ub9ac \ubc0f \uc815\uc218 \uc804\uc6a9 \ubc88\ud638 \uccb4\uacc4 (\ub85c\ub9c8\uc790 `\u2160\u00b7\u2161\u00b7\u2162` \uc808\ub300 \uc0ac\uc6a9 \uae08\uc9c0)**\n   - **\ud45c\uc9c0**: `### [\ud45c\uc9c0] : \uc81c\ubaa9 (\ubd80\uc81c : \ubd80\uc81c\ubb38 \u00b7 '26.11)` \u2014 \ubd80\uc81c\ub294 \ub9e8 \ub05d \uad04\ud638 \uc548 `\ubd80\uc81c :` \ub4a4\uc5d0 \uc801\uace0, `\u00b7` \ub4a4 \ub9c8\uc9c0\ub9c9 \uc870\uac01\uc5d0 \uc22b\uc790\uac00 \ub4e4\uc5b4\uac00\uba74 \ub0a0\uc9dc\ub85c \uc778\uc2dd\ud55c\ub2e4.\n   - **\ubaa9\ucc28**: `### [\ubaa9\ucc28]` \u2014 SlideForge \ud30c\uc774\ud504\ub77c\uc778 \ubc29\uc2dd\uc73c\ub85c \ub80c\ub354\ub9c1\ub418\uba70, \ub85c\ub9c8\uc790\ub97c \uc808\ub300 \uc4f0\uc9c0 \uc54a\uace0 \uc815\uc218\ub85c\ub9cc \ud45c\uae30\ud55c\ub2e4.\n   - **\ubcf8\ubb38 (\uc7a5\ud45c \uc218\uc5d0 \ub530\ub978 \uc815\uc218 \ud45c\uae30 \uc774\uc6d0\ud654 \uaddc\uce59)**:\n     - **\ubcf8\ubb38 7\uc7a5 \uc774\ub0b4(`1~7\uc7a5`)**: `### \ubcf8\ubb38 N : N. \uc81c\ubaa9` \u2014 \ub2e8\uc77c \uc815\uc218\ub9cc \uc0ac\uc6a9\ud55c\ub2e4(\uc608: `### \ubcf8\ubb38 1 : 1. \ubb3c\ub958\uc13c\ud130 \uc790\ub3d9\ud654 1\ucc28 \uc131\uacfc`, `### \ubcf8\ubb38 2 : 2. \uacf5\uc815\ubcc4 \uac00\uce58 \uc0ac\uc2ac\uacfc \uc624\ub958 \uc6d0\uc778`).\n     - **\ubcf8\ubb38 8\uc7a5 \uc774\uc0c1(`8\uc7a5~`)**: `### \ubcf8\ubb38 N : M-K. \uc81c\ubaa9` \u2014 \uc7a5-\uc808 \uacc4\uce35 \uc815\uc218\ub97c \uc0ac\uc6a9\ud55c\ub2e4(\uc608: `### \ubcf8\ubb38 1 : 1-1. \uac2d \ubd84\uc11d\uacfc \ub4dd\uc2e4 \uc800\uc6b8 \ub3c4\uc2dd`, `### \ubcf8\ubb38 2 : 1-2. \uc131\uc219\ub3c4 \uc0ac\ub2e4\ub9ac\uc640 \uc591\uadf9 \uc2a4\ud399\ud2b8\ub7fc`).\n     - \uc5b4\ub5a0\ud55c \uacbd\uc6b0\uc5d0\ub3c4 \ubaa9\ucc28\uc640 \ubcf8\ubb38 \ub300\uc81c\ubaa9\uc5d0 \ub85c\ub9c8\uc790(`\u2160`, `\u2161`, `\u2162`, `I`, `II`)\ub97c \uc4f0\uc9c0 \uc54a\ub294\ub2e4.\n   - **\uae08\uc9c0**: \uccab \uc7a5 \uba38\ub9ac(`### [\ud45c\uc9c0]`) \uc55e\uc758 \uc778\uc0ac\ub9d0\u00b7\uc548\ub0b4\ubb38, \uad6c\ubd84\uc120(`---`), \ucf54\ub4dc \ube14\ub85d \uae30\ud638(`` ``` ``)\ub294 \uc4f0\uc9c0 \uc54a\ub294\ub2e4. \ub9c8\uc9c0\ub9c9 \uc7a5\uc758 `- \ucd9c\ucc98:` \uc904\uc5d0\uc11c \ub2f5\ubcc0\uc744 \uc989\uc2dc \ub9c8\uce5c\ub2e4.\n2. **\uc7a5 \uc548\uc758 \ud0a4 \uc904 (\ud55c \uc904\uc5d0 \ud0a4 \ud558\ub098) \ubc0f \uace0\ubc00\ub3c4 \ucda9\uc804 \uaddc\uce59**\n   - **\ud615\uc2dd**: `- \ud0a4: \uac12` (\uae00\uba38\ub9ac\ub294 `-`\ub97c \uae30\ubcf8\uc73c\ub85c \uc4f0\uba70, \uc6d0\uace0 \uc804\uccb4\uc5d0\uc11c \uad75\uc740 \uae00\uc528 `**` \ud45c\uc2dc\ub294 \uc4f0\uc9c0 \uc54a\ub294\ub2e4).\n   - **\uc778\uc2dd\ud558\ub294 13\uac1c \ud0a4**: `\ubb3c\uc74c` \u00b7 `\uc5f0\uacb0` \u00b7 `\ube44\uc911` \u00b7 `\ub9ac\ub4dc` \u00b7 `\uc11c\ube0c\uba54\uc2dc\uc9c0` \u00b7 `\uc8fc \ub3c4\uc2dd` \u00b7 `\uadfc\uac70 \ub3c4\uc2dd` \u00b7 `\ubcf8\ubb38` \u00b7 `\uc0ac\uc2e4 \ub760` \u00b7 `\uac15\uc870` \u00b7 `\ubc1b\uce68` \u00b7 `\uc608\ube44` \u00b7 `\ucd9c\ucc98` (\uc774 \ubc16\uc758 \ud0a4\ub294 \ubcc0\ud658\uae30\uac00 \ubb34\uc2dc\ud568).\n   - **\uace0\ubc00\ub3c4\u00b7\ubb34\uc5ec\ubc31 \ud544\uc218 \uae30\uc900 (SlideForge `04_SD-C \u00a729\u00b7\u00a733` \uacb0\ud569)**:\n     - \ub9cc\uc131\uc801\uc778 \uc800\ubc00\ub3c4\u00b7\ud558\ub2e8 \uc5ec\ubc31\uc744 \uc6d0\ucc9c \ucc28\ub2e8\ud558\uae30 \uc704\ud574 \uc2ac\ub77c\uc774\ub4dc\ub9c8\ub2e4 **\ubcf8\ubb38 \uae00\uc790 \uc218 280~420\uc790, \uad6c\uccb4\uc801 \uc0ac\uc2e4\u00b7\uc218\uce58 10~14\uac1c, \ubcf8\ubb38 \uc904 \uc218 12~20\uc904**(\uac01 \ubcf8\ubb38 \uce78\ub2f9 **4\uc904** + \uc77c\ubc18 \ub3c4\uc2dd \uce78 \ub05d `\uacb0\ub860:` 1\uc904 + `\uc0ac\uc2e4 \ub760:` 3~4\ud56d\ubaa9 + `\uc608\ube44:` 4~6\uc904)\uc744 \ubc18\ub4dc\uc2dc \ucc44\uc6b4\ub2e4. \uce78\ub2f9 2\uc904 \uc774\ud558\uc758 \ube48\uc57d\ud55c \uc11c\uc220\uc740 \uc5c4\uaca9\ud788 \uae08\uc9c0\ud55c\ub2e4.\n   - **\ud0a4\ubcc4 \ud544\uc218 \uaddc\uce59**:\n     - `\ub9ac\ub4dc`: \ud55c \uc904 \ubb38\uc7a5(`\u2713 `\ub85c \uc2dc\uc791, 40\uc790 \uc774\ub0b4). \uc804\uc0acPPT\uc591\uc2dd \uc0c1\ub2e8 \uccad\uc0c9(`#0058B8`) \ub9ac\ub4dc \uc601\uc5ed\uc5d0 \ud55c \uc904\ub85c \ub4e4\uc5b4\uac00\ubbc0\ub85c 40\uc790\ub97c \ub118\uae30\uc9c0 \uc54a\ub294\ub2e4.\n     - `\uc11c\ube0c\uba54\uc2dc\uc9c0`: \ubc14\ub85c \ub2e4\uc74c \uc904\uc5d0 \ub4e4\uc5ec\uc368\uc11c `  - \uadfc\uac70: \u2026` \ud55c \uc904\ub9cc \uc801\ub294\ub2e4(`\uc2e4\ud589:`\u00b7`\u261e` \uc904\uc740 \uc4f0\uc9c0 \uc54a\ub294\ub2e4).\n     - `\ubcf8\ubb38`: `- \ubcf8\ubb38:` \ub2e4\uc74c \uc904\ubd80\ud130 \uce78(2\uce78 \ub4e4\uc5ec\uc4f0\uae30)\uacfc \uc904(4\uce78 \ub4e4\uc5ec\uc4f0\uae30)\uc744 \uc801\ub294\ub2e4. \ub2e4\ub978 \ud0a4 \uc904\uc774 \ub098\uc624\uba74 \ubcf8\ubb38\uc774 \ub05d\ub09c\ub2e4.\n     - `\uac15\uc870`: **\ub9ac\ub4dc\ub098 \ubcf8\ubb38 \uce78 \uc904\u00b7\ub3c4\uc2dd \uac12\uc5d0 \uc788\ub294 \uae00\uc790 \uadf8\ub300\ub85c(\ub2e8\uc704\u00b7\ub744\uc5b4\uc4f0\uae30 \uc77c\uce58)** \ub2e8 \ud558\ub098\ub9cc \uc801\ub294\ub2e4(60-30-10 \uc0c9\uc0c1 \uaddc\uce59\uc5d0 \ub530\ub77c \uc774 \ud56d\ubaa9\uc5d0\ub9cc 10% \ud3ec\uceec \uac15\uc870\uc0c9\uc774 \ubd80\uc5ec\ub428).\n     - `\uc0ac\uc2e4 \ub760`: \ubaa8\ub4e0 \uc7a5\uc5d0 `\uc0ac\uc2e4 \ub760: \ub760 \uc774\ub984 | \ud56d\ubaa91: \ub0b4\uc6a9 / \ud56d\ubaa92: \ub0b4\uc6a9 / \ud56d\ubaa93: \ub0b4\uc6a9 / \ud56d\ubaa94: \ub0b4\uc6a9`\uc744 \uc791\uc131\ud574 \ud558\ub2e8 \uc5ec\ubc31 \uc5c6\uc774 \uc2e4\uc99d \uadfc\uac70\ub97c \uaf49 \ucc44\uc6b4\ub2e4.\n     - `\uc608\ube44`: `- \ucd9c\ucc98:` \ubc14\ub85c \uc704\uc5d0 4~6\uc904 \uc791\uc131\ud55c\ub2e4(\ubcc0\ud658\uae30\uac00 \uce74\ub4dc \ub0b4\ubd80 \ube48 \uacf5\uac04 \ubc0f \ud558\ub2e8 \uc2e4\uc99d \ub760\ub85c 100% \uc790\ub3d9 \ud761\uc218\ud558\uc5ec \ucda9\uc804\uc728 92% \uc774\uc0c1\uc744 \uac15\uc81c\ud568).\n     - `\ucd9c\ucc98`: \uc7a5\uc758 \ub9e8 \ub9c8\uc9c0\ub9c9 \uc904\uc5d0 `- \ucd9c\ucc98: \u203b \u2026 \uc7ac\uad6c\uc131` \ud615\uc2dd\uc73c\ub85c \uc801\ub294\ub2e4.\n   - **\ubaa9\ucc28 \uc904 \uaddc\uce59 (SlideForge \ud558\uc774\ube0c\ub9ac\ub4dc \ubc29\uc2dd)**:\n     - `- \uc2a4\ud1a0\ub9ac \ub77c\uc778: <\ub371 \uc804\uccb4\uc758 \ucd5c\uc885 \uacb0\ub860 \ud55c \ubb38\uc7a5>`\n     - `- 1. <\ubb36\uc74c \uc774\ub984> : 1. <\uc81c\ubaa9> / 2. <\uc81c\ubaa9>` (\uc815\uc218 \ubc88\ud638\ub9cc \uc0ac\uc6a9, \ubb36\uc74c 2~4\uac1c, \ud56d\ubaa9 \ucd1d\uc218 = \ubcf8\ubb38 \uc2ac\ub77c\uc774\ub4dc \uc7a5 \uc218)\n     - \ubcc0\ud658\uae30\ub294 \uc6d0\uace0\uc758 `\uc2a4\ud1a0\ub9ac \ub77c\uc778:`\uacfc \ubcf8\ubb38 \uc2ac\ub77c\uc774\ub4dc(`### \ubcf8\ubb38 N`)\uc758 \uc81c\ubaa9\u00b7\ubcf8\ubb38 \uc18c\uc8fc\uc81c\u00b7\ub3c4\uc2dd \ud0a4\uc6cc\ub4dc 3~4\uac1c\ub97c \uc790\ub3d9\uc73c\ub85c \uc77d\uc5b4 SlideForge \ud45c\uc900 \ubaa9\ucc28(1~7\uc7a5 1\uc5f4 \uc815\uc218 \ubc88\ud638+\uc81c\ubaa9+\ud558\uc704 \ud0a4\uc6cc\ub4dc+\ucabd\uc218 / 8\uc7a5 \uc774\uc0c1 2\uc5f4 \uc815\uc218 \ubc88\ud638+\uc7a5\uc808 \uc81c\ubaa9+\ud558\uc704 \ud0a4\uc6cc\ub4dc+\ucabd\uc218)\ub97c \uc0dd\uc131\ud55c\ub2e4.\n3. **\ub3c4\uc2dd \uc904 (`\uc8fc \ub3c4\uc2dd:` \u00b7 `\uadfc\uac70 \ub3c4\uc2dd:`)\uacfc `|`\u00b7`/` \uad6c\ubd84 \uaddc\uce59**\n   - **\ud615\uc2dd**: `\ub3c4\uc2dd \uc774\ub984 | \ud0a4: \uac12 | \ud0a4: \uac12 | \uce781 / \uce782 / \uce783`\n   - **\uad6c\ubd84\uc790 \uc5c4\uc218**: \uce78(\ud30c\ub77c\ubbf8\ud130) \uad6c\ubd84\uc740 `|`, \ubaa9\ub85d \uad6c\ubd84\uc740 `/`\uc774\ub2e4. \ub530\ub77c\uc11c **\ub3c4\uc2dd \uac12\u00b7\ubcf8\ubb38 \uc904\u00b7\uc0ac\uc2e4 \ub760\u00b7\uc608\ube44 \ub0b4\uc6a9 \uc548\uc5d0 \uad6c\ubd84\uc790 \uc544\ub2cc `|`\ub098 `/`\ub97c \uc808\ub300 \uc4f0\uc9c0 \uc54a\ub294\ub2e4**(\uc608: `120\uac74/\uc77c` \u2717 \u2192 `\uc77c 120\uac74` \u25cb, `A/B \ud14c\uc2a4\ud2b8` \u2717 \u2192 `A\u00b7B \ud14c\uc2a4\ud2b8` \u25cb).\n   - **\uce78 \uc774\ub984 \ubaa9\ub85d \uba85\uc2dc**: \ud0a4 \uc5c6\uc774 \uc4f4 \uc870\uac01 `| \uce781 / \uce782 / \uce783`\uc740 \ubcf8\ubb38 \uce78 \uc774\ub984 \ubaa9\ub85d\uc73c\ub85c \uc77d\ud78c\ub2e4. \ubcf5\uc0ac \uacfc\uc815\uc5d0\uc11c \ub4e4\uc5ec\uc4f0\uae30\uac00 \uc0ac\ub77c\uc838\ub3c4 \uce78 \uacbd\uacc4\ub97c \uc644\ubcbd\ud788 \uc7a1\ub3c4\ub85d \uce78\uc744 \uc4f0\ub294 \uc8fc \ub3c4\uc2dd \ub05d\uc5d0 `| \uce781 / \uce782 / \uce783`\uc744 \ud568\uaed8 \uc801\ub294\ub2e4.\n   - **\uc8fc \ub3c4\uc2dd + \uadfc\uac70 \ub3c4\uc2dd \ubcf5\uc218 \uad6c\uc131 \uc6d0\uce59**: \ud55c \uc7a5\uc774 \ub2e8\uc870\ub86d\uac70\ub098 \ube44\uc5b4 \ubcf4\uc774\uc9c0 \uc54a\ub3c4\ub85d \ubaa8\ub4e0 \ubcf8\ubb38 \uc7a5\uc740 \uc6d0\uce59\uc801\uc73c\ub85c **`\uc8fc \ub3c4\uc2dd` + `\uadfc\uac70 \ub3c4\uc2dd` 2\uc885 \uacb0\ud569 \uad6c\uc131**\uc744 \uae30\ubcf8\uc73c\ub85c \uc0bc\ub294\ub2e4(\uc2ac\ub77c\uc774\ub4dc\ubcc4 `'\ub2e4\ub978 \uc548 \u21bb'` \ubc84\ud2bc\uc774 \uc8fc \ub3c4\uc2dd\uacfc \uadfc\uac70 \ub3c4\uc2dd\uc758 \ubc30\uce58 \uad6c\ub3c4 \ubc0f 35\uc885 \ub3c4\uc2dd \ubcc0\ud615\uc744 \uc2e4\uc2dc\uac04 \uc21c\ud658\ud568).\n4. **\ubcf8\ubb38 \uce78 \uacbd\uacc4\uc640 `[\uadfc\uac70]` \uaddc\uce59**\n   - **\ub4e4\uc5ec\uc4f0\uae30 \ud45c\uc900**: \uce78 \uc774\ub984\uc740 **\uacf5\ubc31 2\uce78**(`  - \uce78 \uc774\ub984`), \uce78 \uc548\uc758 \uc904\uc740 **\uacf5\ubc31 4\uce78**(`    - \uc904 \ub0b4\uc6a9`) \ub4e4\uc5ec\uc4f4\ub2e4.\n   - **\ub4e4\uc5ec\uc4f0\uae30 \uc18c\uc2e4 \uc2dc \ubcc0\ud658\uae30\uc758 \uce78 \uacbd\uacc4 \ud310\uc815 5\uc21c\uc704**:\n     1) \ub3c4\uc2dd \uc904\uc758 \uce78 \uc774\ub984 \ubaa9\ub85d(`| A / B / C`)\uacfc \uc77c\uce58\ud558\ub294 \uc904\uc740 \uc0c8 \uce78.\n     2) \ub3c4\uc2dd\ubcc4 \uace0\uc815 \uc904 \uc218\ub97c \ucc44\uc6b0\uba74 \ub2e4\uc74c \uc904\uc774 \uc0c8 \uce78: **\uc804\ud658\ud45c = \ucc28\uc6d0 \uc218**, **\ud3c9\uac00\ud45c = \uae30\uc900 \uc218**, **\ud45c = \uba38\ub9ac \uc218 \u2212 1**, **\uc218\uc601 \ub808\uc778 = \ub2e8\uacc4 \uc218**, **\uc0ac\ub840 \uc774\ud589 = 2**.\n     3) `\uacb0\ub860:` \ub2e4\uc74c \uc904\uc740 \uc0c8 \uce78(\ub530\ub77c\uc11c `\uacb0\ub860:`\uc740 \ubc18\ub4dc\uc2dc \uce78\uc758 \ub9e8 \ub9c8\uc9c0\ub9c9 \uc904\uc5d0\ub9cc \ubc30\uce58).\n     4) `[\uadfc\uac70]`\ub85c \uc2dc\uc791\ud558\ub294 \uc904\uc740 \uadfc\uac70 \ub3c4\uc2dd \uce78.\n     5) \ucf5c\ub860\u00b7\uc22b\uc790\u00b7\uae30\ud638\uac00 \uc5c6\ub294 24\uc790 \uc774\ud558 \uc904\uc740 \uce78 \uc774\ub984 \ud6c4\ubcf4.\n   - **\uce78 \uc774\ub984 \uae08\uc9c0 \uc0ac\ud56d**: \uce78 \uc774\ub984\uc740 **8\uc790 \uc774\ub0b4 \uba85\uc0ac\uad6c**\ub85c \uc4f0\uba70, **\ucf5c\ub860(`:`), \uc218\uce58(`60%`, `3\uc5b5` \ub4f1), \ubc88\ud638(`1.`, `\u2460`, `1\ub2e8\uacc4`), \ud45c\uc2dd(`\u2191\u2193\u2713\u2717\u25cf\u25d0\u25cb!`)\uc744 \uc808\ub300 \ub123\uc9c0 \uc54a\ub294\ub2e4**.\n   - **`[\uadfc\uac70]` \ud0dc\uadf8 \uaddc\uce59**:\n     - **\uadfc\uac70 \ub3c4\uc2dd\uc758 \uce78\uc5d0\ub9cc** `[\uadfc\uac70]`\ub97c \ubd99\uc778\ub2e4. \uc8fc \ub3c4\uc2dd \uce78\uc5d0 `[\uadfc\uac70]`\ub97c \ubd99\uc774\uba74 \uadfc\uac70 \ud45c\uac00 \uc0ac\ub77c\uc9c4\ub2e4.\n     - \uadfc\uac70 \ub3c4\uc2dd\uc774 `\ud45c`\uc77c \ub54c \ud589\uc740 `  - [\uadfc\uac70] \ud589 \uc774\ub984` \uc544\ub798 4\uce78 \ub4e4\uc5ec\uc4f4 \uc140 \uc904\ub4e4(\uc140 \uc218 = \uba38\ub9ac \uc218 \u2212 1)\ub85c \uc4f0\uac70\ub098, `  - [\uadfc\uac70] \ud589 \uc774\ub984 / \uc1401 / \uc1402`\ucc98\ub7fc \ud55c \uc904\ub85c \uc368\ub3c4 \ub41c\ub2e4.\n5. **\uc904 \uc55e\uba38\ub9ac \ubb38\ubc95 (\uc904 \uc2dc\uc791 \ubaa8\uc591\uc73c\ub85c \uc2dc\uac01 \uc694\uc18c\uc640 \uc2dc\ub9e8\ud2f1 \uc0c9\uc0c1\uc774 \uacb0\uc815\ub428)**\n   - \ubcf8\ubb38 \uce78 \uc548\uc758 \ubaa8\ub4e0 \uc904\uc740 \uc544\ub798 10\uac00\uc9c0 \uc904 \ubb38\ubc95 \uc911 \ud558\ub098\ub85c\ub9cc \uc791\uc131\ud55c\ub2e4(\uae34 \uc11c\uc220\ud615 \ubb38\uc7a5 \ub098\uc5f4 \uae08\uc9c0):\n\n   | \uc904 \ubaa8\uc591 | \ubcc0\ud658\uae30\uac00 \uadf8\ub9ac\ub294 \uc2dc\uac01 \uc694\uc18c (\uc2dc\ub9e8\ud2f1 \uceec\ub7ec) | \uc791\uc131 \uaddc\uce59 \ubc0f \uc8fc\uc758\uc0ac\ud56d |\n   | :--- | :--- | :--- |\n   | `\ud575\uc2ec\uc5b4: \uc124\uba85` | **\uad75\uc740 \ud575\uc2ec\uc5b4** + \uc124\uba85 | \uae30\ubcf8 \uc904. \ud575\uc2ec\uc5b4 2~8\uc790 \uba85\uc0ac, \uc124\uba85 22~30\uc790 |\n   | `60% \uc124\uba85` | **\ud070 \uc218\uce58 \ucf5c\uc544\uc6c3 \uc904** (\uace0\uc815\ud3ed \uc22b\uc790 \uc815\ub82c) | \uc22b\uc790\ub85c \uc2dc\uc791, 35\uc790 \uc774\ub0b4. \ub2e8, **\ub9ac\ub4dc\uc5d0 \uac19\uc740 \uc218\uce58\uac00 \uc788\uc73c\uba74 \ubcf4\ud1b5 \uc904\ub85c \uadf8\ub824\uc9d0** |\n   | `\u2191 \u2193 \u2713 \u2717 \u25cf \u25d0 \u25cb !` + \uacf5\ubc31 | **\uc2dc\ub9e8\ud2f1 \ud310\uc815\u00b7\ubc29\ud5a5\u00b7\uc704\ud5d8 \ubc30\uc9c0 \uc904** | \ub4a4\uc774\uc5b4 `\ud575\uc2ec\uc5b4: \uc124\uba85` \uc791\uc131 (`\u2191\u00b7\u2713` \uae0d\uc815, `\u2193\u00b7\u2717\u00b7!` \uc704\ud5d8\u00b7\uac10\uc18c, `\u25cf\u25d0\u25cb` \ud558\ube44\ubcfc \uc218\uc900 \uc0c1\u00b7\uc911\u00b7\ud558) |\n   | `\uc774\ub984 = 54%` | **\ube44\uc728 \ub9c9\ub300 (0~100%)** | \ube44\uc911\u00b7\uc810\uc720\uc728\u00b7\ub2ec\uc131\ub960 \uc218\ud3c9 \uac8c\uc774\uc9c0 \ubc14 \uc2dc\uac01\ud654 |\n   | `\uacb0\ub860: \ubb38\uc7a5` | **\uce78 \ud558\ub2e8 \uacb0\ub860 \ub760** | \uce78\uc758 \ub9e8 \ub05d \uc904\uc5d0\ub9cc \ubc30\uce58(26\uc790 \uc774\ub0b4). \uc804\ud658\ud45c\u00b7\ud3c9\uac00\ud45c\u00b7\ud45c\u00b7\uc218\uc601 \ub808\uc778\u00b7\uc0ac\ub840 \uc774\ud589\u00b7\uc77c\uc815\ud45c\uc5d0\ub294 \uc4f0\uc9c0 \uc54a\uc74c |\n   | `\uc0c1 \u2014 \ud480\uc774` | **\ud3c9\uac00\ud45c\u00b7\uc810\uc218 \ub9c9\ub300\u00b7\ub9e4\ud2b8\ub9ad\uc2a4 \ub4f1\uae09** | `\uc0c1\u00b7\uc911\u00b7\ud558` \ub610\ub294 `\u25cf\u00b7\u25d0\u00b7\u25cb` \ub4a4\uc5d0 \uc904\ud45c(`\u2014`)\uc640 \ud480\uc774 \uc791\uc131 |\n   | `\uc804 \u2192 \ud6c4` | **\uc0ac\ub840 \uc774\ud589 \ud654\uc0b4\ud45c** | \uc0ac\ub840 \uc774\ud589 \ub3c4\uc2dd\uc758 \uce78 \uc904(\uce78\ub2f9 2\uc904 \uace0\uc815) |\n   | `\uc870\uac74 \u2192 \uacb0\uacfc` | **\uc758\uc0ac\uacb0\uc815 \ud2b8\ub9ac \ubd84\uae30** | \uc774\uc288 \ud2b8\ub9ac \ub3c4\uc2dd\uc5d0\uc11c \uce78 \uc904\uc758 \uc808\ubc18 \uc774\uc0c1\uc5d0 `\u2192`\uac00 \uc788\uc73c\uba74 \uc758\uc0ac\uacb0\uc815 \ud2b8\ub9ac\ub85c \ub80c\ub354\ub9c1 |\n   | `\ub0b4\uc6a9 (1Q~2Q)` | **\uc77c\uc815\ud45c \uac04\ud2b8 \ub9c9\ub300** | \uc77c\uc815\ud45c \ub3c4\uc2dd\uc758 \uce78 \uc904 \ub05d\uc5d0 `(\uae30\uac04~\uae30\uac04)` \ud45c\uae30 |\n   | `\uacfc\uc81c: \u2026 / \uccab \uc870\uce58: \u2026 / \ub2f4\ub2f9: \u2026` | **\uc2e4\ud589 \uce74\ub4dc \ud589** | \uc2e4\ud589 \uc7a5\uc5d0\uc11c \uacfc\uc81c\u00b7\uc870\uce58\u00b7\ub2f4\ub2f9\uc744 \ud55c \uc904 \uce74\ub4dc\ub85c \ub80c\ub354\ub9c1\ud560 \ub54c \uc0ac\uc6a9 |\n\n---\n\n## 1. \uc6d0\ubb38 \uc2ec\uce35 \ud574\ubd80 5\ub300 \uc7a5\uce58 (\ub0b4\ubd80 \ucd94\ub860 \uc5d4\uc9c4 \u2014 \ucd9c\ub825 \uc804 \ud544\uc218 \uc791\ub3d9)\n\n\ub2e8\uc21c\ud788 \uc6d0\ubb38 \ubb38\ub2e8\uc744 \uc694\uc57d\u00b7\ubc1c\ucdcc\ud574 \uce78\uc5d0 \ucc44\uc6cc \ub123\ub294 \ud53c\uc0c1\uc801 \uae30\ud68d\uc744 \ub9c9\uae30 \uc704\ud574, \uc6d0\uace0\ub97c \uc4f0\uae30 \uc804\uc5d0 \ubc18\ub4dc\uc2dc \uc544\ub798 **5\ub300 \uc2ec\uce35 \ud574\ubd80 \uc7a5\uce58**\ub85c \uc6d0\ubb38\uc744 \uba3c\uc800 \ud574\uccb4\u00b7\uc7ac\uc870\ub9bd\ud55c\ub2e4(\ud574\ubd80 \uacfc\uc815\uc740 \ucd9c\ub825\ud558\uc9c0 \uc54a\uace0 \uacb0\uacfc \uc6d0\uace0\uc5d0 \uc989\uc2dc \ubc18\uc601).\n\n1. **\uc7a5\uce58 1 \u2014 SCQA \uc11c\uc0ac \ud574\ubd80 \ubc0f \ud575\uc2ec \uc758\uc0ac\uacb0\uc815 \uc9c8\ubb38(Governing Question) \ucd94\ucd9c**:\n   - \uc6d0\ubb38 \uc804\uccb4\uc5d0\uc11c \u2460 **\ud604\ud669\u00b7\ubc30\uacbd(Situation)**, \u2461 **\ubc1c\uc0dd\ud55c \ubb38\uc81c\u00b7\uc704\uae30\u00b7\ud658\uacbd \ubcc0\ud654(Complication)**, \u2462 **\uacbd\uc601\uc9c4\u00b7\ub3c5\uc790\uac00 \uacb0\ub2e8\ud574\uc57c \ud560 \ud575\uc2ec \uc9c8\ubb38(Question)**, \u2463 **\ucd5c\uc885 \ud574\ubc95\u00b7\uacb0\ub860(Answer)**\uc744 \ucd94\ucd9c\ud55c\ub2e4.\n   - \ucd94\ucd9c\ud55c \ucd5c\uc885 \ud574\ubc95(Answer)\uc744 `[\ubaa9\ucc28]`\uc758 `\uc2a4\ud1a0\ub9ac \ub77c\uc778:`\uacfc `\ubcf8\ubb38 1`\uc758 \uc885\ud569 \uacb0\ub860\uc73c\ub85c \uc0bc\uace0, \ud575\uc2ec \uc9c8\ubb38\uc758 \ud558\uc704 \uac80\uc99d \uc9c8\ubb38\ub4e4\uc744 \uac01 \uc7a5\uc758 `\ubc1b\uce68: \u2192 \ubb3c\uc74c`\uacfc \ub2e4\uc74c \uc7a5 `\ubb3c\uc74c:`\uc758 \uc5f0\uc1c4 \uace0\ub9ac\ub85c \ubc30\uce58\ud55c\ub2e4.\n2. **\uc7a5\uce58 2 \u2014 '\uc6d0\ubb38 \uc0ac\uc2e4(Fact) \u2192 \uad6c\uc870\uc801 \uc6d0\uc778(Why So) \u2192 \uacbd\uc601 \ud310\ub2e8(So What)' 3\ub2e8 \uc0ac\ub2e4\ub9ac**:\n   - \uc6d0\ubb38\uc758 \ubb38\uc7a5\uc744 \uadf8\ub300\ub85c \uc904\uc5ec \uc801\uc9c0 \uc54a\uace0 \ubaa8\ub4e0 \ud575\uc2ec \ud329\ud2b8\ub97c 3\ub2e8 \uce35\uc704\ub85c \uc2b9\uaca9\ud55c\ub2e4:\n     - **1\ub2e8(Fact \u2014 \ubcf8\ubb38 \uc218\uce58\u00b7\ud45c\uc2dd \uc904)**: \uc6d0\ubb38\uc758 \uc815\ub7c9 \uc218\uce58\u00b7\uace0\uc720\uba85\uc0ac\u00b7\uc2e4\uc99d \uc0ac\ub840(\ub300\uc0c1\u00b7\uc2dc\uc810\u00b7\ub2e8\uc704 \ubcf4\uc874).\n     - **2\ub2e8(Why So \u2014 \ubcf8\ubb38 \ud575\uc2ec\uc5b4 \uc124\uba85 & \uce78 `\uacb0\ub860:` \uc904)**: \uc65c \uadf8\ub7f0 \uc218\uce58\u00b7\ucc28\uc774\uac00 \ubc1c\uc0dd\ud588\ub294\uc9c0\uc5d0 \ub300\ud55c \uc6d0\ubb38 \ub0b4 \uad6c\uc870\uc801 \uc6d0\uc778\u00b7\uc791\ub3d9 \uc6d0\ub9ac.\n     - **3\ub2e8(So What \u2014 \uc7a5 `\ub9ac\ub4dc:` & \ub9c8\uc9c0\ub9c9 \uc7a5 \uc2e4\ud589 \uacfc\uc81c)**: \uadf8 \uc6d0\uc778\uacfc \uc0ac\uc2e4 \ub54c\ubb38\uc5d0 \uc870\uc9c1\uc774 \ubb34\uc5c7\uc744 \ubc14\uafd4\uc57c \ud558\ub294\uc9c0(`\uc2dc\uae09\u00b7\ud544\uc694\u00b7\ud0c0\ub2f9\u00b7\uad00\uac74\u00b7\uc6b0\uc120`) \ud310\ub2e8.\n3. **\uc7a5\uce58 3 \u2014 \uc904\uae00 \uc18d \uc228\uc740 4\ub300 \ucee8\uc124\ud305 \uad6c\uc870(\uc554\ubb35\uc801 \ub300\ube44\u00b7\ubcd1\ubaa9\u00b7\ube0c\ub9ac\uc9c0\u00b7\ud2b8\ub808\uc774\ub4dc\uc624\ud504) \ud0d0\uc9c0\uae30**:\n   - **\uc228\uc740 \ub300\uc870(Implicit Contrast)**: \uacfc\uac70 vs \ud604\uc7ac, \ud3c9\uade0 \uc9d1\ub2e8 vs \uc0c1\uc704 \uc9d1\ub2e8, \uae30\uc874 \uad00\ud589 vs \ud601\uc2e0 \ubc29\uc2dd \u2192 \uacf5\ud1b5 \ube44\uad50 \ucd95(`\ucc28\uc6d0:`)\uc744 \ucd94\ucd9c\ud574 **`\uc804\ud658\ud45c`**, **`\uc804\ud658\ud45c(\ud604\uc7ac\u00b7\ubaa9\ud45c \uac2d \ubd84\uc11d)`**, **`\ubb36\uc74c \ub9c9\ub300(\ub364\ubca8\u00b7\uc2ac\ub85c\ud504)`**, **`\ub808\uc774\ub354`**\ub85c \ubd84\ub9ac.\n   - **\uc228\uc740 \ubcd1\ubaa9\u00b7\uc774\ud0c8(Bottleneck & Drop-off)**: \ub2e8\uacc4\ubcc4 \uc804\ud658 \uac10\uc18c, \ubd80\uc11c \uac04 \uc778\uacc4 \uc9c0\uc5f0, \ub2e4\uc911 \uc6d0\uc778\uc5d0 \uc758\ud55c \uc624\ub958 \uc9d1\uc911 \u2192 **`\uae54\ub54c\uae30`**, **`\uc218\uc601 \ub808\uc778`**, **`\ub2e8\uacc4 \ud750\ub984(\uac00\uce58 \uc0ac\uc2ac)`**, **`\uc778\uacfc \uc0ac\uc2ac(\ud53c\uc2dc\ubcf8)`**\ub85c \uad6c\uc870\ud654.\n   - **\uc228\uc740 \uc218\ub9ac \ubc29\uc815\uc2dd(Numeric Bridge, Sensitivity & Share)**: \uc2dc\uc791 \uac12\uacfc \ubaa9\ud45c \uac12 \uc0ac\uc774\uc758 \uc99d\uac10 \uc694\uc778(`+`/`-`), \ubcc0\uc218\ubcc4 \uc774\uc775 \ubbfc\uac10\ub3c4, \uc138\uadf8\uba3c\ud2b8\ubcc4 \uc2dc\uc7a5 \uaddc\ubaa8\u00d7\uc810\uc720\uc728 \u2192 **`\uc6cc\ud130\ud3f4`**, **`\ud1a0\ub124\uc774\ub3c4`**, **`\uba54\ub9ac\uba54\ucf54`**, **`\ub204\uc801 \ub9c9\ub300(100% \uad6c\uc131\ube44 / \ud575\uc2ec \ube44\uc728 \uac15\uc870)`**\ub85c \uc2dc\uac01\ud654.\n   - **\uc228\uc740 \uc758\uc0ac\uacb0\uc815 \ub300\uc548 \ube44\uad50(Trade-off & Portfolio Priority)**: \ubcf5\uc218 \uacfc\uc81c\u00b7\uc0ac\uc5c5\uc758 \ub9e4\ub825\ub3c4\u00d7\uacbd\uc7c1\ub825, \ud6a8\uacfc\u00d7\uc2e4\ud589 \uc6a9\uc774\uc131, \uac00\uaca9\u00d7\uae30\uc220\u00d7\uc2dc\uc7a5\uaddc\ubaa8 \u2192 **`3\u00d73`(9-Box)**, **`\ud3c9\uac00\ud45c(\uc6b0\uc120\uc21c\uc704 \ub9e4\ud2b8\ub9ad\uc2a4\u00b7\ubc84\ube14 \ub9f5)`**, **`\uc804\ud658\ud45c(\ub4dd\uc2e4 \uc800\uc6b8)`**, **`2\u00d72`**, **`\uc774\uc288 \ud2b8\ub9ac(\uc758\uc0ac\uacb0\uc815 \ud2b8\ub9ac)`**\ub85c \uad6c\uc870\ud654.\n4. **\uc7a5\uce58 4 \u2014 \uc815\ub7c9 \uc218\uce58 \ub9e5\ub77d\ud654(Contextualization) \ubc0f \uc218\ub9ac \ubb34\uacb0\uc131 \uac80\uc99d**:\n   - \uace0\ub9bd\ub41c \ub2e8\ub3c5 \uc218\uce58(\uc608: `\ub9e4\ucd9c 300\uc5b5`)\ub9cc \uc801\uc9c0 \uc54a\uace0 \uc6d0\ubb38\uc5d0 \uc788\ub294 **\ube44\uad50 \uae30\uc900(\uc804\ub144\u6bd4, \ubaa9\ud45c\u6bd4, \uacbd\uc7c1\uc0ac\u6bd4), \ubd84\ubaa8\u00b7\ubaa8\uc218(\uc804\uccb4 1,400\uac1c \uae30\uc5c5 \uc911 60%), \ub2e8\uc704\u00b7\uc2dc\uc810('26.3Q \uae30\uc900)**\uc744 \ubc18\ub4dc\uc2dc \uc9dd\uc9c0\uc5b4 \uc218\uce58\uc758 \uc758\ubbf8\uac00 \uc989\uc2dc \ub4dc\ub7ec\ub098\uac8c \ud55c\ub2e4.\n   - \uc6d0\ubb38 \uc218\uce58\ub97c \uc784\uc758\ub85c \ub354\ud558\uac70\ub098 \ub098\ub204\uc9c0 \uc54a\uc73c\uba70, \uc81c\ubaa9\u00b7\ub9ac\ub4dc\uc5d0 \uc120\uc5b8\ud55c \uc218\ub7c9(`6\ub300 \uacfc\uc81c`, `4\ub2e8\uacc4`)\uacfc \uc2e4\uc81c \ubcf8\ubb38 \uce78\u00b7\uc904\uc758 \uac1c\uc218\ub97c 100% \uc77c\uce58\uc2dc\ud0a8\ub2e4.\n5. **\uc7a5\uce58 5 \u2014 \uc218\uc9c1 \uc815\ud569\uc131(Vertical Logic) \ubc0f \uc218\ud3c9 \ubb34\uc911\ubcf5(Horizontal MECE) \uc815\ub82c**:\n   - **\uc218\uc9c1 \uc815\ud569\uc131**: \ud55c \uc7a5 \uc548\uc758 \ubcf8\ubb38 \uce78 `\uacb0\ub860:`\ub4e4\uc744 \ubaa8\uc73c\uba74 \uadf8 \uc7a5\uc758 `\ub9ac\ub4dc:`\uac00 \ub17c\ub9ac\uc801 \ube48\ud2c8 \uc5c6\uc774 \uc99d\uba85\ub418\uc5b4\uc57c \ud558\uba70, `\uc8fc \ub3c4\uc2dd`(\ub17c\ub9ac\u00b7\uad6c\uc870)\uacfc `\uadfc\uac70 \ub3c4\uc2dd`(\uc815\ub7c9 \uc218\uce58\u00b7\uc0ac\ub840\u00b7\ud45c)\uc774 \uc11c\ub85c \ub2e4\ub978 \ucc28\uc6d0\uc5d0\uc11c \uac19\uc740 `\ub9ac\ub4dc:`\ub97c \uad50\ucc28 \uc785\uc99d\ud574\uc57c \ud55c\ub2e4.\n   - **\uc218\ud3c9 \ubb34\uc911\ubcf5(MECE)**: \ud55c \uc7a5 \uc548\uc758 \ubcf8\ubb38 \uce78\ub4e4\uc740 **\ub2e8 \ud558\ub098\uc758 \uc77c\uad00\ub41c \ubd84\ub958 \uae30\uc900**(\uc2dc\uc810\ubcc4, \uc8fc\uccb4\ubcc4, \uc694\uc778\ubcc4, \ub2e8\uacc4\ubcc4 \uc911 \ud0dd\uc77c)\uc73c\ub85c\ub9cc \ub098\ub208\ub2e4.\n\n---\n\n## 2. \uace0\ubc00\ub3c4\u00b7\ubb34\uc5ec\ubc31(`\ucda9\uc804\uc728 92% \uc774\uc0c1`) \ubc0f \uc7a5\ud45c \ub0b4 \uacb9\uce68 \ubc29\uc9c0 \uc138\ubd80 \uaddc\uce59\n\n1. **\uacfc\ub3c4\ud55c \uc5ec\ubc31(Empty Space) \ubc0f \uc800\ubc00\ub3c4 \uc6d0\ucc9c \ucc28\ub2e8 4\ub300 \uaddc\uc728**:\n   - **\uaddc\uc728 \u2460 (\ubcf8\ubb38 \uce78\ub2f9 4\uc904 + \uacb0\ub860 1\uc904 \ud45c\uc900\ud654)**: \uc77c\ubc18 \ub3c4\uc2dd(`\ub2e8\uacc4 \ud750\ub984`, `\uac00\uce58 \uc0ac\uc2ac`, `\uc804\ub7b5 \ud558\uc6b0\uc2a4`, `\uc774\uc288 \ud2b8\ub9ac`, `\uc21c\ud658 \uace0\ub9ac`, `2\u00d72`, `3\u00d73`, `\uce74\ub4dc \ubb36\uc74c`)\uc758 \uac01 \uce78\uc5d0\ub294 \ubc18\ub4dc\uc2dc **\uad6c\uccb4\uc801 \uc0ac\uc2e4\u00b7\uc218\uce58 \uc904 3~4\uac1c + \ub9e8 \ub05d `\uacb0\ub860:` 1\uc904(\ud569\uacc4 4~5\uc904)**\uc744 \uc791\uc131\ud55c\ub2e4. \uace0\uc815 \uc904 \uc218 \ub3c4\uc2dd(`\uc804\ud658\ud45c`, `\ud3c9\uac00\ud45c`, `\ud45c`, `\uc218\uc601 \ub808\uc778`)\ub3c4 \ucc28\uc6d0\u00b7\uae30\uc900\u00b7\ud589 \uc218\ub97c **3~4\uac1c \uc774\uc0c1**\uc73c\ub85c \uad6c\uc131\ud574 \ud45c \ub0b4\ubd80 \ubc00\ub3c4\ub97c \ub192\uc778\ub2e4.\n   - **\uaddc\uc728 \u2461 (`\uc8fc \ub3c4\uc2dd` + `\uadfc\uac70 \ub3c4\uc2dd` \ubcf5\uc218 \uacb0\ud569 \ud544\uc218)**: \uc8fc \ub3c4\uc2dd \ud558\ub098\ub9cc \ub450\uc5b4 \ud654\uba74 \ud558\ub2e8\uc774 \ube44\ub294 \uc77c\uc774 \uc5c6\ub3c4\ub85d \ubaa8\ub4e0 \ubcf8\ubb38 \uc7a5\uc5d0 **`\uadfc\uac70 \ub3c4\uc2dd`(`\uc218\uce58 \ud0c0\uc77c`, `\uc778\uacfc \uc0ac\uc2ac`, `\ub808\uc774\ub354`, `\ud1a0\ub124\uc774\ub3c4`, `\uae54\ub54c\uae30`, `\uc0ac\ub840 \uc774\ud589`, `\uc77c\uc815\ud45c`, `\ud45c` \ub4f1)**\uc744 \ud568\uaed8 \uc124\uacc4\ud55c\ub2e4.\n   - **\uaddc\uc728 \u2462 (\uc804 \uc2ac\ub77c\uc774\ub4dc `\uc0ac\uc2e4 \ub760:` + `\uc608\ube44:` 4~6\uc904 \uc758\ubb34 \uc791\uc131)**: \ubaa8\ub4e0 \uc7a5\uc5d0 `\uc0ac\uc2e4 \ub760:`(3~4\uac1c \ud575\uc2ec \uc870\uac74\u00b7\uc9c0\ud45c)\uc640 `\uc608\ube44:`(4~6\uc904\uc758 \ucd94\uac00 \uc218\uce58\u00b7\uc0ac\ub840\u00b7\uc0ac\uc2e4)\ub97c \ube60\uc9d0\uc5c6\uc774 \uc791\uc131\ud55c\ub2e4. \ubcc0\ud658\uae30(v6.4)\ub294 \uc2ac\ub77c\uc774\ub4dc\uc5d0 \ub0a8\ub294 \uc138\ub85c \uc5ec\ubc31\uc774 \uc788\uc73c\uba74 `\uc608\ube44:` \ud56d\ubaa9\uc744 \ubcf8\ubb38 \uce74\ub4dc \ub0b4\ubd80 \ubc0f \ud558\ub2e8 **\uc2e4\uc99d\u00b7\ubcf4\uc870 \uadfc\uac70 \ub760**\ub85c 100% \uc790\ub3d9 \ud761\uc218\ud558\uc5ec \ucda9\uc804\uc728 92% \uc774\uc0c1\uc744 \ubcf4\uc7a5\ud55c\ub2e4.\n   - **\uaddc\uc728 \u2463 (\ud55c \uc7a5 \uc804\uccb4 \uc904 \uc218 12~22\uc904 \uc801\uc815 \ub300\uc5ed \uc720\uc9c0)**: \ud55c \uc7a5\uc758 \ubcf8\ubb38 \uc904 \ud569\uacc4\ub97c **\ucd5c\uc18c 12\uc904 \uc774\uc0c1 ~ \ucd5c\ub300 22\uc904 \uc774\ub0b4**(\uc808\ub300 \uc0c1\ud55c 24\uc904)\ub85c \uc720\uc9c0\ud558\uc5ec \uc800\ubc00\ub3c4(\uc5ec\ubc31 \uacfc\ub2e4)\uc640 \uacfc\ubc00\ub3c4(\uc0c1\ud558 \uacb9\uce68)\ub97c \ub3d9\uc2dc\uc5d0 \ubc29\uc9c0\ud55c\ub2e4.\n2. **\uc218\uce58 \ud0c0\uc77c \uae38\uc774 \uc81c\ud55c (\uc606 \uce78 \uce68\ubc94 \ubc29\uc9c0)**:\n   - `\uc218\uce58 \ud0c0\uc77c`\uc758 `\uac12:`\uc740 **\uc22b\uc790 \ubd80\ubd84 8\uc790 \uc774\ub0b4 + \uc124\uba85 16\uc790 \uc774\ub0b4**(\uc608: `\uac12: 42\uc5b5 \uc124\ube44 \ud22c\uc790 \ucd1d\uc561 / 2.6\ub144 \ud68c\uc218 \uae30\uac04 / 94% \uc624\ub958 \uac10\uc18c\uc728`)\ub85c \uac04\uacb0\ud558\uac8c \uc801\ub294\ub2e4.\n3. **\ud45c\uae30 \ubc0f \uc5b4\ud718 \uc815\ud654 \uaddc\uce59**:\n   - \uce58\ud658 \ud544\uc218 \uc5b4\ud718: `'\ud328\ub7ec\ub2e4\uc784'` \u2192 `'\ubc29\uc2dd'`, `'\uc2dc\ub108\uc9c0'` \u2192 `'\uacb0\ud569 \ud6a8\uacfc'`, `'\uadf9\ub300\ud654'` \u2192 `'\ud655\ub300'`, `'(\ub2e8\uc21c) ~\ub97c \ub118\uc5b4'` \u2192 `'~\uac00 \uc544\ub2c8\ub77c'`.\n   - \uad04\ud638 \uc18d \uc601\uc5b4 \ubcd1\uae30(`(B2B)`, `(Searching)`)\ub294 \uc9c0\uc6b0\uace0, \uc804\ubb38 \uc57d\uc5b4\ub294 \uccab \ub4f1\uc7a5 \uc2dc \ud55c\uae00 \ud480\uc774\ub97c \ubd99\uc778\ub2e4. \uc5f0\ub3c4\ub294 `'26\ub144`\u00b7`'12\ub144`(`2026\ub144` \u2717), \ud55c\uc790 \uc57d\uc5b4 `\uc804\ub144\u6bd4`\u00b7`\u5916`\u00b7`\u4e2d`, \uc99d\uac10 \uae30\ud638 `\u2191`\u00b7`\u2193`\ub97c \uc0ac\uc6a9\ud55c\ub2e4.\n\n---\n\n## 3. \uc7a5\ub974\ubcc4 \ud750\ub984\n\n| \uc7a5\ub974 | \ud310\ubcc4 \uae30\uc900 (\uc6d0\ubb38\uc758 \uc911\uc2ec \ub0b4\uc6a9) | \ud45c\uc900 \uc7a5 \uad6c\uc131 \uc21c\uc11c |\n| :--- | :--- | :--- |\n| **\ud604\ud669\ubcf4\uace0** | \uc2e4\uc801\u00b7\ubaa9\ud45c\u00b7\ub2ec\uc131\ub960\u00b7\uc9c0\ud45c \ubcc0\ud654\uac00 \uc911\uc2ec | \uc885\ud569 \uacb0\ub860 \u2192 \ud575\uc2ec \uc9c0\ud45c\ubcc4 \uc810\uac80 \u2192 \uc6d0\uc778 \ubd84\uc11d \u2192 \ub300\uc751 \uacfc\uc81c |\n| **\ubb38\uc81c\ud574\uacb0** | \ubb38\uc81c \ud604\uc0c1\u00b7\uadfc\ubcf8 \uc6d0\uc778\u00b7\ud574\uacb0 \ub300\ucc45\uc774 \uc911\uc2ec | \ud575\uc2ec \ubb38\uc81c \uc815\uc758 \u2192 \uadfc\ubcf8 \uc6d0\uc778 \ubd84\ud574 \u2192 \ud574\uacb0 \ub300\ucc45 \u2192 \uc2e4\ud589 \uacc4\ud68d |\n| **\uc81c\uc548\uc124\ub4dd** | \ub05d\uc5d0 \uacbd\uc601\uc9c4 \uc2b9\uc778\u00b7\ud22c\uc790\u00b7\ub3c4\uc785 \uacb0\uc815 \uc694\uccad\uc774 \uc788\uc74c | \uc81c\uc548 \uacb0\ub860 \u2192 \ud0c0\ub2f9\uc131\u00b7\uae30\ub300 \ud6a8\uacfc \uadfc\uac70 \u2192 \uc704\ud5d8\u00b7\ubc18\ub860 \ub300\uc751 \u2192 \uc2b9\uc778 \uc694\uccad \ubc0f \uc2e4\ud589 |\n| **\uc815\ubcf4\uc81c\uacf5** | \uac1c\ub150\u00b7\ub3d9\ud5a5\u00b7\uc0ac\ub840\u00b7\ubc29\ubc95\ub860 \uc124\uba85\uc774 \uc911\uc2ec | \ud575\uc2ec \uc815\uc758\u00b7\uacb0\ub860 \u2192 \uad6c\uc131 \uc694\uc18c\u00b7\uc6d0\ub9ac \u2192 \uad6d\ub0b4\uc678 \uc2e4\uc99d \uc0ac\ub840 \u2192 \uc870\uc9c1 \uc801\uc6a9 \uc2dc\uc0ac\uc810 |\n| **\uacc4\ud68d\uc218\ub9bd** | \uc911\uc7a5\uae30 \ubaa9\ud45c\u00b7\ucd94\uc9c4 \uc804\ub7b5\u00b7\uacfc\uc81c\u00b7\ub85c\ub4dc\ub9f5\uc774 \uc911\uc2ec | \uc678\ubd80 \ud658\uacbd\u00b7\uacfc\uc81c \u2192 \ubaa9\ud45c \ubc0f \uc190\uc775 \ube0c\ub9ac\uc9c0 \u2192 \ucd94\uc9c4 \uc804\ub7b5 \uae30\ub465 \u2192 \uc138\ubd80 \uc2e4\ud589 \uacfc\uc81c\u00b7\uc77c\uc815 |\n\n---\n\n## 4. \ub3c4\uc2dd \ubaa9\ub85d \u2014 \ubcc0\ud658\uae30 \ub3c4\uc2dd \uc774\ub984\u00b7\ud0a4\u00b7\uac12 \ud615\uc2dd \ubc0f '\ub2e4\ub978 \uc548' \ud638\ud658 \uaddc\uaca9\n\n\ub3c4\uc2dd \uc904\uc740 `\ub3c4\uc2dd \uc774\ub984 | \ud0a4: \uac12 | \ud0a4: \uac12 | \uce781 / \uce782 / \uce783` \ud615\uc2dd\uc73c\ub85c \ud55c \uc904\uc5d0 \uc801\ub294\ub2e4. \ubcc0\ud658\uae30(v6.4)\uc758 \uc2ac\ub77c\uc774\ub4dc\ubcc4 `'\ub2e4\ub978 \uc548 \u21bb'` \ubc84\ud2bc\uc740 \uac01 \uc2ac\ub77c\uc774\ub4dc\uc758 \ubcf8\ubb38 \ub370\uc774\ud130\ub97c \uc720\uc9c0\ud55c \ucc44 \uc544\ub798 35\uc885 \ub3c4\uc2dd\uacfc \ubd84\ud560 \uad6c\ub3c4(\uc0c1\ud558 \ubd84\ud560\u00b7\uc88c\uc6b0 \ubd84\ud560\u00b7\ud575\uc2ec\uc9c0\ud45c \uacb0\ud569)\ub97c \uc2e4\uc2dc\uac04\uc73c\ub85c \uc21c\ud658\u00b7\uc804\ud658\ud55c\ub2e4.\n\n### 4-1. \ub3c4\uc2dd \ud30c\ub77c\ubbf8\ud130 \ud0a4 \uc694\uc57d\ud45c (\ud30c\uc11c \uae30\uc900)\n\n| \ud30c\ub77c\ubbf8\ud130 \ud0a4 | \uc0ac\uc6a9\ud558\ub294 \ub3c4\uc2dd | \uac12 \ud615\uc2dd \ubc0f \uaddc\uce59 |\n| :--- | :--- | :--- |\n| `\ucc28\uc6d0` \u00b7 `\uae30\uc900` \u00b7 `\uba38\ub9ac` \u00b7 `\ub2e8\uacc4` \u00b7 `\uae30\uac04` \u00b7 `\uc9c0\uc6d0` \u00b7 `\uc591\ub05d` | \uc804\ud658\ud45c \u00b7 \ud3c9\uac00\ud45c \u00b7 \ub808\uc774\ub354 \u00b7 \ud45c \u00b7 \uc218\uc601 \ub808\uc778 \u00b7 \uc77c\uc815\ud45c \u00b7 \uac00\uce58 \uc0ac\uc2ac \u00b7 \uc2a4\ud399\ud2b8\ub7fc | `A / B / C` (`/`\ub85c \ud56d\ubaa9 \uad6c\ubd84, \ud56d\ubaa9 \uc548\uc5d0 `/` \uc0ac\uc6a9 \uae08\uc9c0) |\n| `\ubfcc\ub9ac` \u00b7 `\uc9c0\ubd95` \u00b7 `\ubc14\ub2e5` \u00b7 `\uc911\uc2ec` \u00b7 `\uacf5\ud1b5` \u00b7 `\ud604\uc7ac` \u00b7 `\ubaa9\ud45c` \u00b7 `\uc6b0\uc120` \u00b7 `\uac00\ub85c` \u00b7 `\uc138\ub85c` \u00b7 `\uc6b0\uc138` \u00b7 `\ucd9c\ucc98` \u00b7 `\ubc94\ub840` \u00b7 `\uc81c\ubaa9` \u00b7 `\ub2e8\uc704` \u00b7 `\uac15\uc870` \u00b7 `\uad00\ubb38` | \uc774\uc288 \ud2b8\ub9ac \u00b7 \uc804\ub7b5 \ud558\uc6b0\uc2a4 \u00b7 \uc21c\ud658 \uace0\ub9ac \u00b7 \ud5c8\ube0c \u00b7 \uce74\ub4dc \ubb36\uc74c(\ubca4) \u00b7 \uc131\uc219\ub3c4 \u00b7 2\u00d72 \u00b7 3\u00d73 \u00b7 \uc804\ud658\ud45c(\uc800\uc6b8) \u00b7 \uc778\uc6a9 \u00b7 \ud3c9\uac00\ud45c \u00b7 \ud1a0\ub124\uc774\ub3c4 \u00b7 \ucc28\ud2b8\ub958 \u00b7 \uc77c\uc815\ud45c | \ub2e8\uc77c \uac12 (`\ud55c \uac12`) |\n| `\uac12` (\uc218\uce58 \ud0c0\uc77c) | \uc218\uce58 \ud0c0\uc77c | **\uc22b\uc790 \uba3c\uc800**: `60% \ub300\ud654 \uc804 \uad6c\ub9e4 \uacb0\uc815 / 1,400\uac1c \uc870\uc0ac \uae30\uc5c5 / 2.6\ub144 \ud68c\uc218 \uae30\uac04` |\n| `\uac12` (\ub9c9\ub300\u00b7\uae54\ub54c\uae30\u00b7\uc6cc\ud130\ud3f4\u00b7\ud1a0\ub124\uc774\ub3c4) | \ub9c9\ub300 \u00b7 \uac00\ub85c \ub9c9\ub300 \u00b7 \uae54\ub54c\uae30 \u00b7 \uc6cc\ud130\ud3f4 \u00b7 \ud1a0\ub124\uc774\ub3c4 | **\uc774\ub984 \uba3c\uc800**: `'25 2,527 / '26 2,660` (\uc6cc\ud130\ud3f4 \ub05d\uc740 `'27 \ubaa9\ud45c =`, \ud1a0\ub124\uc774\ub3c4\ub294 `\ud658\uc728 \ubcc0\ub3d9 -45 +60`) |\n| `\ucd95` + `\uacc4\uc5f4` | \ubb36\uc74c \ub9c9\ub300 \u00b7 \ub204\uc801 \ub9c9\ub300 \u00b7 \uba54\ub9ac\uba54\ucf54 \u00b7 \uaebe\uc740\uc120 \u00b7 \ubcf5\ud569 \u00b7 \ub808\uc774\ub354 | `\ucd95: '25 / '26 \\| \uacc4\uc5f4: \ub18d\uc2ec 1,700 1,820 / \uc678\ubd80 800 840` (**\uacc4\uc5f4 \uac12\uc740 \uc22b\uc790\ub9cc**, \ub2e8\uc704\ub294 `\ub2e8\uc704:`\uc5d0 \ubcc4\ub3c4 \ud45c\uae30. \uba54\ub9ac\uba54\ucf54\ub294 `\ucd95: \uc138\uadf8\uba3c\ud2b8A(50) / \uc138\uadf8\uba3c\ud2b8B(30)`\ucc98\ub7fc \uc2dc\uc7a5 \ube44\uc911 \ubcd1\uae30) |\n| `\ud45c\ud604` | \ubaa8\ub4e0 \ub3c4\uc2dd (\uc120\ud0dd) | \ud2b9\uc815 \ub80c\ub354\ub9c1 \ub808\uc774\uc544\uc6c3 \uc9c0\uc815 (`\\| \ud45c\ud604: \uc88c\uc6b0 \ubd84\ud560`, `\\| \ud45c\ud604: \ub364\ubca8`, `\\| \ud45c\ud604: \uc2ac\ub85c\ud504`, `\\| \ud45c\ud604: \uac2d \ubd84\uc11d`, `\\| \ud45c\ud604: \ubc84\ube14 \ub9f5`) |\n\n### 4-2. \ub3c4\uc2dd\ubcc4 \uc0c1\uc138 \uc124\uacc4 \ubc0f \ubcf8\ubb38 \uce78 \ub9e4\uce6d \uaddc\uce59\n\n| \ub3c4\uc2dd \uc774\ub984 | \uc120\ud0dd \uc0c1\ud669 (\uc6d0\ubb38 \uad6c\uc870 \uc2e0\ud638) | \ub3c4\uc2dd \uc904 \uc7ac\ub8cc \ubc0f \ubcf8\ubb38 \uce78 \uc791\uc131\ubc95 |\n| :--- | :--- | :--- |\n| **\uc804\ud658\ud45c** | \uae30\uc874 vs \uc2e0\uaddc \ubc29\uc2dd\uc744 \ucc28\uc6d0\ubcc4\ub85c \ub9de\ube44\uad50 (\uce78\uc774 \uc815\ud655\ud788 2\uac1c\uc77c \ub54c\ub9cc) | `\uc804\ud658\ud45c \\| \ucc28\uc6d0: \ubaa9\ud45c \uace0\uac1d / \uac1c\uc785 \uc2dc\uc810 / \ub300\ud654 \ubc29\uc2dd / \uad00\ub9ac \uc9c0\ud45c \\| \uae30\uc874 \ubc29\uc2dd / \uc2e0\uaddc \ubc29\uc2dd` + \ubcf8\ubb38 \uce78 2\uac1c, **\uce78 \uc904 \uc218 = \ucc28\uc6d0 \uc218**(\ud575\uc2ec\uc5b4 \uc5c6\uc774 28\uc790 \uc774\ub0b4 \uc124\uba85\ub9cc \ucc28\uc6d0 \uc21c\uc11c\ub300\ub85c \uc791\uc131, `\uacb0\ub860:` \uae08\uc9c0).<br>\u2022 **\ud604\uc7ac\u00b7\ubaa9\ud45c \uaca9\ucc28(\uac2d \ubd84\uc11d)**: \uce78 \uc774\ub984\uc744 `\ud604\uc7ac \uc218\uc900`\u00b7`\ubaa9\ud45c \uc218\uc900`\uc73c\ub85c \ud558\uace0 \uce78 \uc904\uc744 \uac19\uc740 \ub2e8\uc704 \uc218\uce58\ub85c \uc2dc\uc791\ud558\uba74 \uaca9\ucc28 \ub9c9\ub300\ub85c \ub80c\ub354\ub9c1.<br>\u2022 **\ub4dd\uc2e4 \ube44\uad50(\uc800\uc6b8)**: \uce78 \uc774\ub984\uc744 `\ub3c4\uc785 \uae30\ud68c`\u00b7`\ub3c4\uc785 \uc704\ud5d8`\ucc98\ub7fc \ub300\ub9bd\uc5b4\ub85c \uc4f0\uba74 \uc800\uc6b8\ub85c \ub80c\ub354\ub9c1(`\uc6b0\uc138: \ub3c4\uc785 \uae30\ud68c` \uc9c0\uc815 \uac00\ub2a5). |\n| **\ub2e8\uacc4 \ud750\ub984** | \uc21c\uc11c\uac00 \ubc14\ub014 \uc218 \uc5c6\ub294 3~6\ub2e8\uacc4 \ud504\ub85c\uc138\uc2a4 | `\ub2e8\uacc4 \ud750\ub984 \\| \uce781 / \uce782 / \uce783 / \uce784` + \ubcf8\ubb38 \uce78 = \ub2e8\uacc4(\uce78 \uc774\ub984\uc5d0 `1\ub2e8\uacc4`\u00b7`\u2460` \uac19\uc740 \ubc88\ud638 \uc808\ub300 \uae08\uc9c0 \u2014 \ubc88\ud638\ub294 \ubcc0\ud658\uae30\uac00 \uc790\ub3d9 \ubd80\uc5ec).<br>\u2022 **\uac00\uce58 \uc0ac\uc2ac**: `\ub2e8\uacc4 \ud750\ub984 \\| \uc9c0\uc6d0: \ud488\uc9c8 \ubcf4\uc99d / \uc5f0\uad6c\uac1c\ubc1c / \uad6c\ub9e4 \uc870\ub2ec \\| \uce781 / \uce782 / \uce783 / \uce784` (\uc0c1\ub2e8 \uc9c0\uc6d0 \uae30\ub2a5 \ubc14 + \ud558\ub2e8 \uc8fc \ud65c\ub3d9 \uc170\ube0c\ub860).<br>\u2022 **\uc131\uc219\ub3c4 \uc0ac\ub2e4\ub9ac**: `\ub2e8\uacc4 \ud750\ub984 \\| \ud604\uc7ac: 2 \\| \ubaa9\ud45c: 4 \\| \uce781 / \uce782 / \uce783 / \uce784`.<br>\u2022 **\uc2a4\ud399\ud2b8\ub7fc**: `\ub2e8\uacc4 \ud750\ub984 \\| \uc591\ub05d: \ub300\ub9ac\uc810 \uc758\uc874 / \uc9c1\uac70\ub798 \uc911\uc2ec \\| \uac15\uc870: \ud63c\ud569 \uc804\ud658\uae30 \\| \uce781 / \uce782 / \uce783`. |\n| **\uc778\uacfc \uc0ac\uc2ac** | \uc6d0\uc778 \u2192 \uc911\uac04 \uacb0\uacfc \u2192 \ucd5c\uc885 \uacb0\uacfc (\ub610\ub294 \ub2e4\uc6d0\uc778 \u2192 1\uacb0\uacfc) | `\uc778\uacfc \uc0ac\uc2ac \\| \uce781 / \uce782 / \uce783` + \ubcf8\ubb38 \uce78 = \uc778\uacfc \uace0\ub9ac(\ub9c8\uc9c0\ub9c9 \uce78\uc774 \ucd5c\uc885 \uacb0\uacfc). **\uc6d0\uc778 \uce78\uc774 4\uac1c \uc774\uc0c1\uc774\uace0 \ub9c8\uc9c0\ub9c9 \uce78\uc774 \uacb0\uacfc\uba74 \ud53c\uc2dc\ubcf8(\ud2b9\uc131\uc694\uc778\ub3c4)**\uc73c\ub85c \ub80c\ub354\ub9c1. |\n| **\uc774\uc288 \ud2b8\ub9ac** | \ud55c \ub17c\uc810\uc744 \ud558\uc704 \uac00\uc9c0\u00b7\uc78e\uc73c\ub85c \ubd84\ud574\ud558\uac70\ub098 \uc870\uac74\ubcc4 \uc758\uc0ac\uacb0\uc815 \ubd84\uae30 | `\uc774\uc288 \ud2b8\ub9ac \\| \ubfcc\ub9ac: \ud575\uc2ec \ub17c\uc810 \ubb38\uc7a5 \\| \uac00\uc9c01 / \uac00\uc9c02 / \uac00\uc9c03` + \ubcf8\ubb38 \uce78 = \uac00\uc9c0, \uce78 \uc904 = \uc138\ubd80 \uc694\uc778.<br>\u2022 **\uc758\uc0ac\uacb0\uc815 \ud2b8\ub9ac**: \uce78 \uc904\uc758 \uc808\ubc18 \uc774\uc0c1\uc744 `\uc870\uac74 \u2192 \uacb0\uacfc` \ud615\uc2dd\uc73c\ub85c \uc4f0\uba74 \uc758\uc0ac\uacb0\uc815 \ud2b8\ub9ac\ub85c \ub80c\ub354\ub9c1. |\n| **2\u00d72** | \ub450 \uae30\uc900\ucd95\uc73c\ub85c \ub300\uc0c1\uc744 4\uac1c \uc0ac\ubd84\uba74\uc73c\ub85c \ubd84\ub958 | `2\u00d72 \\| \uac00\ub85c: \uae30\uc900\uba85 \\| \uc138\ub85c: \uae30\uc900\uba85 \\| \uc6b0\uc120: \uc624\ub978\ucabd \uc704 \\| \uce781 / \uce782 / \uce783 / \uce784` + \ubcf8\ubb38 \uce78 4\uac1c(\uc67c\ucabd \uc704\u00b7\uc624\ub978\ucabd \uc704\u00b7\uc67c\ucabd \uc544\ub798\u00b7\uc624\ub978\ucabd \uc544\ub798 \uc21c\uc11c). |\n| **3\u00d73 (9-Box)** | \uc2dc\uc7a5 \ub9e4\ub825\ub3c4 \u00d7 \uc0ac\uc5c5 \uacbd\uc7c1\ub825 \ub4f1 3\u00d73 \ud3ec\ud2b8\ud3f4\ub9ac\uc624 \ud22c\uc790 \uc6b0\uc120\uc21c\uc704 \ubd84\ub958 | `3\u00d73 \\| \uac00\ub85c: \uc0ac\uc5c5 \uacbd\uc7c1\ub825 \\| \uc138\ub85c: \uc2dc\uc7a5 \ub9e4\ub825\ub3c4 \\| \uc6b0\uc120: \uc9d1\uc911 \ud22c\uc790\uad70 \\| \uce781 / \uce782 / \uce783 / \uce784` + \ubcf8\ubb38 \uce78 3~9\uac1c(\uc9d1\uc911 \ud22c\uc790\uad70\u00b7\uc120\ubcc4 \uc721\uc131\uad70\u00b7\ud604\uae08 \ucc3d\ucd9c\uad70\u00b7\uad6c\uc870 \uc870\uc815\uad70 \ub4f1 \ubc30\uce58). |\n| **\uc804\ub7b5 \ud558\uc6b0\uc2a4** | \uc0c1\uc704 \ubaa9\ud45c(\uc9c0\ubd95) \u00b7 \ucd94\uc9c4 \uae30\ub465(3~4\uac1c) \u00b7 \uc2e4\ud589 \uae30\ubc18(\ubc14\ub2e5) | `\uc804\ub7b5 \ud558\uc6b0\uc2a4 \\| \uc9c0\ubd95: \ubaa9\ud45c \ubb38\uc7a5 \\| \ubc14\ub2e5: \uae30\ubc18 \uc694\uc18c \\| \uae30\ub4651 / \uae30\ub4652 / \uae30\ub4653` + \ubcf8\ubb38 \uce78 = \uc804\ub7b5 \uae30\ub465. |\n| **\uce35 \ub760 / \ud53c\ub77c\ubbf8\ub4dc** | \uc704\uacc4\u00b7\uacc4\uce35 \uad6c\uc870 (\uc0c1\uc704 \uacc4\uce35\ubd80\ud130 \uc21c\uc11c\ub300\ub85c) | `\uce35 \ub760 \\| \uce351 / \uce352 / \uce353` \ub610\ub294 `\ud53c\ub77c\ubbf8\ub4dc \\| \uce351 / \uce352 / \uce353` + \ubcf8\ubb38 \uce78 = \uc704\ubd80\ud130 \ucc28\ub840\ub300\ub85c \uce35 \ubc30\uce58. |\n| **\uc21c\ud658 \uace0\ub9ac** | \uacb0\uacfc\uac00 \ub2e4\uc2dc \uc6d0\uc778\uc73c\ub85c \ub418\uba39\uc784\ub418\ub294 \uc120\uc21c\ud658\u00b7\uc545\uc21c\ud658 (3~5\ub2e8\uacc4) | `\uc21c\ud658 \uace0\ub9ac \\| \uc911\uc2ec: \ud575\uc2ec \ub3d9\ub825 \\| \uace0\ub9ac1 / \uace0\ub9ac2 / \uace0\ub9ac3 / \uace0\ub9ac4` + \ubcf8\ubb38 \uce78 = \uc21c\ud658 \ub2e8\uacc4. |\n| **\uc218\uc601 \ub808\uc778** | \ubcf5\uc218 \uc8fc\uccb4(\ubd80\uc11c\u00b7\ucc38\uc5ec\uc790)\ubcc4 \ub2e8\uacc4\ub9c8\ub2e4 \uc218\ud589\ud558\ub294 \uc5ed\ud560\u00b7\ud65c\ub3d9 | `\uc218\uc601 \ub808\uc778 \\| \ub2e8\uacc4: \uc694\uad6c \uc778\uc9c0 / \uc120\ud0dd \ud3c9\uac00 / \uacc4\uc57d \uc2b9\uc778 \\| \uc8fc\uccb41 / \uc8fc\uccb42 / \uc8fc\uccb43` + \ubcf8\ubb38 \uce78 = \uc8fc\uccb4, **\uce78 \uc904 \uc218 = \ub2e8\uacc4 \uc218**(`\uacb0\ub860:` \uae08\uc9c0). |\n| **\uc0ac\ub840 \uc774\ud589** | \ubcf5\uc218 \uc0ac\ub840 \uac01\uac01\uc758 \ub3c4\uc785 \uc804\ud6c4(`\uc804 \u2192 \ud6c4`) \ubcc0\ud654 \uc785\uc99d | `\uc0ac\ub840 \uc774\ud589 \\| \uc0ac\ub8401 / \uc0ac\ub8402 / \uc0ac\ub8403` + \ubcf8\ubb38 \uce78 = \uc0ac\ub840 \uc774\ub984, **\uce78 \uc904\uc740 \uce78\ub2f9 \uc815\ud655\ud788 2\uc904**(`\uc804 \u2192 \ud6c4` \ubb38\ubc95 \uc900\uc218, `\uacb0\ub860:` \uae08\uc9c0). |\n| **\ud3c9\uac00\ud45c** | \ub300\uc548\u00b7\uc720\ud615 \u00d7 \ud3c9\uac00 \uae30\uc900\ubcc4 \ub4f1\uae09 \ud310\uc815 | `\ud3c9\uac00\ud45c \\| \uae30\uc900: \ube44\uc6a9 / \uc18d\ub3c4 / \uc548\uc815\uc131 / \uc720\uc9c0\ubcf4\uc218 \\| \ub300\uc5481 / \ub300\uc5482 / \ub300\uc5483` + \ubcf8\ubb38 \uce78 = \ub300\uc548, **\uce78 \uc904 \uc218 = \uae30\uc900 \uc218**, \ubaa8\ub4e0 \uc904\uc744 `\uc0c1 \u2014 \ud480\uc774` \ub610\ub294 `\u25cf \u2014 \ud480\uc774`\ub85c \uc791\uc131(`\uacb0\ub860:` \uae08\uc9c0).<br>\u2022 **\ud3ec\uc9c0\uc154\ub2dd \ubc84\ube14 \ub9f5**: `\\| \ud45c\ud604: \ubc84\ube14 \ub9f5`\uc744 \ubd99\uc774\uba74 \uae30\uc900 1(\uac00\ub85c)\u00b7\uae30\uc900 2(\uc138\ub85c)\u00b7\uae30\uc900 3(\uc6d0 \ud06c\uae30) 2\ucc28\uc6d0 \ubc84\ube14 \ub9f5\uc73c\ub85c \ub80c\ub354\ub9c1. |\n| **\ub808\uc774\ub354** | \uc790\uc0ac \ub300 \uacbd\uc7c1\uc0ac\u00b7\uc120\ub3c4\uc0ac\uc758 5~6\uac1c \ud575\uc2ec \uc5ed\ub7c9 \ucd95 \uaca9\ucc28 \ube44\uad50 | `\ub808\uc774\ub354 \\| \uae30\uc900: \uc6d0\uac00 / \ud488\uc9c8 / \ub0a9\uae30 / \uae30\uc220 / \uc11c\ube44\uc2a4 \\| \uacc4\uc5f4: \uc790\uc0ac 65 80 70 90 60 / \uc120\ub3c4\uc0ac 85 85 90 85 95 \\| \ub2e8\uc704: \uc810`. |\n| **\ud45c** | \ud589 \u00d7 \uc5f4 \uad6c\uc870\uc758 \uc815\ub7c9\u00b7\uc815\uc131 \uc0ac\uc2e4 \ub300\uc870 \ubc0f \uc2e4\ud589 \uacfc\uc81c \ud45c | `\ud45c \\| \uba38\ub9ac: \uad6c\ubd84 / '26\ub144 / '27\ub144 / \uc99d\uac10 \\| \ud5891 / \ud5892 / \ud5893` + \ubcf8\ubb38 \uce78 = \ud589 \uc774\ub984, **\uce78 \uc904 \uc218 = \uba38\ub9ac \uc218 \u2212 1**(`\uacb0\ub860:` \uae08\uc9c0). \ub9c8\uc9c0\ub9c9 \uc7a5\uc5d0\uc11c `\ud45c \\| \uba38\ub9ac: \uacfc\uc81c / \uadfc\uac70 / \uccab \uc870\uce58 / \ub2f4\ub2f9`\uc73c\ub85c \uc4f0\uba74 \uc2e4\ud589 \uacfc\uc81c \ud45c\ub85c \ub80c\ub354\ub9c1. |\n| **\uce74\ub4dc \ubb36\uc74c / \uc5ed\ud560 \ub77c\ubca8** | \uc0c1\ud638 \uc704\uacc4\u00b7\uc21c\uc11c\uac00 \uc5c6\ub294 \ub3c5\ub9bd \ubb36\uc74c \ub610\ub294 \uacf5\ud1b5 \uc601\uc5ed(\ubca4 \ub2e4\uc774\uc5b4\uadf8\ub7a8) | `\uce74\ub4dc \ubb36\uc74c \\| \uce781 / \uce782 / \uce783`. `\uce74\ub4dc \ubb36\uc74c \\| \uacf5\ud1b5: \uad50\uc9d1\ud569 \ub0b4\uc6a9 \\| \uc8fc\uccb41 / \uc8fc\uccb42`\ub85c \uc4f0\uba74 \uad50\ucc28 \uc6d0\ud615 \ubca4 \ub2e4\uc774\uc5b4\uadf8\ub7a8\uc73c\ub85c \ub80c\ub354\ub9c1. |\n| **\uc778\uc6a9** | \uacb
