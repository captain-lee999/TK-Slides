<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TK 장표 변환기</title>
<style>
  :root{--g:#1e5a32;--gm:#4b7545;--gt:#e2efda;--ink:#000;--line:#bfbfbf;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:#f2f2f2;color:var(--ink);}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:2.45px solid #003300;}
  header h1{margin:0;font-size:18px;}
  header p{margin:0;font-size:12px;color:#595959;}
  main{display:grid;grid-template-columns:minmax(300px,32%) 1fr;gap:12px;padding:12px;height:calc(100vh - 58px);}
  .pane{display:flex;flex-direction:column;gap:8px;min-height:0;}
  textarea{flex:1;width:100%;resize:none;padding:10px;font:12.5px/1.5 "Noto Sans KR","Malgun Gothic",monospace;border:1px solid var(--line);border-radius:6px;}
  .btns{display:flex;flex-wrap:wrap;gap:6px;}
  button{padding:8px 12px;border:0;border-radius:6px;background:var(--gm);color:#fff;font:700 13px "Noto Sans KR",sans-serif;cursor:pointer;}
  button.main{background:var(--g);} button.sub{background:#7f7f7f;}
  #msg{font-size:12px;color:#595959;min-height:18px;}
  #msg.err{color:#c00000;}
  #forms{font-size:12px;max-height:30vh;overflow:auto;}
  #forms div{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #e3e3e3;}
  #forms span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #forms em{font-style:normal;color:var(--g);font-weight:700;white-space:nowrap;}
  #forms button{padding:3px 8px;font-size:11px;}
  iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:6px;background:#e9e9e9;}
  @media(max-width:800px){main{grid-template-columns:1fr;height:auto;} textarea{min-height:260px;} iframe{min-height:520px;}}
</style></head>
<body>
<header><div><h1>TK 장표 변환기 <small style="font-size:12px;font-weight:400;opacity:.7">v4.8</small></h1><p>장표기획 원고(또는 장표생성 HTML 코드)를 붙여 넣고 「장표 만들기」 → 오른쪽 장표의 「PPT 내보내기」로 .pptx 받기</p></div></header>
<main>
  <div class="pane">
    <textarea id="src" placeholder="### [표지] : 보고서 제목 (부제 : …)&#10;### [목차]&#10;- 스토리 라인: …&#10;### 본문 1 : Ⅰ- 1. 제목&#10;- 리드: ✓ …&#10;- 서브메시지:&#10;  - 근거: …&#10;- 본문 구조: 비교대칭 — …&#10;- 본문:&#10;  - 칸 이름&#10;    - 사실&#10;- 강조: …&#10;- 받침: … → …&#10;- 출처: ※ …"></textarea>
    <div class="btns">
      <button class="main" id="go">장표 만들기</button>
      <button id="open">새 창으로 열기</button>
      <button id="save">HTML 저장</button>
      <button class="sub" id="clear">지우기</button>
    </div>
    <div id="msg"></div>
        <div id="forms"></div>
  </div>
  <div class="pane"><iframe id="view" title="장표 미리보기"></iframe></div>
</main>
<script>
(function () {
  var KIT = (function () {
    var here = location.href.replace(/[^\/]*$/, '');
    if (/^https?:/.test(here) && /github\.io|127\.0\.0\.1|localhost/.test(here)) return here;
    return 'https://cdn.jsdelivr.net/gh/captain-lee999/TK-Slides@main/';
  })();
  var $ = function (id) { return document.getElementById(id); };
  var last = '';
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function clean(s) { return s.replace(/\*\*(.+?)\*\*/g, '$1').replace(/`/g, '').trim(); }

  /* ── 1. 원고 읽기 ───────────────────────── */
  function parse(text) {
    var lines = text.replace(/\r/g, '').split('\n');
    var deck = { cover: null, toc: null, slides: [] }, cur = null, mode = null, sub = null;
    lines.forEach(function (raw) {
      var line = raw.replace(/\t/g, '    ');
      if (/^\s*---+\s*$/.test(line)) return;
      var h = /^\s*#{2,4}\s*(.+)$/.exec(line);
      if (h) {
        var t = clean(h[1]);
        mode = null;
        if (/^\[?\s*표지\s*\]?/.test(t)) {
          var m = /^\[?\s*표지\s*\]?\s*[:：]?\s*(.*)$/.exec(t), title = m[1], subt = '';
          var p = /\(\s*부제\s*[:：]\s*(.+)\)\s*$/.exec(title);
          if (p) { subt = p[1]; title = title.slice(0, p.index).trim(); }
          deck.cover = { title: title, sub: subt }; cur = deck.cover; return;
        }
        if (/^\[?\s*목차\s*\]?/.test(t)) { deck.toc = { story: '', parts: [] }; cur = deck.toc; return; }
        var b = /^본문\s*\d+\s*[:：]\s*(.+)$/.exec(t) || /^(.+)$/.exec(t);
        cur = { title: b[1].replace(/\s*-\s*(?=\d)/, '-').replace(/\s+/g, ' '), lead: '', subs: [], struct: '', dmain: '', daux: '', cells: [], key: '', band: '', note: '', imp: '' };
        deck.slides.push(cur); return;
      }
      if (!cur) return;
      if (!line.trim()) { if (mode === 'body') sub = 'gap'; return; }
      var ind = (/^(\s*)/.exec(line)[1] || '').length;
      var item = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(line);
      var txt = clean(item ? item[1] : line).replace(/\*\*/g, "");
      var kv = /^([가-힣 ]{2,8})\s*[:：]\s*(.*)$/.exec(txt);
      if (cur === deck.toc) {
        if (kv && /스토리/.test(kv[1])) { deck.toc.story = kv[2]; return; }
        var part = /^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\.?\s*[^:：/]+?)\s*(?:[:：]\s*(.*))?$/.exec(txt);
        if (part) {
          var items = part[2] ? part[2].split(/\s*\/\s*/) : [];
          deck.toc.parts.push({ name: part[1].trim(), items: items.map(function (s) { return s.replace(/^\d+\.\s*/, ''); }) });
          return;
        }
        if (deck.toc.parts.length) deck.toc.parts[deck.toc.parts.length - 1].items.push(txt.replace(/^(\d+\.\s*)+/, ''));
        return;
      }
      if (cur === deck.cover) return;
      var KNOWN = /^(리드|서브메시지|본문구조|주도식|근거도식|본문|강조|받침|출처|시사점|물음|연결|근거|실행|비중|사실띠|근거띠)$/;
      if (kv && !KNOWN.test(kv[1].replace(/\s/g, ''))) kv = null;
      if (kv && mode === 'body' && /^(근거|실행)$/.test(kv[1].replace(/\s/g, ''))) kv = null;
      if (kv) {
        var k = kv[1].replace(/\s/g, ''), v = kv[2];
        if (mode === 'sub' && /^(근거|실행)$/.test(k)) { if (v && !/^없음$/.test(v)) cur.subs.push({ kind: k, text: v }); return; }
        mode = null;
        if (k === '리드') cur.lead = v.replace(/^✓\s*/, '');
        else if (k === '서브메시지') { mode = 'sub'; if (v && !/^없음$/.test(v)) cur.subs.push({ kind: /^☞/.test(v) ? '실행' : '근거', text: v }); }
        else if (k === '본문구조') cur.struct = v;
        else if (k === '주도식') cur.dmain = v;
        else if (k === '근거도식') cur.daux = v;
        else if (k === '본문') { mode = 'body'; sub = 'gap'; if (v) cur.cells.push({ name: v, items: [] }); }
        else if (k === '강조') cur.key = v;
        else if (k === '받침') cur.band = v;
        else if (k === '사실띠' || k === '근거띠') cur.facts = v;
        else if (k === '출처') cur.note = v.replace(/^※\s*/, '');
        else if (k === '시사점') cur.imp = v.replace(/^☞\s*/, '');
        return;
      }
      if (mode === 'sub') { cur.subs.push({ kind: /^☞/.test(txt) ? '실행' : '근거', text: txt }); return; }
      if (mode === 'body') { (cur._raw = cur._raw || []).push({ txt: txt, ind: ind, gap: sub === 'gap' }); sub = null; return; }
      if (cur !== deck.toc) (cur._misc = cur._misc || []).push({ txt: txt, ind: ind, line: line });
    });
    deck.slides.forEach(function (s) {
      var raw = s._raw || [];
      if (!raw.length) return;
      var base = Math.min.apply(null, raw.map(function (r) { return r.ind; }));
      var indented = raw.some(function (r) { return r.ind > base; });
      /* 도식 재료로 칸마다 줄 수를 미리 앎: 전환표 차원 수 · 평가표 기준 수 · 레인 단계 수 · 사례 2줄 */
      function fixedN(dline) {
        var d = design(dline); if (!d) return 0;
        if (/전환표|대비표/.test(d.name)) return list(d.kv['차원']).length;
        if (/평가표/.test(d.name)) return list(d.kv['기준']).length;
        if (/레인|수영/.test(d.name)) return list(d.kv['단계']).length;
        if (/사례|이행/.test(d.name)) return 2;
        if (/^표/.test(d.name)) return Math.max(0, list(d.kv['머리']).length - 1);
        return 0;
      }
      var nMain = fixedN(s.dmain), nAux = fixedN(s.daux);
      var gapN = raw.filter(function (r) { return r.gap; }).length, gapAll = gapN > raw.length * 0.5 || gapN <= 1;
      function looksName(x) { return x.length <= 24 && !/[:：→]/.test(x) && !/^[↑↓✓✗●◐○!*\d'’]/.test(x) && !/^결론/.test(x) && !/\d[\d,.]*\s*(%|억|원|명|개|건|배|년)/.test(x); }
      var forced = 0, prevConcl = false;
      raw.forEach(function (r) {
        var lastCell = s.cells[s.cells.length - 1], isName;
        if (indented) isName = r.ind === base;
        else if (/^\[근거\]/.test(r.txt)) isName = true;
        else if (!lastCell) { if (looksName(r.txt) || nMain > 0) isName = true; else { s.cells.push({ name: '', items: [] }); lastCell = s.cells[0]; isName = false; } }
        else if (forced > 0) isName = false;
        else if (!indented && nMain > 0 && lastCell && !/^\[근거\]/.test(lastCell.name) && lastCell.items.length >= nMain && !/^결론\s*[:：]/.test(r.txt)) isName = true;
        else if (prevConcl) isName = true;
        else if (/^\[근거\]/.test(lastCell.name)) isName = false;
        else if (!gapAll) isName = r.gap || (r.txt.length <= 18 && looksName(r.txt) && lastCell.items.length >= 2 && false);
        else isName = looksName(r.txt) && lastCell.items.length >= 1;
        if (isName && /^결론\s*[:：]/.test(r.txt) && lastCell) isName = false;
        if (isName) { s.cells.push({ name: r.txt, items: [] }); forced = indented ? 0 : (/^\[근거\]/.test(r.txt) ? nAux : nMain); }
        else { (lastCell || (s.cells.push({ name: '', items: [] }), s.cells[0])).items.push(r.txt); if (forced > 0) forced--; }
        prevConcl = /^결론\s*[:：]/.test(r.txt);
      });
    });
    deck.slides.forEach(function (s) { s.cells = s.cells.filter(function (c) { return c.name || c.items.length; }); s.cells.forEach(function (c) { c.name = c.name.replace(/\s*\([A-Za-z][^)]*\)/g, '').trim(); }); });
    /* 틀을 벗어난 원고도 빈 장이 되지 않게: 남은 줄로 리드·칸을 만듦 */
    deck.slides.forEach(function (s) {
      if (s.cells.length || !s._misc || !s._misc.length) return;
      var base = Math.min.apply(null, s._misc.map(function (r) { return r.ind; }));
      s._misc.forEach(function (r) {
        var m = /^([^:：]{2,24})\s*[:：]\s*(.*)$/.exec(r.txt), lc = s.cells[s.cells.length - 1];
        if (m && /핵심\s*메시지|결론|메시지|요지/.test(m[1]) && m[2] && !s.lead) { s.lead = m[2].replace(/^✓\s*/, ''); return; }
        if (m && /역할|배경|톤|도식|레이아웃|주제/.test(m[1])) return;
        if (m && !m[2]) { s.cells.push({ name: m[1].replace(/^\d+\.\s*/, '').replace(/\s*[\[(].*$/, ''), items: [] }); return; }
        if (r.ind <= base && m && m[2] && m[2].length > 40 && !lc) { s.cells.push({ name: m[1], items: [m[2]] }); return; }
        if (!lc) { s.cells.push({ name: '', items: [] }); lc = s.cells[0]; }
        lc.items.push(r.txt.replace(/^\d+\.\s*/, ''));
      });
      s.cells = s.cells.filter(function (c) { return c.items.length; });
      if (!s.lead && s.cells.length === 1 && !s.cells[0].name) s.lead = '';
    });
    return deck;
  }


  /* 스킬 밖 기획안(「### [슬라이드 N] 제목 / 핵심 메시지: / 주요 내용:」)을 원고 틀에 가깝게 바꿈 */
  function freeForm(text) {
    var L = text.replace(/\r/g, '').split('\n'), out = [], first = true, inSlide = false;
    L.forEach(function (ln) {
      var h = /^\s*#{2,4}\s*\[?\s*(?:슬라이드|장표|Slide)\s*(\d+)\s*\]?\.?\s*(.*)$/i.exec(ln.replace(/\*\*/g, ''));
      if (h) {
        var ttl = h[2].replace(/^[:：.\s]+/, '').trim();
        if (first && /표지|Title|타이틀/i.test(ttl)) { out.push('### [표지] : '); first = false; inSlide = 'cover'; return; }
        first = false; inSlide = true; out.push('### 본문 ' + h[1] + ' : ' + ttl.replace(/\s*\([A-Za-z ]+\)/g, '')); return;
      }
      if (!inSlide) return;
      var m = /^\s*[-*•]\s*\*\*([^*:：]+)\*\*\s*[:：]\s*(.*)$/.exec(ln) || /^\s*[-*•]\s*([^:：]{2,14})\s*[:：]\s*(.*)$/.exec(ln);
      if (inSlide === 'cover') {
        if (m && /제목/.test(m[1])) out[out.length - 1] = '### [표지] : ' + m[2].trim();
        else if (m && /부제/.test(m[1])) out[out.length - 1] += ' (부제 : ' + m[2].trim() + ')';
        return;
      }
      if (m && /핵심\s*메시지|결론|메시지/.test(m[1])) { out.push('- 리드: ✓ ' + m[2].trim().replace(/(습니다|입니다|합니다)\.?$/, '').replace(/해야$/, '해야 함')); return; }
      if (m && /시각화|구성\s*요소|레이아웃|배경|톤|역할|도식/.test(m[1])) return;
      if (m && /(주요|비교|실행|핵심)\s*(내용|포인트|과제|사례)|주요\s*사례/.test(m[1]) && !m[2]) { out.push('- 본문:'); return; }
      if (/^\s*---+\s*$/.test(ln) || /드릴까요\?|기획안입니다/.test(ln)) return;
      if (/^\s*[-*•]\s+/.test(ln)) { if (!/- 본문:/.test(out.join('\n').split('### ').pop())) out.push('- 본문:'); out.push('  ' + ln.trim().replace(/^[*•]/, '-')); }
    });
    return out.join('\n');
  }
  /* 구조화 결과(# 제목 / **핵심 결론:** / ## 절 / > 관계: … · 도식 후보: … / ### ① 묶음 / 표 / **핵심 수치:**)를 바로 장표로 */
  function isStruct(text) { return /^>\s*관계\s*[:：]/m.test(text) || /^\*\*핵심 결론[:：]?\*\*/m.test(text); }
  function parseStruct(text) {
    var deck = { cover: null, toc: { story: '', parts: [{ name: '구성', items: [] }] }, slides: [] }, cur = null, cell = null;
    text.replace(/\r/g, '').split('\n').forEach(function (raw) {
      var line = raw.replace(/\t/g, '    '), m;
      if (!line.trim() || /^\s*---+\s*$/.test(line)) return;
      if ((m = /^#\s+(.+)$/.exec(line))) { deck.cover = { title: clean(m[1]), sub: '' }; return; }
      if ((m = /^\*\*핵심 결론[:：]?\*\*\s*[:：]?\s*(.+)$/.exec(line.trim()))) { deck.toc.story = clean(m[1]); return; }
      if ((m = /^##\s+(?:\d+\.\s*)?(.+)$/.exec(line))) {
        cur = { title: clean(m[1]), lead: '', subs: [], struct: '', dmain: '', daux: '', cells: [], key: '', band: '', note: '', imp: '', table: null, nums: '' };
        deck.slides.push(cur); deck.toc.parts[0].items.push(cur.title); cell = null; return;
      }
      if (!cur) return;
      if ((m = /^>\s*관계\s*[:：]\s*([^·|]+?)\s*(?:[·|]\s*도식\s*후보\s*[:：]\s*(.+))?$/.exec(line.trim()))) { cur.rel = m[1].trim(); cur.dmain = (m[2] || '').trim(); return; }
      if ((m = /^>\s*리드\s*[:：]\s*(.+)$/.exec(line.trim()))) { cur.lead = clean(m[1]).replace(/^✓\s*/, ''); return; }
      if ((m = /^>\s*(근거|실행)\s*[:：]\s*(.+)$/.exec(line.trim()))) { cur.subs.push({ kind: m[1], text: clean(m[2]) }); return; }
      if ((m = /^###\s+(?:[①-⑳\d.)\s]+)?(.+)$/.exec(line))) { cell = { name: clean(m[1]), items: [] }; cur.cells.push(cell); return; }
      if ((m = /^\*\*핵심 수치[:：]?\*\*\s*[:：]?\s*(.+)$/.exec(line.trim()))) { cur.nums = clean(m[1]); return; }
      if (/^\s*\|/.test(line)) {
        if (/^\s*\|[\s:\-|]+\|\s*$/.test(line)) return;
        var row = line.trim().replace(/^\||\|$/g, '').split('|').map(function (x) { return clean(x); });
        if (!cur.table) cur.table = { head: row, rows: [] }; else cur.table.rows.push(row);
        return;
      }
      if ((m = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(line))) {
        var x = clean(m[1]).replace(/\*\*/g, '').replace(/([^.])\.$/, '$1');
        if (!cell) { cell = { name: '', items: [] }; cur.cells.push(cell); }
        cell.items.push(x); return;
      }
      if (!cur.lead) cur.lead = clean(line.trim());
    });
    deck.slides.forEach(function (s, i) {
      var concl = [];
      s.cells.forEach(function (c) { c.items.forEach(function (x) { var m = /^결론\s*[:：]\s*(.+)$/.exec(x); if (m) concl.push(m[1].replace(/함$|임$/, '')); }); });
      var dm = s.dmain || '', act = s.cells.length && s.cells.every(function (c) { return c.items.some(function (x) { return /^(첫\s*조치|담당)\s*[:：]/.test(x); }); });
      if (act) {
        var keys = ['근거', '첫 조치', '담당'];
        s.dmain = '표 | 머리: 과제 / ' + keys.join(' / ');
        s.cells = s.cells.map(function (c) { return { name: c.name, items: keys.map(function (k) { var it = c.items.find(function (x) { return x.replace(/\s/g, '').indexOf(k.replace(/\s/g, '') + ':') === 0 || x.replace(/\s/g, '').indexOf(k.replace(/\s/g, '') + '：') === 0; }) || ''; return it.replace(/^[^:：]+[:：]\s*/, ''); }) }; });
        if (!s.lead) s.lead = '과제 ' + s.cells.length + '개를 담당 부서별 첫 조치로 착수 필요';
      } else if (s.table && s.table.rows.length) {
        var hd = s.table.head, rows = s.table.rows, aux = s.cells;
        if (/대비|전환/.test(s.rel || '') || /전환표/.test(dm) || hd.length === 3) {
          s.dmain = '전환표 | 차원: ' + rows.map(function (r) { return r[0]; }).join(' / ');
          s.cells = [1, 2].map(function (k) { return { name: hd[k] || '', items: rows.map(function (r) { return r[k] || ''; }) }; });
        } else {
          s.dmain = '표 | 머리: ' + hd.join(' / ');
          s.cells = rows.map(function (r) { return { name: r[0], items: r.slice(1) }; });
        }
        if (aux.length) { s.cells = s.cells.concat(aux.map(function (c) { return { name: '[근거] ' + c.name, items: c.items }; })); s.daux = '카드 묶음'; }
      } else {
        var nm = dm.replace(/\s*\/.*$/, '').trim();
        if (/단계/.test(nm) && s.cells.length > 5) nm = '카드 묶음';
        s.dmain = nm || '카드 묶음';

    if (!d.slides.length) { m.textContent = '「### 본문 1 : …」 같은 장 머리를 찾지 못했습니다. 장표기획 원고 전체를 붙여 넣어 주십시오.'; m.className = 'err'; return; }
    if (t0 !== lastSrc) { OV = {}; lastSrc = t0; }
    show(build(d, OV)); formsUI(d);
    var miss = d.slides.filter(function (s) { return !s.cells.length; }).length;
    var guessed = d.slides.map(function (s, i) { return s.guess || !s.lead ? (i + 1) : 0; }).filter(Boolean);
    if (!exact && kind === 'plan') { m.className = 'err'; }
    m.textContent = (kind === 'struct' ? '[구조화 결과] ' : !exact ? '[원고 틀 일부 벗어남 — 너그럽게 읽음] ' : '') + (guessed.length ? '추정으로 그린 장: ' + guessed.join('·') + ' / ' : '') + '표지 ' + (d.cover ? 1 : 0) + ' · 목차 ' + (d.toc ? 1 : 0) + ' · 본문 ' + d.slides.length + '장을 만들었습니다.' + (miss ? ' 본문이 비어 있는 장 ' + miss + '개 — 원고의 「본문:」 줄을 확인해 주십시오.' : '');
  };
  var OV = {}, lastSrc = '', GOTO = null;
  function pageOf(d, i) { return i + 1 + (d.cover ? 1 : 0) + (d.toc ? 1 : 0); }
  function formsUI(d) {
    var box = $('forms'); box.innerHTML = '';
    d.slides.forEach(function (s, i) {
      if (!s._form) return;
      var row = document.createElement('div');
      row.innerHTML = '<span>' + pageOf(d, i) + '쪽 · ' + esc(s.title.replace(/^[ⅠⅡⅢⅣⅤ\d\-.\s]+/, '')) + '</span><em>' + esc(s._form) + '</em>';
      if (s._alts.length > 1) {
        var b = document.createElement('button'); b.textContent = '다른 안'; b.className = 'sub';
        b.onclick = function () { var k = s._alts.indexOf(s._form); OV[s.title] = s._alts[(k + 1) % s._alts.length]; GOTO = i; $('go').onclick(); };
        row.appendChild(b);
      }
      box.appendChild(row);
    });
  }
  $('open').onclick = function () { if (!last) return; var w = window.open(URL.createObjectURL(new Blob([last], { type: 'text/html' })), '_blank'); if (!w) $('msg').textContent = '팝업이 막혔습니다. 「HTML 저장」을 써 주십시오.'; };
  $('save').onclick = function () {
    if (!last) return;
    var a = document.createElement('a'), t = (/<title>([^<]*)<\/title>/.exec(last) || [, 'TK 장표'])[1];
    a.href = URL.createObjectURL(new Blob([last], { type: 'text/html' })); a.download = t + '.html'; a.click();
  };
  $('clear').onclick = function () { $('forms').innerHTML = ''; $('src').value = ''; $('view').srcdoc = ''; last = ''; $('msg').textContent = ''; };
  window.TKMake = { parse: parse, build: build };
})();
</script>
