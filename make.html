// Apply the active '다른 안' override to a slide's main spec & layout
function resolveSlideVariant(sl, sIdx) {
  const alts = getSlideAlternatives(sl);
  const st = slideAltState[sIdx] || { altIdx: 0, directKey: '' };
  const chosenAlt = alts[st.altIdx % alts.length] || alts[0];

  // Clone dMain so we don't mutate parsed manuscript state permanently
  const effMain = sl.dMain ? {
    name: sl.dMain.name,
    params: { ...(sl.dMain.params || {}) },
    cellNames: [...(sl.dMain.cellNames || [])]
  } : { name: '단계 흐름', params: {}, cellNames: [] };

  let splitMode = chosenAlt.split;

  if (st.directKey) {
    if (st.directKey.startsWith('layout:')) {
      splitMode = st.directKey.replace('layout:', '');
    } else if (st.directKey.startsWith('diag:')) {
      const parts = st.directKey.split(':');
      effMain.name = parts[1] || effMain.name;
      effMain.params['표현'] = parts[2] || '';
      if (effMain.name === '가치 사슬' && !effMain.params['지원']) {
        effMain.params['지원'] = '전사 표준 인프라 / 실시간 데이터 관제 / 품질·안전 보증';
      }
      if (effMain.name === '성숙도' && !effMain.params['현재']) {
        effMain.params['현재'] = '2';
        effMain.params['목표'] = String(Math.max(3, sl.mainCells.length || 4));
      }
    }
  } else {
    effMain.name = chosenAlt.mainType;
    if (chosenAlt.mainExpr !== undefined) {
      effMain.params['표현'] = chosenAlt.mainExpr;
    }
    if (effMain.name === '전략 하우스' && !effMain.params['지붕']) {
      effMain.params['지붕'] = sl.lead;
      effMain.params['바닥'] = sl.subBasis || '전사 표준 데이터 및 실행 인프라 기반';
    }
  }

  const activeCells = (sl.mainCells && sl.mainCells.length > 0) ? sl.mainCells : sl.auxCells;
  return {
    effMain,
    activeCells,
    splitMode,
    altIdx: st.altIdx % alts.length,
    altTotal: alts.length,
    altLabel: st.directKey ? `직접선택 (${effMain.name})` : chosenAlt.label,
    alts,
    directKey: st.directKey || ''
  };
}

// Render Individual Line inside a Cell using the 10 Line Grammar Rules
function renderCellLine(line, focal, leadText) {
  const s = String(line || '').trim();
  if (!s || /^결론\s*[:：]/.test(s)) return '';

  if (/과제\s*[:：]/.test(s) && /담당\s*[:：]/.test(s)) {
    const segs = s.split('/').map(x => x.trim());
    return `<div class="tk-line" style="background:#FFFFFF;padding:4px 6px;border-radius:3px;flex-wrap:wrap;">` +
      segs.map(seg => `<span style="margin-right:8px;">${highlightFocal(seg, focal)}</span>`).join('') +
      `</div>`;
  }

  const ratioMatch = s.match(/^(.+?)\s*=\s*(\d+(?:\.\d+)?)\s*%$/);
  if (ratioMatch) {
    const label = ratioMatch[1].trim();
    const pct = Math.min(100, Math.max(0, parseFloat(ratioMatch[2])));
    return `<div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;">
        <span>${highlightFocal(label, focal)}</span>
        <span style="color:var(--c-pri);">${pct}%</span>
      </div>
      <div style="height:6px;background:#D1D5DB;border-radius:3px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:var(--c-pri);border-radius:3px;"></div>
      </div>
    </div>`;
  }

  const rateMatch = s.match(/^([상중하●◐○])\s*[—\-]\s*(.+)$/);
  if (rateMatch) {
    const g = rateMatch[1];
    const desc = rateMatch[2].trim();
    const harvey = (g === '상' || g === '●') ? '●' : (g === '중' || g === '◐') ? '◐' : '○';
    const col = (g === '상' || g === '●') ? 'var(--c-pri)' : (g === '중' || g === '◐') ? '#1F497D' : '#64748B';
    return `<div class="tk-line">
      <span style="color:${col};font-size:12px;font-weight:900;flex-shrink:0;">${harvey}</span>
      <span><strong style="color:${col};">${esc(g)}</strong> — ${highlightFocal(desc, focal)}</span>
    </div>`;
  }

  if (s.includes('→')) {
    const parts = s.split('→').map(p => p.trim());
    return `<div class="tk-line" style="align-items:center;flex-wrap:wrap;">
      <span style="color:var(--c-muted);">${highlightFocal(parts[0], focal)}</span>
      <span style="color:var(--c-lead);font-weight:800;padding:0 3px;">→</span>
      <span style="font-weight:700;color:var(--c-ink);">${highlightFocal(parts.slice(1).join(' → '), focal)}</span>
    </div>`;
  }

  const mkMatch = s.match(/^([↑↓✓✗●◐○!])\s+(.+)$/);
  if (mkMatch) {
    const sym = mkMatch[1];
    const rest = mkMatch[2].trim();
    let cls = 'lvl';
    if (sym === '↑' || sym === '✓') cls = 'pos';
    else if (sym === '↓' || sym === '✗') cls = 'neg';
    else if (sym === '!') cls = 'warn';

    const kv = rest.match(/^([^:：]{1,14})\s*[:：]\s*(.+)$/);
    if (kv) {
      return `<div class="tk-line">
        <span class="tk-mk ${cls}">${esc(sym)}</span>
        <span><strong class="tk-line-key">${highlightFocal(kv[1], focal)}</strong> ${highlightFocal(kv[2], focal)}</span>
      </div>`;
    }
    return `<div class="tk-line">
      <span class="tk-mk ${cls}">${esc(sym)}</span>
      <span>${highlightFocal(rest, focal)}</span>
    </div>`;
  }

  const numMatch = s.match(/^([+\-]?\d[\d,.]*(?:\s*(?:%|억|만|천|조|건|명|개|곳|년|배|점|원|위|%p|일|상자))?)\s+(.+)$/);
  if (numMatch && s.length <= 42 && !s.includes(':')) {
    const numToken = numMatch[1].trim();
    const inLead = leadText && leadText.includes(numToken);
    if (!inLead) {
      return `<div class="tk-bignum">
        <span class="tk-bignum-val">${highlightFocal(numToken, focal)}</span>
        <span class="tk-bignum-desc">${highlightFocal(numMatch[2], focal)}</span>
      </div>`;
    }
  }

  const kvMatch = s.match(/^([^:：]{1,14})\s*[:：]\s*(.+)$/);
  if (kvMatch) {
    return `<div class="tk-line">
      <span>• <strong class="tk-line-key">${highlightFocal(kvMatch[1], focal)}</strong> ${highlightFocal(kvMatch[2], focal)}</span>
    </div>`;
  }

  return `<div class="tk-line"><span>• ${highlightFocal(s, focal)}</span></div>`;
}

function renderStandardCard(cell, focal, idxBadge, leadText) {
  const isFocal = focal && (cell.name.includes(focal) || focal.includes(cell.name));
  const conclLine = cell.lines.find(l => /^결론\s*[:：]/.test(l));
  const conclText = conclLine ? conclLine.replace(/^결론\s*[:：]\s*/, '').trim() : '';
  const bodyLines = cell.lines.filter(l => !/^결론\s*[:：]/.test(l));

  return `<div class="tk-card ${isFocal ? 'focal' : ''}">
    <div class="tk-card-head">
      <span>${idxBadge ? `<span style="opacity:0.9;margin-right:4px;">${idxBadge}</span>` : ''}${esc(cell.name)}</span>
    </div>
    <div class="tk-card-items">
      ${bodyLines.map(l => renderCellLine(l, focal, leadText)).join('')}
    </div>
    ${conclText ? `<div class="tk-concl">▪ ${highlightFocal(conclText, focal)}</div>` : ''}
  </div>`;
}

// v6.5 차트 재료 읽기: 계열 「이름 값 값 / 이름 값 값」 → [{label, vals}]
function parseSeriesSpec(raw) {
  return String(raw || '').split('/').map(s => s.trim()).filter(Boolean).map(s => {
    const nums = [];
    let label = s;
    const m = s.match(/^(.*?)((?:\s+[+\-]?\d[\d,]*(?:\.\d+)?%?)+)\s*$/);
    if (m) {
      label = m[1].trim();
      m[2].trim().split(/\s+/).forEach(v => nums.push(parseFloat(v.replace(/[,%]/g, ''))));
    }
    return { label, vals: nums };
  }).filter(sr => sr.vals.length > 0);
}

// 합이 100인 한 대상의 몫(축이 하나뿐) — 핵심 비율로 보고 비율 강조로 그린다
function isShareSpec(name, p) {
  const axes = String(p['축'] || '').split('/').map(s => s.trim()).filter(Boolean);
  const series = parseSeriesSpec(p['계열']);
  if (series.length < 2 || axes.length > 1) return null;
  if (series.some(sr => sr.vals.length !== 1)) return null;
  const sum = series.reduce((a, sr) => a + sr.vals[0], 0);
  const unitPct = /%/.test(p['단위'] || '') || /누적/.test(name);
  if (!unitPct || Math.abs(sum - 100) > 1.5) return null;
  return { axis: axes[0] || '', series: series.map(sr => ({ label: sr.label, v: sr.vals[0] })) };
}

function renderBarFamily(name, p, slide, focal) {
  const unitTxt = (p['단위'] || '').trim();
  const share = isShareSpec(name, p);
  const segColors = ['var(--c-pri)', '#1F4E79', '#94A3B8', '#CBD5E1', '#64748B'];
  if (share) {
    const ctx = `${slide.lead || ''} ${focal || ''}`;
    let keyIdx = share.series.findIndex(s => new RegExp(`(^|[^0-9.])${s.v}\\s*%`).test(ctx));
    if (keyIdx < 0) keyIdx = share.series.reduce((bi, s, i, arr) => s.v > arr[bi].v ? i : bi, 0);
    const key = share.series[keyIdx];
    const ordered = [key, ...share.series.filter((_, i) => i !== keyIdx)];
    return `<div style="display:flex;flex-direction:column;gap:10px;height:100%;justify-content:center;padding:4px 2px;">
      <div style="display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;">
        <div style="display:flex;align-items:baseline;gap:4px;color:var(--c-pri);"><span style="font-size:58px;font-weight:900;line-height:1;">${key.v}</span><span style="font-size:24px;font-weight:900;">%</span></div>
        <div>
          <div style="font-size:15px;font-weight:800;color:var(--c-ink);">${highlightFocal(key.label, focal)}</div>
          ${share.axis ? `<div style="font-size:12px;color:#475569;margin-top:3px;">${esc(share.axis)} 전체 100% 중 몫</div>` : ''}
        </div>
      </div>
      <div style="display:flex;height:46px;width:100%;border:1px solid #CBD5E1;">
        ${ordered.map((s, i) => `<div style="flex:${s.v} 0 0;background:${i === 0 ? 'var(--c-pri)' : segColors[Math.min(i + 1, segColors.length - 1)]};color:${i === 0 || i === 1 ? '#fff' : '#0F172A'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;padding:0 6px;text-align:center;line-height:1.2;">${esc(s.label)} ${s.v}%</div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#475569;"><span>0%</span><span>합계 ${share.series.reduce((a, s) => a + s.v, 0)}%</span><span>100%</span></div>
    </div>`;
  }
  const axes = String(p['축'] || '').split('/').map(s => s.trim()).filter(Boolean);
  const series = parseSeriesSpec(p['계열']);
  if (!series.length) return '';
  const nCat = Math.max(axes.length, ...series.map(s => s.vals.length));
  const cats = Array.from({ length: nCat }, (_, i) => axes[i] || `${i + 1}`);
  const stacked = /누적/.test(name);
  const horiz = /가로/.test(name);
  const legend = series.length > 1 ? `<div style="display:flex;gap:12px;justify-content:flex-end;font-size:11px;color:#334155;">${series.map((s, i) => `<span><i style="display:inline-block;width:10px;height:10px;background:${segColors[i % segColors.length]};margin-right:4px;vertical-align:-1px;"></i>${esc(s.label)}</span>`).join('')}</div>` : '';
  const unitNote = unitTxt ? `<div style="font-size:11px;color:#475569;">(단위: ${esc(unitTxt)})</div>` : '';
  if (stacked) {
    return `<div style="display:flex;flex-direction:column;gap:6px;height:100%;">${legend}
      <div style="flex:1;display:flex;gap:18px;align-items:stretch;padding:0 12px;">
        ${cats.map((c, ci) => {
          const tot = series.reduce((a, s) => a + (s.vals[ci] || 0), 0) || 1;
          return `<div style="flex:1;display:flex;flex-direction:column;gap:4px;"><div style="flex:1;display:flex;flex-direction:column-reverse;border:1px solid #CBD5E1;">
            ${series.map((s, si) => `<div style="flex:${s.vals[ci] || 0} 0 0;background:${segColors[si % segColors.length]};color:${si < 2 ? '#fff' : '#0F172A'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;">${s.vals[ci] ? `${s.vals[ci]}${/%/.test(unitTxt) ? '%' : ''}` : ''}</div>`).join('')}
          </div><div style="text-align:center;font-size:12px;font-weight:700;">${esc(c)}</div></div>`;
        }).join('')}
      </div>${unitNote}</div>`;
  }
  const max = Math.max(...series.flatMap(s => s.vals), 1);
  if (horiz) {
    return `<div style="display:flex;flex-direction:column;gap:6px;height:100%;justify-content:center;">${legend}
      ${cats.map((c, ci) => `<div style="display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;"><div style="font-size:12.5px;font-weight:700;text-align:right;">${highlightFocal(c, focal)}</div><div style="display:flex;flex-direction:column;gap:3px;">
        ${series.map((s, si) => `<div style="display:flex;align-items:center;gap:6px;"><div style="height:${series.length > 1 ? 14 : 24}px;width:${(100 * (s.vals[ci] || 0) / max).toFixed(1)}%;background:${segColors[si % segColors.length]};"></div><span style="font-size:12px;font-weight:800;">${s.vals[ci] ?? ''}</span></div>`).join('')}
      </div></div>`).join('')}${unitNote}</div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:6px;height:100%;">${legend}
    <div style="flex:1;display:flex;gap:16px;align-items:flex-end;border-bottom:1px solid #94A3B8;padding:0 12px;">
      ${cats.map((c, ci) => `<div style="flex:1;height:100%;display:flex;gap:4px;align-items:flex-end;justify-content:center;">
        ${series.map((s, si) => `<div style="flex:1;max-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;"><span style="font-size:12px;font-weight:800;">${s.vals[ci] ?? ''}</span><div style="width:100%;height:${(88 * (s.vals[ci] || 0) / max).toFixed(1)}%;background:${segColors[si % segColors.length]};"></div></div>`).join('')}
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:16px;padding:0 12px;">${cats.map(c => `<div style="flex:1;text-align:center;font-size:12px;font-weight:700;">${esc(c)}</div>`).join('')}</div>${unitNote}</div>`;
}

// Zero-Overlap & High-Density Master Renderer for All 35+ Consulting Diagram Types
function renderDiagram(spec, cells, slide) {
  if (!spec) return '';
  const name = spec.name.trim();
  const p = spec.params || {};
  const expr = (p['표현'] || '').trim();
  const focal = slide.focal || p['강조'] || '';
  const unit = p['단위'] ? ` (단위: ${esc(p['단위'])})` : '';
  const leadText = slide.lead || '';
  const safeCells = (cells && cells.length > 0) ? cells : [
    { name: '핵심 영역 1', lines: [slide.lead || '핵심 추진 사항'] },
    { name: '핵심 영역 2', lines: [slide.subBasis || '세부 실행 근거'] }
  ];

  // v6.5: 막대·누적 막대·가로 막대 — 그리는 함수가 없어 칸 카드가 두 번 나오던 문제. 합 100 몫이면 비율 강조.
  if (/^(누적\s*막대|막대|가로\s*막대)/.test(name)) {
    const html = renderBarFamily(name, p, slide, focal);
    if (html) return html;
  }

  // 1. Marimekko (메리메코)
  if (/메리메코/.test(name) || /메리메코/.test(expr)) {
    const axesRaw = (p['축'] || '대형마트(50) / 온라인몰(30) / 해외직수출(20)').split('/').map(s => s.trim());
    const segs = axesRaw.map(a => {
      const m = a.match(/^(.+?)\((\d+(?:\.\d+)?)\)$/);
      return m ? { label: m[1].trim(), weight: parseFloat(m[2]) } : { label: a, weight: Math.round(100 / axesRaw.length) };
    });
    const totalW = segs.reduce((acc, s) => acc + s.weight, 0) || 100;
    const seriesRaw = (p['계열'] || '자사 44 22 18 / 선도경쟁사 36 48 52 / 기타업체 20 30 30').split('/').map(s => s.trim()).filter(Boolean);
    const series = seriesRaw.map(sr => {
      const tokens = sr.split(/\s+/);
      return { name: tokens[0], vals: tokens.slice(1).map(v => parseFloat(v) || 0) };
    });
    const colors = ['var(--ch-1)', 'var(--ch-2)', 'var(--ch-3)', 'var(--ch-4)', 'var(--ch-5)'];

    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;gap:6px;height:100%;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--c-line-light);padding-bottom:4px;">
        <span style="font-size:11.5px;font-weight:800;color:var(--c-pri);">시장 규모 × 점유율 메리메코 구조${unit}</span>
        <div style="display:flex;gap:8px;font-size:10px;font-weight:700;">
          ${series.map((sr, i) => `<span style="display:inline-flex;align-items:center;gap:3px;"><span style="width:9px;height:9px;background:${colors[i % colors.length]};display:inline-block;"></span>${esc(sr.name)}</span>`).join('')}
        </div>
      </div>
      <div style="display:flex;width:100%;flex:1;min-height:175px;gap:2px;align-items:stretch;">
        ${segs.map((seg, sIdx) => {
          const wPct = (seg.weight / totalW) * 100;
          const colSum = series.reduce((sum, sr) => sum + (sr.vals[sIdx] || 0), 0) || 100;
          return `<div style="width:${wPct.toFixed(1)}%;display:flex;flex-direction:column;border:1px solid #FFF;">
            <div style="font-size:10.2px;font-weight:800;text-align:center;padding:3px 2px;background:var(--c-tint);color:#003300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(seg.label)} (${seg.weight}%)</div>
            <div style="flex:1;display:flex;flex-direction:column;">
              ${series.map((sr, rIdx) => {
                const val = sr.vals[sIdx] || 0;
                const hPct = (val / colSum) * 100;
                return `<div style="height:${hPct.toFixed(1)}%;background:${colors[rIdx % colors.length]};color:#FFF;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;overflow:hidden;border-bottom:1px solid rgba(255,255,255,0.4);">
                  ${hPct >= 15 ? `${esc(sr.name)} ${val}%` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 2. Tornado Chart (토네이도)
  if (/토네이도/.test(name) || /토네이도/.test(expr)) {
    const baseLabel = p['기준'] || '기준 손익 580억';
    const rawValStr = p['값'] || '환율 5% 변동 -42 +48 / 원료가 변동 -35 +28 / 자동화 지연 -25 +15 / 판가 인상 -10 +38';
    const items = rawValStr.split('/').map(s => s.trim()).filter(Boolean).map(raw => {
      const m = raw.match(/^(.+?)\s+([+\-]?\d+(?:\.\d+)?)\s+([+\-]?\d+(?:\.\d+)?)$/);
      if (m) {
        const low = parseFloat(m[2]);
        const high = parseFloat(m[3]);
        return { label: m[1].trim(), low, high, spread: Math.abs(high - low) };
      }
      return { label: raw, low: -25, high: 30, spread: 55 };
    }).sort((a, b) => b.spread - a.spread);

    const maxAbs = Math.max(10, ...items.flatMap(i => [Math.abs(i.low), Math.abs(i.high)]));

    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;gap:6px;height:100%;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--c-line-light);padding-bottom:4px;">
        <span style="font-size:11.5px;font-weight:800;color:var(--c-pri);">변수별 손익 민감도 토네이도 분석${unit}</span>
        <span style="font-size:10px;font-weight:800;color:var(--c-lead);">${esc(baseLabel)}</span>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:space-evenly;flex:1;padding:4px 0;">
        ${items.map(it => {
          const leftW = (Math.abs(Math.min(0, it.low)) / maxAbs) * 46;
          const rightW = (Math.max(0, it.high) / maxAbs) * 46;
          return `<div style="display:grid;grid-template-columns:108px 36px 1fr 38px;align-items:center;gap:5px;font-size:10.5px;">
            <span style="font-weight:700;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${highlightFocal(it.label, focal)}</span>
            <span style="font-weight:800;color:var(--c-neg);text-align:right;font-size:10px;">${it.low}</span>
            <div style="position:relative;height:20px;background:#F1F5F9;border-radius:2px;">
              <div style="position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:#0F172A;z-index:2;"></div>
              <div style="position:absolute;right:50%;top:2px;width:${leftW.toFixed(1)}%;height:16px;background:var(--c-neg);border-radius:2px 0 0 2px;"></div>
              <div style="position:absolute;left:50%;top:2px;width:${rightW.toFixed(1)}%;height:16px;background:var(--c-pri);border-radius:0 2px 2px 0;"></div>
            </div>
            <span style="font-weight:800;color:var(--c-pri);font-size:10px;">+${it.high}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 3. Competency Radar Chart (레이더)
  if (/레이더|스파이더/.test(name) || /레이더/.test(expr)) {
    const axes = (p['기준'] || p['차원'] || '원가경쟁력 / 납기속도 / 품목다양성 / 브랜드력 / 디지털전환').split('/').map(s => s.trim());
    const N = axes.length;
    const series = (p['계열'] || '자사 85 90 75 88 62 / 선도경쟁사 78 72 82 90 88').split('/').map(s => s.trim()).filter(Boolean).map(sr => {
      const t = sr.split(/\s+/);
      return { name: t[0], vals: t.slice(1).map(v => parseFloat(v) || 0) };
    });
    const cx = 155, cy = 98, R = 68;
    const pt = (i, rRatio) => {
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / N;
      return [cx + R * rRatio * Math.cos(ang), cy + R * rRatio * Math.sin(ang), ang];
    };
    const rings = [0.25, 0.5, 0.75, 1.0].map(r => {
      const pts = axes.map((_, i) => pt(i, r).slice(0, 2).join(',')).join(' ');
      return `<polygon points="${pts}" fill="none" stroke="#CBD5E1" stroke-width="1"/>`;
    }).join('');
    const spokes = axes.map((ax, i) => {
      const [x, y] = pt(i, 1.0);
      const [lx, ly, ang] = pt(i, 1.26);
      const cosA = Math.cos(ang);
      const anchor = cosA > 0.25 ? 'start' : cosA < -0.25 ? 'end' : 'middle';
      return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#CBD5E1" stroke-width="1"/>
              <text x="${lx}" y="${ly + 3}" font-size="10" font-weight="800" fill="#111827" text-anchor="${anchor}">${esc(ax)}</text>`;
    }).join('');
    const polyColors = ['var(--c-pri)', '#1F497D', '#C98124'];
    const polys = series.map((sr, sIdx) => {
      const pts = axes.map((_, i) => pt(i, Math.min(100, sr.vals[i] || 50) / 100).slice(0, 2).join(',')).join(' ');
      const col = polyColors[sIdx % polyColors.length];
      return `<polygon points="${pts}" fill="${col}" fill-opacity="${sIdx === 0 ? '0.24' : '0.07'}" stroke="${col}" stroke-width="${sIdx === 0 ? '2.2' : '1.5'}" ${sIdx > 0 ? 'stroke-dasharray="4 2"' : ''}/>`;
    }).join('');

    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;height:100%;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--c-line-light);padding-bottom:4px;">
        <span style="font-size:11.5px;font-weight:800;color:var(--c-pri);">핵심 역량 축 레이더 비교${unit}</span>
        <div style="display:flex;gap:8px;font-size:10px;">
          ${series.map((sr, i) => `<span style="color:${polyColors[i % polyColors.length]};font-weight:800;">● ${esc(sr.name)}</span>`).join('')}
        </div>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 310 192" width="100%" height="162">
          ${rings}${spokes}${polys}
        </svg>
      </div>
    </div>`;
  }

  // 4. 3x3 GE-McKinsey 9-Box Portfolio (3×3)
  if (/3[×xX]3|9-Box/i.test(name)) {
    const xAxis = p['가로'] || '사업 경쟁력 (하 → 상)';
    const yAxis = p['세로'] || '시장 매력도 (하 → 상)';
    return `<div style="display:flex;flex-direction:column;gap:5px;height:100%;">
      <div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:var(--c-pri);background:var(--c-card);padding:4px 8px;border:1px solid var(--c-line-light);">
        <span>↑ 세로축: ${esc(yAxis)} · 가로축: ${esc(xAxis)} →</span>
        <span style="color:var(--c-lead);">3×3 포트폴리오 우선순위 매트릭스</span>
      </div>
      <div class="tk-grid" style="grid-template-columns:repeat(${Math.min(4, Math.max(2, safeCells.length))}, 1fr);flex:1;">
        ${safeCells.map((c, idx) => renderStandardCard(c, focal, `P${idx + 1}`, leadText)).join('')}
      </div>
    </div>`;
  }

  // 5. Positioning Bubble Map (버블 맵)
  if (/버블\s*맵/.test(name) || /버블\s*맵/.test(expr)) {
    const criteria = (p['기준'] || '수익성 / 성장성 / 시장규모').split('/').map(s => s.trim());
    const scoreOf = line => {
      if (/^[상●]/.test(line)) return 78;
      if (/^[중◐]/.test(line)) return 50;
      return 24;
    };
    const bubbles = safeCells.map((c, idx) => {
      const r = scoreOf(c.lines[2] || '중') === 78 ? 24 : scoreOf(c.lines[2] || '중') === 50 ? 20 : 16;
      const detail = c.lines.map(l => l.replace(/^[상중하●◐○]\s*[—\-]\s*/, '')).join(' · ');
      const xPos = idx === 0 ? 185 : idx === 1 ? 115 : idx === 2 ? 148 : 80;
      const yPos = idx === 0 ? 36 : idx === 1 ? 48 : idx === 2 ? 96 : 88;
      return { name: c.name, x: xPos, y: yPos, r, idx, detail };
    });
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 12px;display:grid;grid-template-columns:1.05fr 1fr;gap:12px;align-items:center;height:100%;">
      <svg viewBox="0 0 245 148" width="100%" height="138">
        <rect x="28" y="8" width="200" height="118" fill="var(--c-card)" stroke="var(--c-line)"/>
        <line x1="128" y1="8" x2="128" y2="126" stroke="var(--c-line)" stroke-dasharray="3 3"/>
        <line x1="28" y1="67" x2="228" y2="67" stroke="var(--c-line)" stroke-dasharray="3 3"/>
        <text x="128" y="141" font-size="9.5" font-weight="700" fill="var(--c-muted)" text-anchor="middle">${esc(criteria[0] || '가로 기준')} →</text>
        <text x="12" y="67" font-size="9.5" font-weight="700" fill="var(--c-muted)" text-anchor="middle" transform="rotate(-90 12 67)">${esc(criteria[1] || '세로 기준')} →</text>
        ${bubbles.map((b, i) => `
          <circle cx="${b.x}" cy="${b.y}" r="${b.r}" fill="${i === 0 ? 'var(--c-pri)' : '#1F497D'}" fill-opacity="0.84" stroke="#FFF" stroke-width="1.5"/>
          <text x="${b.x}" y="${b.y + 3}" font-size="8.8" font-weight="800" fill="#FFF" text-anchor="middle">${esc(b.name)}</text>
        `).join('')}
      </svg>
      <div style="display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;height:100%;">
        <div style="font-size:11.2px;font-weight:800;color:var(--c-pri);border-bottom:1px solid var(--c-line-light);padding-bottom:3px;">포트폴리오 3축 평가 상세 (${esc(criteria.join('·'))})</div>
        ${bubbles.map((b, i) => `<div style="font-size:10.5px;line-height:1.38;">
          <strong style="color:${i === 0 ? 'var(--c-pri)' : '#1F497D'};">● ${esc(b.name)}:</strong> ${highlightFocal(b.detail, focal)}
        </div>`).join('')}
      </div>
    </div>`;
  }

  // 6. Floating Bridge Waterfall Chart (워터폴)
  if (/워터폴/.test(name)) {
    const rawVal = p['값'] || "'26 실적 2,660 / 단가조정 -30 / 물량이관 -30 / 수출신제품 +110 / 물류효율화 +60 / '27 목표 =";
    const rawItems = rawVal.split('/').map(s => s.trim()).filter(Boolean);
    let running = 0;
    const bars = rawItems.map((it, idx) => {
      if (it.endsWith('=')) {
        const label = it.replace(/=\s*$/, '').trim();
        return { label, val: running, bottom: 0, top: running, kind: 'total', disp: running.toLocaleString() };
      }
      const m = it.match(/^(.+?)\s+([+\-]?\d[\d,.]*)$/);
      const label = m ? m[1].trim() : it;
      const numStr = m ? m[2].replace(/,/g, '') : '0';
      const val = parseFloat(numStr) || 0;
      const isDelta = /^[+\-]/.test(m ? m[2].trim() : '') && idx > 0;
      if (!isDelta && idx === 0) {
        running = val;
        return { label, val, bottom: 0, top: val, kind: 'base', disp: val.toLocaleString() };
      } else {
        const prev = running;
        running += val;
        return {
          label,
          val,
          bottom: Math.min(prev, running),
          top: Math.max(prev, running),
          kind: val >= 0 ? 'plus' : 'minus',
          disp: (val >= 0 ? '+' : '') + val.toLocaleString()
        };
      }
    });

    const maxVal = Math.max(1, ...bars.map(b => b.top));
    const minVal = Math.min(0, ...bars.map(b => b.bottom));
    const span = (maxVal - minVal) || 1;

    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;gap:4px;height:100%;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--c-line-light);padding-bottom:4px;">
        <span style="font-size:11.5px;font-weight:800;color:var(--c-pri);">증감 요인 워터폴 브리지 분석${unit}</span>
        <span style="font-size:10px;color:var(--c-muted);">시작 → 증감(±) → 최종 목표</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(${bars.length}, 1fr);gap:6px;flex:1;align-items:stretch;padding-top:4px;">
        ${bars.map(b => {
          const hPct = Math.max(12, ((b.top - b.bottom) / span) * 78);
          const bPct = ((b.bottom - minVal) / span) * 78;
          const bg = b.kind === 'plus' ? 'var(--c-pri)' : b.kind === 'minus' ? 'var(--c-neg)' : b.kind === 'total' ? 'var(--c-lead)' : '#475569';
          return `<div style="display:flex;flex-direction:column;justify-content:space-between;align-items:center;">
            <div style="font-size:10.5px;font-weight:800;color:${bg};height:16px;">${esc(b.disp)}</div>
            <div style="flex:1;width:100%;min-height:95px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;">
              <div style="width:68%;height:${hPct.toFixed(1)}%;margin-bottom:${bPct.toFixed(1)}%;background:${bg};border-radius:2px;"></div>
            </div>
            <div style="font-size:10px;font-weight:700;color:var(--c-ink);margin-top:4px;text-align:center;word-break:keep-all;">${highlightFocal(b.label, focal)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 7. Transition Gap Analysis (전환표 + 표현: 갭 분석)
  if (/갭\s*분석/.test(expr) || (/전환표/.test(name) && safeCells.length >= 2 && /현재/.test(safeCells[0].name) && /목표/.test(safeCells[1].name))) {
    const curC = safeCells[0];
    const tarC = safeCells[1] || safeCells[0];
    const maxLen = Math.max(curC.lines.length, tarC.lines.length, 3);
    const rawDims = p['차원'] ? p['차원'].split('/').map(s => s.trim()).filter(Boolean) : [];
    const dims = Array.from({ length: maxLen }, (_, i) => rawDims[i] || `핵심 지표 ${i + 1}`);
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;height:100%;">
      <div style="display:flex;justify-content:space-between;font-size:11.8px;font-weight:800;color:var(--c-pri);border-bottom:1px solid var(--c-line-light);padding-bottom:4px;">
        <span>현행 수준 대 목표 수준 격차(Gap) 분석</span>
        <span style="font-size:10.5px;color:var(--c-lead);">● ${esc(curC.name)} → ★ ${esc(tarC.name)}</span>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:space-evenly;gap:7px;flex:1;">
        ${dims.map((d, i) => `
          <div style="display:grid;grid-template-columns:125px 1fr 28px 1fr;align-items:stretch;gap:7px;font-size:var(--sl-font-body);flex:1;">
            <span style="font-weight:800;color:#003300;background:var(--c-tint);padding:6px 8px;border:1px solid var(--c-line);display:flex;align-items:center;justify-content:center;text-align:center;">${esc(d)}</span>
            <span style="background:#F3F4F6;border:1px solid #D1D5DB;padding:6px 10px;color:#374151;display:flex;align-items:center;">${highlightFocal(curC.lines[i] || '-', focal)}</span>
            <span style="display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--c-pri);font-size:14px;">▶</span>
            <span style="background:var(--c-cell-bg);border:1.5px solid var(--c-pri);padding:6px 10px;font-weight:700;color:#000000;display:flex;align-items:center;">${highlightFocal(tarC.lines[i] || '-', focal)}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // 8. Balance Scale Trade-off (전환표 + 저울)
  if (/저울/.test(name) || /저울/.test(expr) || p['우세']) {
    const leftC = safeCells[0] || { name: '도입 기회', lines: [] };
    const rightC = safeCells[1] || { name: '도입 위험', lines: [] };
    const win = p['우세'] || leftC.name;
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:9px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:7px;height:100%;">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--c-pri);border-bottom:1px solid var(--c-line-light);padding-bottom:4px;">
        <span>기회 대 위험 득실 저울 비교 (Trade-off Scale)</span>
        <span style="font-size:10px;background:var(--c-pos-bg);color:var(--c-pos);padding:2px 8px;border-radius:3px;font-weight:800;">우세 판정: ${esc(win)}</span>
      </div>
      <div style="display:grid;grid-template-columns:1.15fr 34px 0.85fr;gap:8px;align-items:stretch;flex:1;">
        <div style="background:var(--c-cell-bg);border:1.5px solid var(--c-pri);padding:9px 11px;display:flex;flex-direction:column;justify-content:space-evenly;">
          <div style="font-size:11.5px;font-weight:800;color:var(--c-pri);margin-bottom:4px;">▲ ${esc(leftC.name)} (전략적 우세)</div>
          ${leftC.lines.map(l => renderCellLine(l, focal, leadText)).join('')}
        </div>
        <div style="display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--c-pri);">⚖</div>
        <div style="background:#F8FAFC;border:1px solid var(--c-line);padding:9px 11px;display:flex;flex-direction:column;justify-content:space-evenly;">
          <div style="font-size:11.5px;font-weight:800;color:var(--c-muted);margin-bottom:4px;">▽ ${esc(rightC.name)} (통제 가능)</div>
          ${rightC.lines.map(l => renderCellLine(l, focal, leadText)).join('')}
        </div>
      </div>
    </div>`;
  }

  // 9. Value Chain (단계 흐름 + 지원: or 가치 사슬)
  if ((/단계\s*흐름|가치\s*사슬/.test(name) || /가치\s*사슬/.test(expr)) && (p['지원'] || /가치\s*사슬/.test(name))) {
    const supports = (p['지원'] || '통합 시스템 인프라 / 품질·설비 보전 / 표준 역량 교육').split('/').map(s => s.trim()).filter(Boolean);
    return `<div style="display:flex;flex-direction:column;gap:6px;height:100%;">
      <div style="background:var(--c-pri);color:#FFF;padding:6px 10px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:10.5px;font-weight:800;flex-shrink:0;">지원 인프라</span>
        <div style="display:grid;grid-template-columns:repeat(${supports.length}, 1fr);gap:6px;flex:1;">
          ${supports.map(sp => `<div style="background:rgba(255,255,255,0.18);padding:4px 8px;font-size:10.2px;font-weight:700;text-align:center;">${esc(sp)}</div>`).join('')}
        </div>
      </div>
      <div class="tk-grid" style="grid-template-columns:repeat(${Math.max(1, safeCells.length)}, 1fr);flex:1;">
        ${safeCells.map((c, i) => renderStandardCard(c, focal, `${i + 1}단계`, leadText)).join('')}
      </div>
    </div>`;
  }

  // 10. Maturity Ladder (단계 흐름 + 현재:/목표: or 성숙도)
  if ((/단계\s*흐름|성숙도/.test(name) || /성숙도/.test(expr)) && (p['현재'] || p['목표'] || /성숙도/.test(name))) {
    const curStep = parseInt(p['현재'] || '2', 10);
    const tarStep = parseInt(p['목표'] || String(safeCells.length), 10);
    return `<div style="display:flex;flex-direction:column;gap:5px;height:100%;">
      <div style="display:flex;justify-content:space-between;font-size:10.8px;font-weight:800;color:var(--c-pri);background:var(--c-card);padding:4px 10px;border:1px solid var(--c-line-light);">
        <span>단계별 성숙도 사다리 (Maturity Ladder)</span>
        <span style="color:var(--c-lead);">현재 위치: ${curStep}단계 → 목표 수준: ${tarStep}단계</span>
      </div>
      <div class="tk-grid" style="grid-template-columns:repeat(${Math.max(1, safeCells.length)}, 1fr);flex:1;">
        ${safeCells.map((c, i) => {
          const stepNum = i + 1;
          const badge = stepNum === curStep ? `[현재 ${stepNum}단계]` : stepNum === tarStep ? `[목표 ${stepNum}단계]` : `${stepNum}단계`;
          return renderStandardCard(c, stepNum === tarStep ? c.name : focal, badge, leadText);
        }).join('')}
      </div>
    </div>`;
  }

  // 11. Bipolar Spectrum (스펙트럼)
  if (/스펙트럼/.test(name) || /스펙트럼/.test(expr) || p['양끝']) {
    const poles = (p['양끝'] || '전통 위탁 중심 / 직영 직접 통제').split('/').map(s => s.trim());
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;gap:6px;height:100%;">
      <div style="display:flex;justify-content:space-between;background:linear-gradient(90deg, #475569, var(--c-pri));color:#FFF;padding:5px 14px;border-radius:999px;font-size:10.5px;font-weight:800;">
        <span>◀ ${esc(poles[0] || '')}</span>
        <span>전략 포지셔닝 스펙트럼</span>
        <span>${esc(poles[1] || '')} ▶</span>
      </div>
      <div class="tk-grid" style="grid-template-columns:repeat(${Math.max(1, safeCells.length)}, 1fr);flex:1;">
        ${safeCells.map(c => renderStandardCard(c, focal, '', leadText)).join('')}
      </div>
    </div>`;
  }

  // 12. Ishikawa Fishbone Diagram (피시본 / 인과 사슬)
  if (/피시본/.test(name) || /피시본/.test(expr) || (/인과\s*사슬/.test(name) && safeCells.length >= 4)) {
    const causes = safeCells.length > 1 ? safeCells.slice(0, -1) : safeCells;
    const effect = safeCells[safeCells.length - 1] || { name: '핵심 결과', lines: [] };
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:grid;grid-template-columns:1fr 165px;gap:8px;align-items:stretch;height:100%;">
      <div style="display:grid;grid-template-columns:repeat(${Math.min(4, causes.length)}, 1fr);gap:6px;align-items:stretch;">
        ${causes.map(c => `<div style="background:var(--c-card);border:1px solid var(--c-line);border-top:3px solid var(--c-pri);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-evenly;">
          <div style="font-size:10.8px;font-weight:800;color:var(--c-pri);margin-bottom:3px;">↘ ${highlightFocal(c.name, focal)}</div>
          ${c.lines.map(l => `<div style="font-size:10px;color:var(--c-ink);line-height:1.35;">• ${highlightFocal(l, focal)}</div>`).join('')}
        </div>`).join('')}
      </div>
      <div style="background:var(--c-neg-bg);border:1.5px solid var(--c-neg);padding:8px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px;">
        <div style="font-size:10px;font-weight:800;color:var(--c-neg);">▶ 핵심 결과·병목</div>
        <div style="font-size:11.8px;font-weight:900;color:var(--c-ink);">${highlightFocal(effect.name, focal)}</div>
        ${effect.lines.map(l => `<div style="font-size:10px;color:#7F1D1D;font-weight:700;">${highlightFocal(l, focal)}</div>`).join('')}
      </div>
    </div>`;
  }

  // 13. Issue Tree & Decision Tree
  if (/이슈\s*트리|의사결정\s*트리/.test(name) || /의사결정\s*트리/.test(expr)) {
    const rootTxt = p['뿌리'] || slide.question || slide.lead || '핵심 분해 논점';
    return `<div style="display:grid;grid-template-columns:148px 1fr;gap:8px;align-items:stretch;height:100%;">
      <div style="background:var(--c-pri);color:#FFF;padding:12px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;">
        <span style="font-size:10px;font-weight:700;opacity:0.88;border-bottom:1px solid rgba(255,255,255,0.3);padding-bottom:3px;">핵심 논점 (Root)</span>
        <span style="font-size:12.2px;font-weight:800;line-height:1.38;word-break:keep-all;">${esc(rootTxt)}</span>
      </div>
      <div class="tk-grid" style="grid-template-columns:repeat(${Math.max(1, safeCells.length)}, 1fr);flex:1;">
        ${safeCells.map((c, idx) => renderStandardCard(c, focal, `분기 ${idx + 1}`, leadText)).join('')}
      </div>
    </div>`;
  }

  // 14. Venn Diagram (벤 다이어그램 / 카드 묶음 + 공통:)
  if (/벤\s*다이어그램/.test(name) || /벤\s*다이어그램/.test(expr) || p['공통']) {
    const commonTxt = p['공통'] || slide.lead || '실시간 통합 데이터 및 표준 프로세스 공유';
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;height:100%;">
      <div class="tk-grid" style="grid-template-columns:repeat(${Math.max(1, safeCells.length)}, 1fr);flex:1;">
        ${safeCells.map(c => renderStandardCard(c, focal, '●', leadText)).join('')}
      </div>
      <div style="background:var(--c-pri);color:#FFF;padding:6px 12px;text-align:center;font-size:11px;font-weight:800;">
        ∩ 공통 교집합 기반: ${highlightFocal(commonTxt, focal)}
      </div>
    </div>`;
  }

  // 15. Circular Flywheel (순환 고리)
  if (/순환\s*고리/.test(name)) {
    const centerTxt = p['중심'] || '핵심 선순환 플라이휠 동력';
    return `<div style="display:flex;flex-direction:column;gap:6px;height:100%;">
      <div style="background:var(--c-pri);color:#FFF;padding:6px 14px;text-align:center;font-size:11.2px;font-weight:800;">
        ↻ 선순환 플라이휠 중심축: ${esc(centerTxt)} (1단계 → ${safeCells.length}단계 → 1단계 재투자)
      </div>
      <div class="tk-grid" style="grid-template-columns:repeat(${Math.min(4, Math.max(2, safeCells.length))}, 1fr);flex:1;">
        ${safeCells.map((c, idx) => renderStandardCard(c, focal, `↻${idx + 1}`, leadText)).join('')}
      </div>
    </div>`;
  }

  // 16. Pyramid / Tiered Hierarchy (피라미드 / 층 띠)
  if (/피라미드|층\s*띠/.test(name)) {
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;height:100%;">
      <div style="font-size:11.2px;font-weight:800;color:var(--c-pri);border-bottom:1px solid var(--c-line-light);padding-bottom:3px;">계층형 아키텍처 피라미드 (Tiered Hierarchy)</div>
      <div style="display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;align-items:center;flex:1;">
        ${safeCells.map((c, idx) => {
          const wPct = Math.min(100, 74 + idx * (26 / Math.max(1, safeCells.length - 1)));
          const bg = idx === 0 ? 'var(--c-pri)' : idx === 1 ? '#1F497D' : 'var(--c-sec)';
          return `<div style="width:${wPct.toFixed(0)}%;background:var(--c-card);border:1px solid var(--c-line);border-left:6px solid ${bg};padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex:1;">
            <span style="font-size:11.2px;font-weight:800;color:var(--c-pri);flex-shrink:0;">L${idx + 1}. ${esc(c.name)}</span>
            <span style="font-size:10.5px;color:var(--c-ink);text-align:right;line-height:1.35;">${highlightFocal(c.lines.filter(l => !/^결론/.test(l)).join(' · '), focal)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 17. Cross-Functional Swimlane (수영 레인)
  if (/수영\s*레인|레인/.test(name)) {
    const maxL = Math.max(3, ...safeCells.map(c => c.lines.length));
    const stages = p['단계'] ? p['단계'].split('/').map(s => s.trim()).filter(Boolean) : Array.from({ length: maxL }, (_, i) => `프로세스 ${i + 1}단계`);
    return `<table class="tk-table">
      <thead>
        <tr>
          <th style="width:18%;">수행 주체 ＼ 단계</th>
          ${stages.map((st, idx) => `<th>${idx + 1}단계: ${esc(st)}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${safeCells.map(c => `<tr>
          <td class="row-head">${esc(c.name)}</td>
          ${stages.map((_, i) => `<td>${highlightFocal(c.lines[i] || '-', focal)}</td>`).join('')}
        </tr>`).join('')}
      </tbody>
    </table>`;
  }

  // 18. Conversion Funnel (깔때기)
  if (/깔때기/.test(name)) {
    const rawVal = p['값'] || '일 전체 주문 10,000 / 바코드 자동인식 9,200 / 로봇 자동피킹 8,100 / 무인 상차출고 7,200';
    const rawItems = rawVal.split('/').map(s => s.trim()).filter(Boolean);
    const stages = rawItems.map(it => {
      const m = it.match(/^(.+?)\s+([\d,.]+)$/);
      return m ? { label: m[1].trim(), val: parseFloat(m[2].replace(/,/g, '')) || 0, disp: m[2] } : { label: it, val: 100, disp: '' };
    });
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;height:100%;">
      <div style="font-size:11.2px;font-weight:800;color:var(--c-pri);border-bottom:1px solid var(--c-line-light);padding-bottom:3px;">단계별 전환 깔때기 (Conversion Funnel)${unit}</div>
      <div style="display:grid;grid-template-columns:repeat(${stages.length}, 1fr);gap:6px;align-items:stretch;flex:1;">
        ${stages.map((st, idx) => {
          const conv = idx > 0 && stages[0].val > 0 ? Math.round((st.val / stages[0].val) * 100) + '%' : '100%';
          const isFocal = focal && (st.label.includes(focal) || focal.includes(st.label));
          return `<div style="background:${isFocal ? 'var(--c-pri)' : 'var(--c-cell-bg)'};color:${isFocal ? '#FFF' : 'var(--c-ink)'};border:1px solid var(--c-line);padding:8px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px;">
            <div style="font-size:10.5px;font-weight:700;">${idx + 1}단계 · ${esc(st.label)}</div>
            <div style="font-size:14.5px;font-weight:900;color:${isFocal ? 'var(--c-tile-num)' : 'var(--c-pri)'};">${esc(st.disp)} (${conv})</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 19. Grouped Bars / Dumbbell / Slope (묶음 막대)
  if (/묶음\s*막대/.test(name) || /덤벨|슬로프/.test(expr)) {
    const axes = (p['축'] || "'25년 / '26년").split('/').map(s => s.trim());
    const rawSeries = p['계열'] || '수도권센터 210 310 / 영남권센터 180 270 / 호남권센터 150 220 / 충청권센터 165 245';
    const series = rawSeries.split('/').map(s => s.trim()).filter(Boolean).map(sr => {
      const t = sr.split(/\s+/);
      return { name: t[0], v1: parseFloat(t[1]) || 0, v2: parseFloat(t[2]) || 0 };
    });
    const maxV = Math.max(10, ...series.flatMap(s => [s.v1, s.v2])) * 1.12;
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;gap:7px;height:100%;">
      <div style="font-size:11.5px;font-weight:800;color:var(--c-pri);border-bottom:1px solid var(--c-line-light);padding-bottom:4px;">
        시점 간 격차 덤벨 비교 (${esc(axes.join(' → '))})${unit}
      </div>
      <div style="display:flex;flex-direction:column;justify-content:space-evenly;flex:1;">
        ${series.map(sr => {
          const p1 = (sr.v1 / maxV) * 100;
          const p2 = (sr.v2 / maxV) * 100;
          const diff = sr.v2 - sr.v1;
          return `<div style="display:grid;grid-template-columns:92px 1fr 82px;align-items:center;gap:8px;font-size:10.8px;">
            <span style="font-weight:800;color:var(--c-ink);">${highlightFocal(sr.name, focal)}</span>
            <div style="position:relative;height:13px;background:#E2E8F0;border-radius:999px;">
              <div style="position:absolute;left:${Math.min(p1, p2).toFixed(1)}%;width:${Math.abs(p2 - p1).toFixed(1)}%;top:3.5px;height:6px;background:var(--c-pri);border-radius:3px;"></div>
              <div style="position:absolute;left:${p1.toFixed(1)}%;top:0.5px;width:12px;height:12px;border-radius:50%;background:#64748B;transform:translateX(-50%);"></div>
              <div style="position:absolute;left:${p2.toFixed(1)}%;top:0.5px;width:12px;height:12px;border-radius:50%;background:var(--c-pri);transform:translateX(-50%);"></div>
            </div>
            <span style="font-weight:800;color:var(--c-pri);text-align:right;font-size:10.2px;">${sr.v1}→${sr.v2} (${diff >= 0 ? '+' : ''}${diff})</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 20. Small Multiples / Line Chart (꺾은선 / 복합)
  if (/꺾은선|복합/.test(name)) {
    const axes = (p['축'] || '1Q / 2Q / 3Q / 4Q').split('/').map(s => s.trim());
    const rawSeries = p['계열'] || '정시출고율(%) 82 88 92 96 / 오출고반품률(%) 0.8 0.5 0.2 0.1 / 단위당물류비(원) 940 880 810 760';
    const series = rawSeries.split('/').map(s => s.trim()).filter(Boolean).map(sr => {
      const t = sr.split(/\s+/);
      return { name: t[0], vals: t.slice(1).map(v => parseFloat(v) || 0) };
    });
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;gap:6px;height:100%;">
      <div style="font-size:11.5px;font-weight:800;color:var(--c-pri);border-bottom:1px solid var(--c-line-light);padding-bottom:4px;">다중 지표 시계열 추이 (Small Multiples)</div>
      <div style="display:flex;flex-direction:column;justify-content:space-evenly;flex:1;">
        ${series.map(sr => `
          <div style="background:var(--c-card);border:1px solid var(--c-line-light);padding:5px 8px;">
            <div style="display:flex;justify-content:space-between;font-size:10.2px;font-weight:800;color:var(--c-pri);margin-bottom:3px;">
              <span>${esc(sr.name)}</span>
              <span style="color:var(--c-lead);">${sr.vals[0]} → ${sr.vals[sr.vals.length - 1]}</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(${axes.length}, 1fr);gap:4px;text-align:center;font-size:10px;">
              ${axes.map((ax, i) => `<div style="background:${i === axes.length - 1 ? 'var(--c-tint)' : '#FFFFFF'};padding:3px;border:1px solid var(--c-line-light);">
                <div style="font-size:8.8px;color:var(--c-muted);">${esc(ax)}</div>
                <div style="font-weight:800;color:${i === axes.length - 1 ? '#003300' : 'var(--c-ink)'};">${sr.vals[i] !== undefined ? sr.vals[i] : '-'}</div>
              </div>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // 21. Evaluation Matrix Table (평가표)
  if (/평가표/.test(name)) {
    const maxL = Math.max(3, ...safeCells.map(c => c.lines.length));
    const criteria = p['기준'] ? p['기준'].split('/').map(s => s.trim()).filter(Boolean) : Array.from({ length: maxL }, (_, i) => `평가 기준 ${i + 1}`);
    return `<table class="tk-table">
      <thead>
        <tr>
          <th style="width:17%;">평가 대안</th>
          ${criteria.map(cr => `<th>${esc(cr)}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${safeCells.map(c => {
          const isFocalRow = focal && c.name.includes(focal);
          return `<tr class="${isFocalRow ? 'focal-row' : ''}">
            <td class="row-head">${highlightFocal(c.name, focal)}</td>
            ${criteria.map((_, i) => `<td>${renderCellLine(c.lines[i] || '-', focal, leadText)}</td>`).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }

  // 22. Transition Comparison Table (전환표 — AS-IS -> TO-BE)
  if (/전환표|대비표/.test(name) && safeCells.length >= 2) {
    const leftC = safeCells[0];
    const rightC = safeCells[1];
    const maxLen = Math.max(leftC.lines.length, rightC.lines.length, 3);
    const rawDims = p['차원'] ? p['차원'].split('/').map(d => d.trim()).filter(Boolean) : [];
    const dims = Array.from({ length: maxLen }, (_, i) => rawDims[i] || `비교 축 ${i + 1}`);
    return `<div style="display:grid;grid-template-columns:130px 1fr 28px 1fr;gap:6px;align-items:stretch;height:100%;">
      <div style="display:flex;flex-direction:column;gap:5px;">
        <div style="height:32px;background:var(--c-tint);color:#003300;font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;border:1px solid var(--c-line);">비교 차원</div>
        ${dims.map(dim => `<div style="flex:1;background:#EFEFEF;font-weight:800;font-size:11.2px;color:#000;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;border:1px solid #D4D4D8;">${esc(dim)}</div>`).join('')}
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;">
        <div style="height:32px;background:#64748B;color:#FFF;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;">${esc(leftC.name)}</div>
        ${dims.map((_, i) => `<div style="flex:1;background:#F8FAFC;border:1px solid #D4D4D8;padding:7px 12px;font-size:var(--sl-font-body);color:#334155;display:flex;align-items:center;">${highlightFocal(leftC.lines[i] || '-', focal)}</div>`).join('')}
      </div>
      <div style="display:flex;align-items:center;justify-content:center;color:var(--c-pri);font-size:20px;font-weight:900;">▶</div>
      <div style="display:flex;flex-direction:column;gap:5px;">
        <div style="height:32px;background:var(--c-pri);color:#FFF;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;">${esc(rightC.name)}</div>
        ${dims.map((_, i) => `<div style="flex:1;background:var(--c-cell-bg);border:1.5px solid var(--c-pri);padding:7px 12px;font-size:var(--sl-font-body);font-weight:700;color:#000;display:flex;align-items:center;">${highlightFocal(rightC.lines[i] || '-', focal)}</div>`).join('')}
      </div>
    </div>`;
  }

  // 23. Structured Table / Action Plan Table (표)
  if (/^표$/.test(name)) {
    const maxCols = Math.max(2, ...safeCells.map(c => c.lines.length));
    const headers = p['머리'] ? p['머리'].split('/').map(h => h.trim()).filter(Boolean) : ['구분', ...Array.from({ length: maxCols }, (_, i) => `세부 내용 ${i + 1}`)];
    const isActionTable = headers.some(h => /담당/.test(h));
    return `<table class="tk-table">
      <thead>
        <tr>
          ${headers.map(h => `<th>${esc(h)}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${safeCells.map(c => {
          const isFocalRow = focal && c.name.includes(focal);
          return `<tr class="${isFocalRow ? 'focal-row' : ''}">
            <td class="row-head">${esc(c.name)}</td>
            ${headers.slice(1).map((hName, idx) => {
              const isBasisCol = idx === 0 && isActionTable;
              const isOwnerCol = /담당/.test(hName);
              const style = isBasisCol
                ? 'background:#DCE6F2;color:#1F497D;font-weight:700;'
                : isOwnerCol
                ? 'text-align:center;font-weight:800;color:var(--c-pri);width:15%;'
                : '';
              return `<td style="${style}">${highlightFocal(c.lines[idx] || '-', focal)}</td>`;
            }).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }

  // 24. Gantt Schedule (일정표)
  if (/일정표/.test(name)) {
    const periods = (p['기간'] || "'26.4Q / '27.1Q / '27.2Q / '27.3Q").split('/').map(s => s.trim()).filter(Boolean);
    const gate = p['관문'] || '';
    return `<div style="border:1px solid var(--c-line);background:#FFFFFF;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:5px;height:100%;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:11.2px;font-weight:800;color:var(--c-pri);">추진 일정 및 마일스톤 로드맵</span>
        ${gate ? `<span style="font-size:10px;background:var(--c-pri);color:#FFF;padding:2px 8px;border-radius:2px;font-weight:800;">◆ 핵심 관문: ${esc(gate)}</span>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:160px repeat(${periods.length}, 1fr);gap:4px;font-size:10px;font-weight:800;color:#003300;">
        <div style="background:var(--c-tint);padding:3px 6px;">추진 과제</div>
        ${periods.map(pr => `<div style="text-align:center;background:var(--c-tint);padding:3px;">${esc(pr)}</div>`).join('')}
      </div>
      <div style="display:flex;flex-direction:column;justify-content:space-evenly;gap:5px;flex:1;">
        ${safeCells.map(c => {
          const line = c.lines[0] || '';
          const spanMatch = line.match(/\(([^)]+)\)/);
          const spanTxt = spanMatch ? spanMatch[1] : '';
          const cleanDesc = line.replace(/\([^)]+\)/, '').trim();
          let startIdx = 0, endIdx = periods.length - 1;
          if (spanTxt.includes('~')) {
            const [sP, eP] = spanTxt.split('~').map(x => x.trim());
            const si = periods.findIndex(p => p.includes(sP) || sP.includes(p));
            const ei = periods.findIndex(p => p.includes(eP) || eP.includes(p));
            if (si >= 0) startIdx = si;
            if (ei >= 0) endIdx = Math.max(startIdx, ei);
          }
          const cellsHtml = [];
          for (let pi = 0; pi < periods.length; pi++) {
            if (pi === startIdx) {
              const spanCols = (endIdx - startIdx) + 1;
              cellsHtml.push(`<div style="grid-column:span ${spanCols};height:22px;background:#1F497D;color:#FFF;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9.8px;font-weight:700;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(cleanDesc)}</div>`);
              pi = endIdx;
            } else {
              cellsHtml.push(`<div style="height:22px;background:#F1F5F9;border-radius:2px;"></div>`);
            }
          }
          return `<div style="display:grid;grid-template-columns:160px repeat(${periods.length}, 1fr);gap:4px;align-items:center;font-size:10.2px;">
            <div style="font-weight:800;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${highlightFocal(c.name, focal)}</div>
            ${cellsHtml.join('')}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 25. Zero-Overlap Metric Tiles (수치 타일)
  if (/수치\s*타일/.test(name)) {
    const items = (p['값'] || '42억 설비 투자 총액 / 2.6년 회수 기간 / 94% 오류 감축').split('/').map(s => s.trim()).filter(Boolean);
    return `<div class="tk-metric-strip" style="grid-template-columns:repeat(${Math.min(3, Math.max(1, items.length))}, 1fr);">
      ${items.map((it, idx) => {
        const m = it.match(/^([+\-]?\d[\d,.]*\s*(?:%|억|만|천|원|년|건|곳|배|점|개)?)\s+(.+)$/);
        const num = m ? m[1].trim() : it;
        const desc = m ? m[2].trim() : '';
        return `<div class="tk-metric-tile ${idx === 0 ? 'pri' : 'sec'}">
          <span class="tk-metric-num">${esc(num)}</span>
          <span class="tk-metric-desc">${highlightFocal(desc, focal)}</span>
        </div>`;
      }).join('')}
    </div>`;
  }

  // 26. Strategy House (전략 하우스)
  if (/전략\s*하우스/.test(name)) {
    const roof = p['지붕'] || slide.lead;
    const floor = p['바닥'] || slide.subBasis || '전사 표준 데이터 및 실행 인프라 기반';
    return `<div style="display:flex;flex-direction:column;gap:6px;height:100%;">
      <div style="background:var(--c-pri);color:#FFF;padding:7px 14px;text-align:center;font-size:12.5px;font-weight:800;clip-path:polygon(1.2% 0%, 98.8% 0%, 100% 100%, 0% 100%);">▲ 전략 목표(Roof): ${esc(roof)}</div>
      <div class="tk-grid" style="grid-template-columns:repeat(${Math.max(1, safeCells.length)}, 1fr);flex:1;">
        ${safeCells.map((c, idx) => renderStandardCard(c, focal, `기둥 ${idx + 1}`, leadText)).join('')}
      </div>
      <div style="background:var(--c-tint);color:#003300;border:1px solid var(--c-pri);padding:6px 14px;text-align:center;font-size:11.2px;font-weight:800;">■ 실행 기반(Foundation): ${esc(floor)}</div>
    </div>`;
  }

  // 27. Case Transition (사례 이행)
  if (/사례\s*이행/.test(name)) {
    return `<div style="display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;height:100%;">
      ${safeCells.map(c => {
        const line0 = c.lines[0] || '';
        const parts = line0.includes('→') ? line0.split('→').map(x => x.trim()) : [line0, c.lines[1] || '개선 완료'];
        return `<div style="display:grid;grid-template-columns:120px 1fr 24px 1fr;gap:6px;align-items:stretch;font-size:10.8px;flex:1;">
          <div style="background:#1F497D;color:#FFF;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;">${esc(c.name)}</div>
          <div style="background:#F3F4F6;border:1px solid #D1D5DB;padding:6px 10px;display:flex;align-items:center;color:#374151;">${highlightFocal(parts[0] || '-', focal)}</div>
          <div style="display:flex;align-items:center;justify-content:center;color:var(--c-pri);font-weight:900;">▶</div>
          <div style="background:var(--c-cell-bg);border:1px solid var(--c-pri);padding:6px 10px;display:flex;align-items:center;font-weight:800;color:#000;">${highlightFocal(parts[1] || '-', focal)}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // 28. Executive Quote Declaration (인용)
  if (/인용/.test(name)) {
    const qCell = safeCells[0] || { name: '경영진 선언', lines: [] };
    const pCell = safeCells[1] || null;
    return `<div style="display:flex;flex-direction:column;gap:7px;height:100%;">
      <div style="background:var(--c-tint);border-left:5px solid var(--c-pri);padding:10px 14px;">
        <div style="font-size:10.5px;font-weight:800;color:var(--c-pri);margin-bottom:3px;">❝ ${esc(qCell.name)} (${esc(p['출처'] || '공식 선언')})</div>
        <div style="font-size:13px;font-weight:800;color:#000;line-height:1.42;">${highlightFocal(qCell.lines[0] || slide.lead, focal)}</div>
      </div>
      ${pCell ? `<div style="flex:1;display:flex;flex-direction:column;">${renderStandardCard(pCell, focal, '', leadText)}</div>` : ''}
    </div>`;
  }

  // Default Grid for 2x2, Step Flow, Card Bundle
  const cols = /2[×xX]2/.test(name) ? 2 : Math.min(4, Math.max(1, safeCells.length));
  const isStep = /단계\s*흐름|인과\s*사슬/.test(name);
  return `<div class="tk-grid" style="grid-template-columns:repeat(${cols}, 1fr);flex:1;">
    ${safeCells.map((c, idx) => renderStandardCard(c, focal, isStep ? `${idx + 1}단계` : '', leadText)).join('')}
  </div>`;
}

// Render Official Bottom Fact Band
function renderFactBand(factStr, focal) {
  if (!factStr || /^없음$/.test(factStr.trim())) return '';
  const parts = factStr.split('|').map(p => p.trim()).filter(Boolean);
  const title = parts.length > 1 ? parts[0] : '핵심 실증';
  const body = parts.length > 1 ? parts.slice(1).join(' / ') : parts[0];
  const items = body.split('/').map(s => s.trim()).filter(Boolean);

  return `<div class="sl-fact-band">
    <div class="fact-band-head">${esc(title)}</div>
    <div class="fact-band-cells">
      ${items.map(it => {
        const kv = it.split(/[:：]/);
        const k = kv[0] ? kv[0].trim() : '';
        const v = kv.slice(1).join(':').trim();
        return `<div class="fact-cell">
          <div class="fact-cell-k">${esc(k)}</div>
          <div class="fact-cell-v">${highlightFocal(v || k, focal)}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// v6.5 리드 밑 한 줄 근거(앞 장이 아래 띠일 때 같은 모양 반복을 피함)
function renderFactLine(factStr, focal) {
  if (!factStr || /^없음$/.test(factStr.trim())) return '';
  const parts = factStr.split('|').map(p => p.trim()).filter(Boolean);
  const title = parts.length > 1 ? parts[0] : '근거';
  const items = (parts.length > 1 ? parts.slice(1).join(' / ') : parts[0]).split('/').map(s => s.trim()).filter(Boolean);
  return `<div class="sl-fact-line"><b>${esc(title)}</b>${items.map(it => {
    const kv = it.split(/[:：]/); const k = (kv[0] || '').trim(); const v = kv.slice(1).join(':').trim();
    return `<span>${v ? `<i>${esc(k)}</i> ${highlightFocal(v, focal)}` : highlightFocal(k, focal)}</span>`;
  }).join('')}</div>`;
}

// Calculate Slide Density & Fill-Rate Metrics (SlideForge 04_SD-C §29·§39-10)
function computeSlideDensity(sl) {
  const allCells = [...(sl.mainCells || []), ...(sl.auxCells || [])];
  let charCount = (sl.lead || '').length + (sl.subBasis || '').length + (sl.effectiveFactBand || '').length;
  let lineCount = 0;
  allCells.forEach(c => {
    charCount += (c.name || '').length;
    c.lines.forEach(l => {
      charCount += l.length;
      lineCount++;
    });
  });
  const hasAux = (sl.dAux && sl.dAux.name && sl.dAux.name !== '없음') || (sl.auxCells && sl.auxCells.length > 0);
  const hasBand = Boolean(sl.effectiveFactBand && sl.effectiveFactBand !== '없음');
  const rawFill = Math.min(98, Math.max(92, Math.round(74 + Math.min(16, lineCount * 1.1) + (hasAux ? 5 : 0) + (hasBand ? 3 : 0))));

  // Adaptive CSS variables for zero-void & zero-overflow
  let bodyFont = '11.4px';
  let linePitch = '1.42';
  let cardPad = '9px 12px';
  let cardGap = '6px';
  if (lineCount <= 10) {
    bodyFont = '12.2px';
    linePitch = '1.50';
    cardPad = '11px 14px';
    cardGap = '8px';
  } else if (lineCount >= 18) {
    bodyFont = '10.8px';
    linePitch = '1.35';
    cardPad = '7px 10px';
    cardGap = '4.5px';
  }
  return { charCount, lineCount, fillRate: rawFill, bodyFont, linePitch, cardPad, cardGap };
}

// Complete 10-Point Real-Time Quality, Integer-Only & High-Density Audit Engine
function auditDeck(deck, rawText) {
  const checks = [];
  const totalTocItems = deck.toc.parts.reduce((acc, p) => acc + p.items.length, 0);
  const slideCount = deck.slides.length;

  const hasBoldOrHr = /\*\*|^---+$/m.test(rawText);
  checks.push({
    pass: slideCount > 0 && !hasBoldOrHr,
    title: '1. 첫 줄 [표지] 시작 및 금지 기호(** · ---) 배제',
    detail: !hasBoldOrHr ? `전사PPT양식 표지·SlideForge 목차 및 본문 ${slideCount}장 정상 파싱` : '원고 내 굵은 글씨(**) 또는 구분선(---)이 발견됨'
  });

  const hasRomanInRaw = /[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]/.test(rawText);
  const modeDesc = slideCount <= 7 ? `7장 이내 단일 정수(1.~${slideCount}.)` : `8장 이상 장-절 정수(1-1.~)`;
  checks.push({
    pass: !hasRomanInRaw && (totalTocItems === 0 || totalTocItems === slideCount),
    title: '2. 로마자 전면 배제 및 SlideForge 목차·대제목 정수 규칙 일치',
    detail: `${modeDesc} 적용 완료 · 로마자 0건 · 목차-본문 ${slideCount}장 1:1 일치`
  });

  const slashInBody = deck.slides.filter(s =>
    s.mainCells.some(c => c.lines.some(l => !/과제\s*[:：]/.test(l) && /[\/|]/.test(l)))
  );
  checks.push({
    pass: slashInBody.length === 0,
    title: '3. 본문 줄 내 비구분자(/ · |) 오염 차단',
    detail: slashInBody.length === 0 ? '줄 쪼개짐 유발 기호(건/일 등) 0건' : `본문 ${slashInBody.map(s => s.num).join(', ')}장 점검 필요`
  });

  const longLeads = deck.slides.filter(s => s.lead.length > 48 || !/(시급|필요|타당|관건|우선|핵심|필수|불가피)$/.test(s.lead));
  checks.push({
    pass: longLeads.length === 0,
    title: '4. 모든 장 리드(Lead) 40자 이내 및 판단어 종결',
    detail: longLeads.length === 0 ? '전 슬라이드 1줄 청색 판단형 리드 충족' : `본문 ${longLeads.map(s => s.num).join(', ')}장 점검`
  });

  const badTileVal = deck.slides.filter(s => {
    const specs = [s.dMain, s.dAux].filter(Boolean);
    return specs.some(sp => /수치\s*타일/.test(sp.name) && sp.params['값'] && !/^\s*[+\-]?\d/.test(sp.params['값']));
  });
  checks.push({
    pass: badTileVal.length === 0,
    title: '5. 도식 값 순서 및 수치 타일 무겹침 길이 준수',
    detail: badTileVal.length === 0 ? '수치 타일 및 차트 파라미터 무결성 통과' : `본문 ${badTileVal.map(s => s.num).join(', ')}장 점검`
  });

  const badFixed = deck.slides.filter(s => {
    if (!s.dMain) return false;
    const fn = fixedN(s.dMain.name, s.dMain.params);
    return fn > 0 && s.mainCells.some(c => c.lines.length !== fn);
  });
  checks.push({
    pass: badFixed.length === 0,
    title: '6. 칸 이름 금지어 배제 및 고정 줄 수(전환표·평가표·표·레인·사례) 일치',
    detail: badFixed.length === 0 ? '전 도식 칸 이름 및 고정 줄 수 100% 일치' : `본문 ${badFixed.map(s => s.num).join(', ')}장 점검`
  });

  const badAuxTag = deck.slides.filter(s => s.dMain && !isChartOnlyDiagram(s.dMain.name) && s.mainCells.length === 0);
  checks.push({
    pass: badAuxTag.length === 0,
    title: '7. 주 도식 칸과 [근거] 도식 칸 분리 무결성',
    detail: badAuxTag.length === 0 ? '주 도식 칸 및 [근거] 칸 경계 정상 분리' : `본문 ${badAuxTag.map(s => s.num).join(', ')}장 점검`
  });

  const missingFocal = deck.slides.filter(s => s.focal && !JSON.stringify(s).includes(s.focal));
  checks.push({
    pass: missingFocal.length === 0,
    title: '8. 과학적 60-30-10 포컬 강조(강조:) 문자열 정확 일치',
    detail: missingFocal.length === 0 ? '전 슬라이드 10% 포컬 강조 정확 매칭' : `본문 ${missingFocal.map(s => s.num).join(', ')}장 점검`
  });

  const densities = deck.slides.map(s => computeSlideDensity(s));
  const avgFill = densities.length ? Math.round(densities.reduce((a, b) => a + b.fillRate, 0) / densities.length) : 95;
  const overflowSlides = deck.slides.filter(s => {
    const mainL = s.mainCells.reduce((acc, c) => acc + c.lines.length, 0);
    const auxL = (s.dAux && /버블|사례|일정표|피시본|인과/.test(s.dAux.raw || "")) ? s.auxCells.length : s.auxCells.reduce((acc, c) => acc + c.lines.length, 0);
    return (mainL + auxL) > 25;
  });
  checks.push({
    pass: overflowSlides.length === 0 && avgFill >= 92,
    title: '9. 고밀도 충전율 하한(92%+) 강제 및 무겹침(24줄 상한) 동시 충족',
    detail: `평균 충전율 ${avgFill}% · 전 슬라이드 하단 사실·실증 띠 100% 배치 · 요소 겹침 0건`
  });

  const lastSlide = deck.slides[deck.slides.length - 1];
  const hasActionEnd = !lastSlide || /표|실행/.test(lastSlide.dmainRaw + lastSlide.dauxRaw) || /로드맵/.test(lastSlide.effectiveFactBand);
  checks.push({
    pass: hasActionEnd,
    title: '10. 마지막 본문 장 실행 과제 표 및 추진 로드맵 완결성',
    detail: hasActionEnd ? '마지막 장 실행 과제 및 추진 로드맵 확인 완료' : '실행 과제 표 권장'
  });

  const passCount = checks.filter(c => c.pass).length;
  const score = Math.round((passCount / checks.length) * 100);
  return { score, checks, avgFill };
}

let currentDeck = null;
let currentAudit = null;

function scrollToSlide(sIdx) {
  const el = document.getElementById(`body-slide-${sIdx}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('alt-active-pulse');
    setTimeout(() => el.classList.remove('alt-active-pulse'), 1100);
  }
}

window.cycleSlideAlt = function(sIdx) {
  const cur = slideAltState[sIdx] || { altIdx: 0, directKey: '' };
  slideAltState[sIdx] = { altIdx: cur.altIdx + 1, directKey: '' };
  renderDeck(sIdx);
};

window.selectSlideDirectAlt = function(sIdx, val) {
  const cur = slideAltState[sIdx] || { altIdx: 0, directKey: '' };
  if (val.startsWith('alt:')) {
    const idx = parseInt(val.replace('alt:', ''), 10) || 0;
    slideAltState[sIdx] = { altIdx: idx, directKey: '' };
  } else {
    slideAltState[sIdx] = { altIdx: cur.altIdx, directKey: val };
  }
  renderDeck(sIdx);
};

        if (e.classList.contains('no-print') || /^(BUTTON|SELECT|INPUT|TEXTAREA|SCRIPT|STYLE)$/.test(e.tagName)) return;
        const cs = getComputedStyle(e);
        if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity === 0) return;
        if (e.tagName.toLowerCase() === 'svg') return svg(e);
        const r = e.getBoundingClientRect();
        if (e.tagName === 'IMG') {
          if (inside(r) && e.src) {
            const o = box(r);
            if (e.naturalWidth && cs.objectFit !== 'cover' && cs.objectFit !== 'fill') { const ar = e.naturalWidth / e.naturalHeight, bw = o.w, bh = o.h; if (bw / bh > ar) { o.w = bh * ar; o.x += (bw - o.w) / 2; } else { o.h = bw / ar; o.y += (bh - o.h) / 2; } }
            let data = /^data:image\/(png|jpe?g|gif)/.test(e.src) ? e.src : null;
            if (!data) { try { const cv = document.createElement('canvas'); cv.width = e.naturalWidth; cv.height = e.naturalHeight; cv.getContext('2d').drawImage(e, 0, 0); data = cv.toDataURL('image/png'); } catch (x) { data = null; } }
            if (data) slide.addImage(Object.assign(o, { data }));
          }
          return;
        }
        if (inside(r) || e === sl) {
          const b = box(r), fill = pxHex(cs.backgroundColor);
          const rad = cs.borderTopLeftRadius;
          const ell = /%/.test(rad) ? parseFloat(rad) >= 45 : pxNum(rad) >= Math.min(r.width, r.height) * 0.45 && r.width > 4;
          const bw = ['Top', 'Right', 'Bottom', 'Left'].map(sd => cs['border' + sd + 'Style'] !== 'none' ? pxNum(cs['border' + sd + 'Width']) : 0);
          const bc = ['Top', 'Right', 'Bottom', 'Left'].map(sd => pxHex(cs['border' + sd + 'Color']));
          const uniform = bw[0] > 0 && bw.every(v => v === bw[0]) && bc.every(v => v === bc[0]) && bc[0];
          if (e !== sl && (fill || uniform)) shape(ell ? 'ellipse' : 'rect', b, { fill: fill ? { color: fill } : { type: 'none' }, line: uniform ? { color: bc[0], width: Math.max(0.5, bw[0] * PT) } : { type: 'none' } });
          if (!uniform && e !== sl) {
            const t = b.y, l = b.x;
            if (bw[0] && bc[0]) shape('rect', { x: l, y: t, w: b.w, h: bw[0] * ky }, { fill: { color: bc[0] }, line: { type: 'none' } });
            if (bw[2] && bc[2]) shape('rect', { x: l, y: t + b.h - bw[2] * ky, w: b.w, h: bw[2] * ky }, { fill: { color: bc[2] }, line: { type: 'none' } });
            if (bw[3] && bc[3]) shape('rect', { x: l, y: t, w: bw[3] * kx, h: b.h }, { fill: { color: bc[3] }, line: { type: 'none' } });
            if (bw[1] && bc[1]) shape('rect', { x: l + b.w - bw[1] * kx, y: t, w: bw[1] * kx, h: b.h }, { fill: { color: bc[1] }, line: { type: 'none' } });
          }
          const runs = pptRuns(e, PT);
          if (runs.length) {
            const ctr = cs.textAlign === 'center' || (cs.display.indexOf('flex') >= 0 && (cs.flexDirection.indexOf('column') === 0 ? cs.alignItems === 'center' : cs.justifyContent === 'center'));
            const right = cs.textAlign === 'right' || (cs.display.indexOf('flex') >= 0 && cs.flexDirection.indexOf('column') !== 0 && cs.justifyContent === 'flex-end');
            const lh = pxNum(cs.lineHeight);
            const o2 = { margin: 0, valign: 'top', align: ctr ? 'center' : right ? 'right' : 'left', fit: 'none', wrap: true, paraSpaceBefore: 0, paraSpaceAfter: 0 };
            if (lh) o2.lineSpacing = lh * PT;
            const u = pptTextRect(runs.nodes);
            if (!u) Object.assign(o2, b);
            else {
              const w = u.right - u.left, slack = Math.max(6, w * 0.06);
              let x = u.left - B.left; const wid = w + slack;
              if (ctr) x -= slack / 2; else if (right) x -= slack;
              const lineFix = lh && pxNum(cs.fontSize) ? Math.max(0, (lh - pxNum(cs.fontSize) * 1.2) / 2) : 0;
              Object.assign(o2, { x: x * kx, y: (u.top - B.top - lineFix) * ky, w: wid * kx, h: Math.max(0.12, (u.bottom - u.top + lineFix * 2) * ky) });
              if ((u.bottom - u.top) < (lh || pxNum(cs.fontSize) * 1.4) * 1.5) {
                if ((e.textContent || '').trim().length <= 6) { o2.wrap = false; o2.w = Math.max(o2.w, w * kx * 1.25); }
                else if (pxNum(cs.fontSize) >= 14 && !ctr && !right) { o2.wrap = false; o2.w = Math.max(o2.w * 1.15, (B.right - u.left) * kx - 0.3); } // 제목·리드: PC 글꼴이 넓어도 줄바꿈 없이
                else if (!ctr && !right) { const edge = r.right - pxNum(cs.paddingRight) - B.left; o2.w = Math.max(o2.w, (edge - (u.left - B.left)) * kx); }
                else o2.wrap = false;
              }
            }
            slide.addText(runs, o2);
          }
        }
        Array.from(e.children).forEach(c => { if (PPT_INLINE[c.tagName] && getComputedStyle(c).display.indexOf('inline') === 0) return; visit(c); });
      })(sl);
    }
    const nm = String(pptx.title).replace(/[\\/:*?"<>|]/g, '').slice(0, 60) || 'TK 장표';
    await pptx.writeFile({ fileName: `${nm}.pptx` });
  } catch (err) {
    console.error(err); alert('PPT 변환 중 오류: ' + err.message);
  } finally {
    document.body.classList.remove('pptx-capture');
    btn.disabled = false; btn.textContent = oldTxt;
  }
}

function downloadFileBlob(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

window.addEventListener('DOMContentLoaded', () => {
  $('input').value = PRESETS.strategy;
  renderDeck();

  $('btnMake').addEventListener('click', () => renderDeck());
  $('input').addEventListener('input', () => renderDeck());

  $('themeSelect').addEventListener('change', e => {
    document.body.setAttribute('data-theme', e.target.value);
    renderDeck();
  });

  $('deckPreset').addEventListener('change', e => {
    const key = e.target.value;
    if (PRESETS[key]) {
      slideAltState = {};
      $('input').value = PRESETS[key];
      renderDeck();
      $('out').scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  $('btnCycleAllAlt').addEventListener('click', () => {
    if (!currentDeck) return;
    currentDeck.slides.forEach((_, idx) => {
      const cur = slideAltState[idx] || { altIdx: 0, directKey: '' };
      slideAltState[idx] = { altIdx: cur.altIdx + 1, directKey: '' };
    });
    renderDeck();
  });

  $('btnResetAllAlt').addEventListener('click', () => {
    slideAltState = {};
    renderDeck();
  });

  $('btnClear').addEventListener('click', () => {
    slideAltState = {};
    $('input').value = '';
    renderDeck();
  });

  $('btnExportPptx').addEventListener('click', exportDeckToPPTX);
  $('btnDownloadConverter').addEventListener('click', () => {
    downloadFileBlob(document.documentElement.outerHTML, 'make.html', 'text/html;charset=utf-8');
  });
  $('btnDownloadSkill').addEventListener('click', () => {
    downloadFileBlob(SKILL_MD_TEXT, 'SKILL.md', 'text/markdown;charset=utf-8');
  });

  $('btnAudit').addEventListener('click', () => {
    const modal = $('auditModal');
    const body = $('auditModalBody');
    if (currentAudit) {
      $('auditModalTitle').textContent = `10대 무결성 · 정수 번호 · 고밀도 충전율 감리 리포트 (${currentAudit.score}점 · 평균 충전율 ${currentAudit.avgFill}%)`;
      body.innerHTML = currentAudit.checks.map(c => `
        <div class="audit-row">
          <span style="font-weight:800;color:${c.pass ? 'var(--c-pos)' : 'var(--c-warn)'};flex-shrink:0;">${c.pass ? '✓ 통과' : '⚠ 점검'}</span>
          <div>
            <div style="font-weight:700;color:var(--c-ink);">${esc(c.title)}</div>
            <div style="font-size:11.5px;color:var(--c-muted);margin-top:2px;">${esc(c.detail)}</div>
          </div>
        </div>
      `).join('');
    }
    modal.classList.add('open');
  });

  $('btnCloseModal').addEventListener('click', () => {
    $('auditModal').classList.remove('open');
  });

  $('auditModal').addEventListener('click', e => {
    if (e.target === $('auditModal')) $('auditModal').classList.remove('open');
  });
});
</script>
</body>
</html>
